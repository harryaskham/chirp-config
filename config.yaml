# chirp config (local; Collective can take this over later).
output:
  sink: vsink_fx          # notifications
outputs:
  music: {server: "tcp:sgu24:4713", sink: vsink_music, role: music}
  fx: {server: "tcp:sgu24:4713", sink: vsink_fx}
  # pocket4-local null sink (48 kHz): no network in the loop — deterministic for benchmark runs
  chirp: {server: "unix:/run/user/1000/pulse/native", sink: chirp, role: music}

# Live audio for `input` tracks (docs/inputs.md): agent speech on sgu24.
inputs:
  tts: "pulse://sgu24:4713/vsink_agent_tts.monitor"
  caco: "pulse://sgu24:4713/vsink_cacophony.monitor"
