# Song forms for `chirp --evolve`: name → sections [section, roles, transition].
# Roles: low mid high half brk (drums: the first present wins) riff hook solo pad soft arp hold.
# Sections named `final` are lifted 2 semitones; transitions: riser impact revcym.
rock:
  - [intro, [soft], ~]
  - [intro2, [soft, low, hold], riser]
  - [verse, [mid, riff], impact]
  - [verse, [mid, riff, arp], ~]
  - [pre, [half, hold, pad], riser]
  - [chorus, [high, riff, hook, pad], impact]
  - [chorus, [high, riff, hook, pad], ~]
  - [verse2, [mid, riff, arp], impact]
  - [chorus, [high, riff, hook, pad], impact]
  - [break, [brk, hold], revcym]
  - [solo, [high, riff, solo], impact]
  - [pre, [half, hold, pad, arp], riser]
  - [final, [high, riff, hook, pad, arp], impact]
  - [final, [high, riff, hook, pad, arp], ~]
  - [outro, [soft, hold, low], revcym]
edm:
  - [intro, [low], ~]
  - [intro2, [low, soft], ~]
  - [build, [mid, riff], riser]
  - [drop, [high, riff, hook, pad], impact]
  - [drop, [high, riff, hook, pad, arp], ~]
  - [break, [soft, arp], revcym]
  - [break, [soft, arp, hold], ~]
  - [build, [mid, riff, arp], riser]
  - [final, [high, riff, hook, pad, arp], impact]
  - [final, [high, riff, hook, pad], ~]
  - [outro, [low, soft], revcym]
breakdown:
  - [intro, [brk, hold], revcym]
  - [break, [half, riff], impact]
  - [break, [half, riff, pad], ~]
  - [build, [mid, riff, arp], riser]
  - [drop, [high, riff, hook], impact]
  - [drop, [high, riff, hook, pad], ~]
  - [break, [brk, hold, pad], revcym]
  - [final, [high, riff, hook, pad], impact]
  - [outro, [brk, hold], revcym]
classical:
  - [A, [pad, riff], ~]
  - [A, [pad, riff, hook], ~]
  - [B, [soft, arp], ~]
  - [B, [soft, arp, hook], riser]
  - [final, [pad, riff, hook, high], impact]
  - [coda, [soft], revcym]
