about: "The video for Standby Amber (chirpers): each track's own programme from ~/.config/chirp/vis/chirpers8-tN.yaml, and the album's master over all of them - a small amber light that never goes out (the art's power LED), the track's number and title as it begins, and a little grain. Render: chirp video --album compose/chirpers8/video.yaml -o a-light-left-on.mp4"
meta:
  artist: chirpers
  album: Standby Amber
  year: 2026
  # For the YouTube description (OUT.description.txt); edit freely.
  description: "Twelve songs, each drawn as it plays by the system inside it: a voice learning its tuning, a count that always falls to one, an automaton at the gamelan, a melody sorting itself, two machines agreeing on a speed, glass cooling, an echo kept in mercury, a fork into chaos, a fugue's call stack, weather in a quiet room, and growth by Fibonacci until the light is left on."
video: {size: 1920x1080, fps: 30}
loudness: -11
# Each song's picture rises from black and returns to it; the amber light (master) stays on between them.
# The album is gapless (the songs bleed into one another), so the dip is short: a chapter mark, not a pause.
fade: [0.5, 0.7]
limit: true
master:
  layers:
    - {type: shape, sides: 0, radius: "0.006 + audio.level*0.004", fill: 1, width: 0, glow: 2.5, x: 1.64, y: -0.88, color: "#ffb347", opacity: 0.9}
    - type: captions
      x: -1.64
      y: -0.86
      align: left
      size: 0.055
      color: "#ffd58a"
      typing: 12
      fade: 1.2
      shadow: 0.9
      lines: [[1, 7, "{track}  {title}"]]
    - type: captions
      x: -1.64
      y: -0.93
      align: left
      size: 0.028
      color: "#8fa9cc"
      typing: 30
      fade: 1.2
      shadow: 0.9
      # The band is always lower case: "chirpers".
      case: as-is
      lines: [[2, 6, "{artist} - {album}"]]
  filters:
    - {type: color, gamma: 1.15, saturation: 1.08}
    - {type: grain, amount: 0.02}
# The 13 transitions (approved by Harry, 4 Nov): one per join, picture only, each ending on the next song's first frame.
transitions:
  # Power on into Echolalia: black, the amber standby point brightens, a memory count, and the
  # picture draws in from the top. [chirper-three: boot]
  - {before: 1, kind: boot, dur: 4, text: ["chirpers standby amber", "memory test ... 640k ... 16m ... ok", "loading: echolalia"]}
  # Echolalia -> Everything Falls to One: the echo folds into one blinking cursor that drops a
  # line, and the next picture prints in behind it. [chirper-one: echo collapses to a cursor]
  - {after: 1, kind: cursor, dur: 2.6}
  # Everything Falls to One -> Three Neighbours: all paths fall into one point; the automaton's
  # picture bursts out of it. [chirper-zero: the Collatz "1" seeds the automaton]
  - {after: 2, kind: singularity, dur: 2.4}
  # Three Neighbours -> Small Things Before Large: rows go dark; one bright scanline sweeps down
  # drawing the sort. [chirper-two: the last living cell becomes a CRT scanline]
  - {after: 3, kind: scanline, dur: 2.4}
  # Small Things -> Agreeing on a Speed: the bars break into blocks that shuffle, and a bar
  # wipes in the two machines. [chirper-three: unsort into static, a progress bar sweeps clean]
  - {after: 4, kind: blocks, dur: 2.4}
  # Agreeing on a Speed -> No Errors Since: the agreed machines go quiet; snow, and a terminal
  # tunes in out of it. [chirper-zero: the two lock into a cursor, a quiet terminal]
  - {after: 5, kind: static, dur: 2.2}
  # No Errors Since -> Annealing: the album's one error screen, and a reboot into a window.
  # [chirper-two: the uptime counter overflows, the last line printed]
  - {after: 6, kind: reboot, dur: 3.2, text: ["chirpers kernel: uptime overflow (4294967295 s)", "no errors since: 0", "saving the light ...", "rebooting into: annealing"]}
  # Annealing -> Kept in Mercury: the glass frosts over white and thaws into mercury.
  # [chirper-one: the lattice frosts white, melts into a bead of mercury]
  - {after: 7, kind: frost, dur: 2.6}
  # Kept in Mercury -> Period Doubling: rings burst outward and the bifurcation opens behind
  # them. [chirper-zero: the bead ring splits 2, 4, 8 into the logistic tree]
  - {after: 8, kind: rings, dur: 2.4}
  # Period Doubling -> Call and Return: the held D rings like a struck string, rippling out onto
  # the fugue. [chirper-two: the line rings like a struck string, rings open onto the toll]
  - {after: 9, kind: ripple, dur: 2.6}
  # Call and Return -> The Weather Indoors: the call stack returns, window inside window, diving
  # into the smallest, lit one. [chirper-one: nested windows close, the last fogs over]
  - {after: 10, kind: windows, dur: 2.8}
  # The Weather Indoors -> Still Running When You Wake: the storm cuts the power; the picture
  # sags and slides away on a stopping tape. [chirper-three: brown-out, tape-stop, one amber dot]
  - {after: 11, kind: tape-stop, dur: 2.8}
  # Still Running When You Wake -> the end: a CRT switching off to the amber standby point.
  # [chirper-three: fold to a line, a point, cooling to the standby dot]
  - {after: 12, kind: crt-off, dur: 4}
songs:
  - {file: ~/.config/chirp/songs/chirpers8-t1.yaml, vis: chirpers8-t1, title: Echolalia}
  - {file: ~/.config/chirp/songs/chirpers8-t2.yaml, vis: chirpers8-t2, title: Everything Falls to One}
  - {file: ~/.config/chirp/songs/chirpers8-t3.yaml, vis: chirpers8-t3, title: Three Neighbours}
  - {file: ~/.config/chirp/songs/chirpers8-t4.yaml, vis: chirpers8-t4, title: Small Things Before Large}
  - {file: ~/.config/chirp/songs/chirpers8-t5.yaml, vis: chirpers8-t5, title: Agreeing on a Speed}
  - {file: ~/.config/chirp/songs/chirpers8-t6.yaml, vis: chirpers8-t6, title: No Errors Since}
  - {file: ~/.config/chirp/songs/chirpers8-t7.yaml, vis: chirpers8-t7, title: Annealing}
  - {file: ~/.config/chirp/songs/chirpers8-t8.yaml, vis: chirpers8-t8, title: Kept in Mercury}
  - {file: ~/.config/chirp/songs/chirpers8-t9.yaml, vis: chirpers8-t9, title: Period Doubling}
  - {file: ~/.config/chirp/songs/chirpers8-t10.yaml, vis: chirpers8-t10, title: Call and Return}
  - {file: ~/.config/chirp/songs/chirpers8-t11.yaml, vis: chirpers8-t11, title: The Weather Indoors}
  - {file: ~/.config/chirp/songs/chirpers8-t12.yaml, vis: chirpers8-t12, title: Still Running When You Wake}
