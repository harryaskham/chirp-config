# The cover of Accretion: the record's own black hole, drawn by chirp.
# The layers are the built-in look accretion3d's (the film's hole: t2's last act and every seam),
# held still: its eight bands of specks, one a track, in the elements' colours, over the glowing
# gas; seen almost edge-on, the far side bent up over the shadow into a halo; the ring a little
# off-true (the camera's roll). No jet, no rocks, no text. It reads nothing from a song.
# Draw it (pin 97a13ae6 or later; 3 s of silence stands in for a song):
#   ffmpeg -f lavfi -i anullsrc=r=48000:cl=stereo -t 3 -c:a pcm_s16le silence.wav
#   chirp video --vis cover-look.yaml --audio silence.wav --still 1 --warmup 0 --no-safety --size 3000x3000 -o cover-3000.png
# The same file at --size 2560x1440 is the film's thumbnail (the whole disk fits a wide frame).
# The whole disk in a square instead: camera zoom 0.92 (and y "0.14*4.2", roll 0.02 for more tilt).
scenes:
  - at: 0
    look:
      palette: elements
      background: "#000000"
      camera:
        x: 0
        y: "0.1*4.2"
        z: "0 - 4.2"
        look_at: [0, 0.0, 0]
        roll: 0.012
        zoom: 1.6
      layers:
        - {type: stars, count: 900, speed: 0, streak: 1}
        - {type: mesh, shape: torus, detail: 128, cull: true, tube: 0.6, sy: 0.006, scale: "(1.9 + 0.35)/1.2", blend: add, opacity: "0.99*step(0.001, 0.9)", palette: ember, colour: v, pos: 0.25, spread: 1.0, light: 0, ambient: 0, rim: 0, paint: "2*0.9*1.0*(0.25 + 0.75*clamp(fbm(cos(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), sin(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), (len(vtx.x, vtx.z)/0.9)*2)*1.8 + 0.35, 0, 1))*clamp((1.38 - (len(vtx.x, vtx.z)/0.9))*1.3, 0, 1.2)*(0.5 + 0.7*0.55)*step(0, 0 - vtx.x*camera.x - vtx.z*camera.z)"}
        - {type: motes, mode: orbit, side: behind, count: 12000, inner: 0.55, radius: "1.9 + 0.35", bands: 8, spin: "0.6 + time.bpm*0.3 + album.progress*0.3", life: 6, flat: 0.97, size: 0.009, glow: "0.2*(0.35 + 0.55*0.6)", twinkle: 0.25, spread: 0.9}
        - {type: motes, mode: infall, side: behind, seed: 3, count: 4000, radius: "1.9 + 0.35", life: 7, spin: 1.4, flat: 0.95, size: 0.007, glow: "0.2*(0.25 + 0.55*0.4)", twinkle: 0.3, spread: 0.6}
        - {type: lens, radius: "(0.62 + 0.3*0.04)*(1 + 0*1.2 + (1 - 1)*0.8)", hole: 0.7, redshift: 0.45, ring: 0.6}
        - {type: motes, mode: orbit, side: front, count: 12000, inner: 0.55, radius: "1.9 + 0.35", bands: 8, spin: "0.6 + time.bpm*0.3 + album.progress*0.3", life: 6, flat: 0.97, size: 0.009, glow: "0.2*(0.35 + 0.55*0.6)", twinkle: 0.25, spread: 0.9}
        - {type: motes, mode: infall, side: front, seed: 3, count: 4000, radius: "1.9 + 0.35", life: 7, spin: 1.4, flat: 0.95, size: 0.007, glow: "0.2*(0.25 + 0.55*0.4)", twinkle: 0.3, spread: 0.6}
        - {type: mesh, shape: torus, detail: 128, cull: true, tube: 0.6, sy: 0.006, scale: "(1.9 + 0.35)/1.2", blend: add, opacity: "0.99*step(0.001, 0.9)", palette: ember, colour: v, pos: 0.25, spread: 1.0, light: 0, ambient: 0, rim: 0, paint: "2*0.9*1.0*(0.25 + 0.75*clamp(fbm(cos(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), sin(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), (len(vtx.x, vtx.z)/0.9)*2)*1.8 + 0.35, 0, 1))*clamp((1.38 - (len(vtx.x, vtx.z)/0.9))*1.3, 0, 1.2)*(0.5 + 0.7*0.55)*step(0, vtx.x*camera.x + vtx.z*camera.z)"}
      filters:
        - {type: bloom, threshold: 0.55, amount: 0.75}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
        - {type: aa}
fade: [0, 0]
