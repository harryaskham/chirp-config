about: "A Light Left On, 11 The Weather Indoors: a house steered by a strange attractor. The Lorenz attractor turns over the room - its two lobes are the song's two harmonic worlds - with rain on the rain tracks, thunder in the clouds and frost at the end."
looks:
  weather:
    # Indoors: the weather in a lamp-lit room (violet dusk, rose, lamp amber), not the sky outside.
    palette: [ "#07040c", "#2a1236", "#7a2c52", "#c8566a", "#f0a060", "#ffe2b8" ]
    # storm: how much weather is in the room (the intro's gated pads to C's peak).
    params: {storm: 0.6}
    env: {thunder: {on: track.thunder, decay: 1.2s}}
    vars: {turn: {integrate: "0.01 + audio.level*0.03 + param.storm*0.01"}}
    layers:
      - {type: noise, res: 0.38, scale: 1.1, speed: "0.03 + param.storm*0.06 + audio.mid*0.2", octaves: 4, warp: "0.8 + param.storm*1.2", spread: 0.32, threshold: 0.4, pos: 0.08, light: "0.18 + param.storm*0.2 + env.thunder*0.5"}
      - {type: attractor, kind: lorenz, points: "3000 + param.storm*5000", speed: "0.6 + param.storm*0.8 + audio.level*1.5", size: 0.75, rotate: var.turn, gain: "0.9 + param.storm*0.9", spread: 0.6, pos: 0.45}
      - {type: particles, on: track.rainL, count: 6, speed: 1.4, dir: 0.72, spread: 0.02, gravity: 1, life: 1.2, x: -0.9, y: 1.1, jitter: 0.9, size: 0.002, pos: 0.6, shape: spark}
      - {type: particles, on: track.rainR, count: 6, speed: 1.4, dir: 0.72, spread: 0.02, gravity: 1, life: 1.2, x: 0.9, y: 1.1, jitter: 0.9, size: 0.002, pos: 0.6, shape: spark}
    filters:
      - {type: camera, zoom: "1.02 + scene.progress*0.1", rotate: "scene.progress*0.03"}
      - {type: feedback, zoom: 1.0, decay: 0.9}
      - {type: bloom, threshold: 0.5, amount: 0.6}
      - {type: vignette, amount: 0.55}
  frost:
    extends: crystal
    palette: ice
  eye:
    palette: storm
    vars: {turn: {integrate: "0.02 + audio.level*0.05"}}
    layers:
      - {type: gradient, radial: 1, spread: 0.25, pos: 0.05, light: 0.3}
      - {type: attractor, kind: lorenz, points: 8000, speed: "0.6 + audio.level", size: 0.5, rotate: var.turn, gain: 1.6, spread: 0.5, pos: 0.55}
      - {type: rings, count: 4, speed: 0.15, tunnel: 0, duty: 0.04, soft: 0.03, spread: 0.2, pos: 0.4, opacity: 0.4}
    filters:
      - {type: feedback, zoom: 0.99, rotate: 0.01, decay: 0.92}
      - {type: bloom, threshold: 0.45, amount: 0.7}
      - {type: vignette, amount: 0.6}
scenes:
  # intro 1-16 gated pads, A 17-48 the lead, B 49-80 full, break 81-96 the attractor alone,
  # C 97-136 the peak, outro 137-168 thinning into frost.
  - {at: 0, look: weather, params: {storm: 0.15}}
  - {at: 16bar, look: weather, params: {storm: 0.5}, xfade: 4s}
  - {at: 48bar, look: weather, params: {storm: 0.75}, xfade: 2s}
  - {at: 80bar, look: eye, xfade: 4s, transition: iris}
  - {at: 96bar, look: weather, params: {storm: 1}, xfade: 4s}
  - {at: 136bar, look: frost, xfade: 8s, transition: rise}
