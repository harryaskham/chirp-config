about: "Prefab (3D, use in a group): a living world lit by the scene's own lights. Continents rise from fractal noise (fbm), coloured by height from ocean to ice; clouds swirl over them, bright by day and faint by night; cities glow on land on the night side only (paint reading vtx.lit); an atmosphere hugs its edge. Its day and night follow wherever the scene's lights are, so worlds round a star each show their own terminator. Params: size, sea (higher: more land), clouds, cities, air (the atmosphere), spin (turns a second), seed (a different world)."
params: {size: 1, sea: 0.15, clouds: 1, cities: 1, air: 1, spin: 0.006, seed: 0}
layers:
  - {type: mesh, shape: sphere, detail: 128, scale: param.size, ry: "time.t*param.spin", rz: 0.065, displace: "0.035*clamp(fbm(vtx.x*1.6 + param.seed*13, vtx.y*1.6 + param.seed*7, vtx.z*1.6)*3 + param.sea, 0, 1)", colour: height, palette: ["#08205a", "#0e3a7a", "#2a5a2a", "#5a6a2a", "#8a7a5a", "#e8e8f0"], pos: 0.02, spread: 0.55, light: 0, ambient: 0.01, rim: "1.4*param.air", rim_color: "#5a9aff", rim_power: 4, paint: "param.cities*step(vtx.lit, 0.04)*step(0.05, clamp(fbm(vtx.x*1.6 + param.seed*13, vtx.y*1.6 + param.seed*7, vtx.z*1.6)*3 + param.sea, 0, 1))*step(0.62, hash(floor(vtx.x*70)*7.1 + floor(vtx.y*70)*13.3 + floor(vtx.z*70)*3.7 + param.seed))*clamp(fbm(vtx.x*6, vtx.y*6 + 9 + param.seed, vtx.z*6)*4 + 0.2, 0, 1)*2.5*(0.8 + 0.4*audio.level)", paint_color: "#ffc070", paint_fine: true}
  - {type: mesh, shape: sphere, detail: 96, scale: "param.size*1.03", ry: "time.t*param.spin*1.25", rz: 0.065, color: "#303030", blend: add, light: 0, ambient: 0, rim: 0, paint: "param.clouds*clamp(fbm(vtx.x*2.4 + 7 + param.seed*5, vtx.y*3, vtx.z*2.4)*3 - 0.05, 0, 1)*clamp(vtx.lit*15, 0.04, 1)*(0.7 + 0.3*audio.low)", paint_color: "#ffffff"}
