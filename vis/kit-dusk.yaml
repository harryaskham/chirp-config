about: "Prefab (use first in a 3D look, in a group): a dusk sky that turns with the camera (low sun, horizon haze) with faint stars. Params: sun (round the horizon, turns), height (the sun's height, turns)."
params: {sun: 0.15, height: 0.015}
layers:
  - {type: sky, zenith: "#0d1b3d", horizon: "#f08a4b", ground: "#1a1420", sun: "#ffd9a0", sun_yaw: param.sun, sun_height: param.height, sun_size: 0.05, glow: 1.4, haze: 0.1}
  - {type: stars, count: 900, speed: 0.002, streak: 1, opacity: 0.5}
