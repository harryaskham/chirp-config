# chirpers9 t7 "Marginally Bound": the album's crest; the hardest, fastest, densest
# track, everything colliding. Two acts:
#   I  (0:00) the hole's disk turning fast, the camera shaking on the hits; three worlds
#      drift in one after another and are torn apart (0:32, 1:12, 1:52), each one's
#      debris winding into the hole and bent round the shadow, with sparks and jets;
#   II (2:30) two holes, each with its own disk and lens, spiral in faster and faster,
#      a stream of matter between them; at 3:52 they merge in a flash, a shockwave
#      ring goes out and the new hole's shadow rings as it settles; jets at the lifts.
scenes:
  - at: 0
    look:
      background: "#000000"
      palette: elements
      env:
        w1: {at: [32], decay: 3}
        w2: {at: [72], decay: 3}
        w3: {at: [112], decay: 3}
        crest: {on: audio.lift, decay: 2.5}
        hit: {on: audio.onset, decay: 0.15}
      camera: {x: "2.8*sin(time.t*0.03)", y: "0.6 + 0.2*sin(time.t*0.05)", z: "0 - 2.8*cos(time.t*0.03)", look_at: [0, 0, 0], roll: "0.03*env.hit*sin(time.t*30)"}
      layers:
        - {type: stars, count: 1800, speed: 0.004, streak: 1}
        - {type: motes, mode: orbit, tracks: auto, side: behind, count: 9000, inner: 0.55, radius: 1.9, bands: 7, spin: "1.4 + time.bpm*0.4", life: 5, flat: 0.96, size: 0.007, glow: "0.6 + audio.level*0.6", twinkle: 0.3, spread: 1}
        - {type: mesh, shape: sphere, detail: 40, opacity: "clamp((time.t - 32 + 16)*0.5, 0, 1)", x: "(2.4*(0.62 + 0.5*clamp((32 - time.t)/12, 0, 1)))*cos((min(time.t, 32)*0.03 + 0.15))", y: "0.05", z: "(2.4*(0.62 + 0.5*clamp((32 - time.t)/12, 0, 1)))*sin((min(time.t, 32)*0.03 + 0.15))", scale: 0.26, ry: "time.t*0.03", displace: "0.05*clamp(fbm(vtx.x*1.8 + 3, vtx.y*1.8, vtx.z*1.8)*3 + 0.15, 0, 1)", colour: height, palette: ["#08205a", "#0e3a7a", "#2a5a2a", "#5a6a2a", "#8a7a5a", "#e8e8f0"], spread: 0.55, light: 0.3, ambient: 0.05, rim: 1.2, rim_color: "#5a9aff", rim_power: 4, paint: "clamp(time.t - 32 + 5, 0, 5)*0.5*pow(clamp(1 - abs(noise3(vtx.x*5, vtx.y*5, vtx.z*5))*4, 0, 1), 2)", paint_color: "#ff7020", shatter: env.w1.age, burst: 0.08, drop: 0, tumble: 0.7, sink: [0, 0, 0], pull: 0.07, swirl: 0.12}
        - {type: motes, mode: emit, spawn: env.w1, count: 600, from: ["2.4*0.62*cos((min(time.t, 32)*0.03 + 0.15))", 0.05, "2.4*0.62*sin((min(time.t, 32)*0.03 + 0.15))"], wobble: 0.9, fall: 0, drag: 0.6, life: 4, streak: 0.08, size: 0.006, glow: 1.6, twinkle: 0.4, palette: ember, spread: 0.6, near: 0.3}
        - {type: mesh, shape: sphere, detail: 40, opacity: "clamp((time.t - 72 + 16)*0.5, 0, 1)", x: "(2.4*(0.62 + 0.5*clamp((72 - time.t)/12, 0, 1)))*cos((min(time.t, 72)*0.03 + 0.55))", y: "0.1", z: "(2.4*(0.62 + 0.5*clamp((72 - time.t)/12, 0, 1)))*sin((min(time.t, 72)*0.03 + 0.55))", scale: 0.26, ry: "time.t*0.03", displace: "0.05*clamp(fbm(vtx.x*1.8 + 11, vtx.y*1.8, vtx.z*1.8)*3 + 0.15, 0, 1)", colour: height, palette: ["#08205a", "#0e3a7a", "#2a5a2a", "#5a6a2a", "#8a7a5a", "#e8e8f0"], spread: 0.55, light: 0.3, ambient: 0.05, rim: 1.2, rim_color: "#5a9aff", rim_power: 4, paint: "clamp(time.t - 72 + 5, 0, 5)*0.5*pow(clamp(1 - abs(noise3(vtx.x*5, vtx.y*5, vtx.z*5))*4, 0, 1), 2)", paint_color: "#ff7020", shatter: env.w2.age, burst: 0.08, drop: 0, tumble: 0.7, sink: [0, 0, 0], pull: 0.07, swirl: 0.12}
        - {type: motes, mode: emit, spawn: env.w2, count: 600, from: ["2.4*0.62*cos((min(time.t, 72)*0.03 + 0.55))", 0.1, "2.4*0.62*sin((min(time.t, 72)*0.03 + 0.55))"], wobble: 0.9, fall: 0, drag: 0.6, life: 4, streak: 0.08, size: 0.006, glow: 1.6, twinkle: 0.4, palette: ember, spread: 0.6, near: 0.3}
        - {type: mesh, shape: sphere, detail: 40, opacity: "clamp((time.t - 112 + 16)*0.5, 0, 1)", x: "(2.4*(0.62 + 0.5*clamp((112 - time.t)/12, 0, 1)))*cos((min(time.t, 112)*0.03 + 0.85))", y: "0.15000000000000002", z: "(2.4*(0.62 + 0.5*clamp((112 - time.t)/12, 0, 1)))*sin((min(time.t, 112)*0.03 + 0.85))", scale: 0.26, ry: "time.t*0.03", displace: "0.05*clamp(fbm(vtx.x*1.8 + 19, vtx.y*1.8, vtx.z*1.8)*3 + 0.15, 0, 1)", colour: height, palette: ["#08205a", "#0e3a7a", "#2a5a2a", "#5a6a2a", "#8a7a5a", "#e8e8f0"], spread: 0.55, light: 0.3, ambient: 0.05, rim: 1.2, rim_color: "#5a9aff", rim_power: 4, paint: "clamp(time.t - 112 + 5, 0, 5)*0.5*pow(clamp(1 - abs(noise3(vtx.x*5, vtx.y*5, vtx.z*5))*4, 0, 1), 2)", paint_color: "#ff7020", shatter: env.w3.age, burst: 0.08, drop: 0, tumble: 0.7, sink: [0, 0, 0], pull: 0.07, swirl: 0.12}
        - {type: motes, mode: emit, spawn: env.w3, count: 600, from: ["2.4*0.62*cos((min(time.t, 112)*0.03 + 0.85))", 0.15000000000000002, "2.4*0.62*sin((min(time.t, 112)*0.03 + 0.85))"], wobble: 0.9, fall: 0, drag: 0.6, life: 4, streak: 0.08, size: 0.006, glow: 1.6, twinkle: 0.4, palette: ember, spread: 0.6, near: 0.3}
        - {type: lens, radius: "0.62 + audio.low*0.05", hole: 0.42, redshift: 0.45, ring: 0.6}
        - {type: motes, mode: orbit, tracks: auto, side: front, count: 9000, inner: 0.55, radius: 1.9, bands: 7, spin: "1.4 + time.bpm*0.4", life: 5, flat: 0.96, size: 0.007, glow: "0.6 + audio.level*0.6", twinkle: 0.3, spread: 1}
        - {type: beam, count: 2, from: [0, "(inst.i*2 - 1)*0.1", 0], to: [0, "(inst.i*2 - 1)*(0.6 + 2.6*max(env.crest, max(env.w1, max(env.w2, env.w3))))", 0], samples: 40, width: 0.02, taper: -2.5, glow: "0.6*max(env.crest, max(env.w1, max(env.w2, env.w3)))", fade: 0.7, color: "#bcd8ff"}
      filters:
        - {type: chroma, amount: "0.006*env.hit"}
        - {type: bloom, threshold: 0.55, amount: 0.75}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
  - at: 150
    transition: dissolve
    xfade: 3
    look:
      background: "#000000"
      vars:
        sep: {value: {keys: [[150, 1.2], [226, 0.35], [232, 0.0]], ease: in}}
        ang: {integrate: "0.05*pow(1.25/(var.sep + 0.05), 1.5)"}
        merged: {value: "step(232, time.t)"}
      env:
        crest: {on: audio.lift, decay: 2.5}
      camera: {x: "2.5*sin(time.t*0.02)", y: 0.8, z: "0 - 2.5*cos(time.t*0.02)", look_at: [0, -0.35, 0]}
      layers:
        - {type: stars, count: 2600, speed: 0.002, streak: 1}
        - {type: motes, mode: orbit, tracks: auto, count: 5000, x: "var.sep*cos(var.ang)", z: "var.sep*sin(var.ang)", inner: 0.18, radius: "0.75 + 0.5*var.merged", bands: 4, spin: "0.8 + time.bpm*0.3", life: 4, flat: 0.96, size: 0.008, glow: "0.4 + audio.level*0.6", twinkle: 0.25, spread: 0.6, palette: elements}
        - {type: motes, mode: orbit, count: 5000, seed: 9, x: "0 - var.sep*cos(var.ang)", z: "0 - var.sep*sin(var.ang)", inner: 0.18, radius: "0.6 + 0.6*var.merged", bands: 3, spin: "0.8 + time.bpm*0.3", life: 4, flat: 0.96, size: 0.008, glow: "0.4 + audio.level*0.6", twinkle: 0.25, spread: 0.6, palette: ember}
        - {type: beam, opacity: "1 - var.merged", from: ["var.sep*cos(var.ang + 0.04)*0.6", 0, "var.sep*sin(var.ang + 0.04)*0.6"], to: ["0 - var.sep*cos(var.ang - 0.06)*0.75", 0, "0 - var.sep*sin(var.ang - 0.06)*0.75"], sag: -0.08, samples: 50, width: 0.012, glow: "0.6 + audio.low", palette: ember, spread: 0.6, pulses: 5, speed: 0.8}
        # Two lenses, then one: the merged hole's shadow rings as it settles.
        - {type: lens, opacity: "1 - var.merged", x: "var.sep*cos(var.ang)", y: 0, z: "var.sep*sin(var.ang)", radius: 0.32, hole: 0.42, redshift: 0.45, ring: 0.5}
        - {type: lens, opacity: "1 - var.merged", x: "0 - var.sep*cos(var.ang)", y: 0, z: "0 - var.sep*sin(var.ang)", radius: 0.26, hole: 0.42, redshift: 0.45, ring: 0.5}
        - {type: lens, opacity: "var.merged", x: 0, y: 0, z: 0, radius: "0.42*(1 + 0.25*spring(time.t - 232, 2.2, 1.6))", hole: 0.42, redshift: 0.5, ring: 0.7}
        - {type: beam, count: 2, opacity: "var.merged", from: [0, "(inst.i*2 - 1)*0.1", 0], to: [0, "(inst.i*2 - 1)*(0.8 + 2.4*env.crest)", 0], samples: 40, width: 0.025, taper: -2.5, glow: "0.7*env.crest", fade: 0.7, color: "#bcd8ff"}
        - {type: mesh, shape: torus, detail: 64, tube: 0.03, sy: 0.3, opacity: "0.8*clamp(1 - (time.t - 232)/3, 0, 1)*step(232, time.t)", scale: "0.2 + 1.8*clamp(time.t - 232, 0, 3)", color: "#ffe0c0", light: 0, ambient: 0, rim: 0, emit: 2}
      filters:
        - {type: bloom, threshold: 0.55, amount: 0.75}
        - {type: color, exposure: {keys: [[231.8, 1], [232.1, 5], [234, 1]], ease: out}}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
