about: "Prefab (3D, use in a group): a crowd of dancers in a loose grid, each with its own height, timing and energy (hash of its number), all facing a point that can move (fx, fz: the stage, the camera, a performer), with two glinting eyes on the side each head faces. Params: cols, rows, gap (spacing), fx, fz (where they look, in the group's own coordinates), energy, eyes (their glint, 0 for none)."
params: {cols: 8, rows: 6, gap: 0.42, fx: 0, fz: 4, energy: 1, eyes: 1}
layers:
  - {type: figure, name: c, count: 64, rig: human, motion: dance, opacity: "step(inst.i + 0.5, param.cols*param.rows)", x: "(fract(inst.i/param.cols)*param.cols - (param.cols - 1)/2)*param.gap + 0.08*(hash(inst.i) - 0.5)", z: "(floor(inst.i/param.cols) - (param.rows - 1)/2)*param.gap + 0.1*hash(inst.i + 50)", y: -0.42, scale: "0.3 + 0.07*hash(inst.i + 100)", face: [param.fx, 0, param.fz], phase: "4*hash(inst.i + 200)", energy: "param.energy*(0.5 + 0.7*hash(inst.i + 300))*(0.7 + audio.level*1.5)", color: "#0e0c14", light: 0.3, ambient: 0.02, rim: 1.3}
  - {type: mesh, shape: sphere, count: 128, detail: 6, scale: 0.007, color: "#fff4e0", light: 0, ambient: 0, rim: 0, emit: 3, opacity: "clamp(param.eyes, 0, 1)*step(fract(inst.i/64)*64 + 0.5, param.cols*param.rows)", x: "actor.c.head.x + 0.028*(param.fx - actor.c.head.x)/max(len(param.fx - actor.c.head.x, param.fz - actor.c.head.z), 0.001) - 0.012*(step(64, inst.i)*2 - 1)*(param.fz - actor.c.head.z)/max(len(param.fx - actor.c.head.x, param.fz - actor.c.head.z), 0.001)", y: "actor.c.head.y - 0.03", z: "actor.c.head.z + 0.028*(param.fz - actor.c.head.z)/max(len(param.fx - actor.c.head.x, param.fz - actor.c.head.z), 0.001) + 0.012*(step(64, inst.i)*2 - 1)*(param.fx - actor.c.head.x)/max(len(param.fx - actor.c.head.x, param.fz - actor.c.head.z), 0.001)"}
