about: "Prefab (3D, use in a group): endless land flowing under the camera. Mountains rise from fractal noise (fbm), ridged and sharpened, coloured by height from water through green valleys and rock to snow; a flat sea fills the low ground and shines; the land streams toward the camera at travel (units a second) so a camera standing still flies over it. To fly at a speed that follows the music, set travel: 0 and give shift the distance flown so far (a variable that integrates the speed), so the land never jumps. Lit by the scene's own lights (a low sun gives long shading) and a key light. Params: height (the mountains), scale (how big a mountain is: larger, broader), travel, sea (the water level, 0..1 of the height), seed (another land), pbr (1: physically based and lit per pixel, taking the look's sky and sun), trees (1: conifers on the slopes between the shore and the snow, riding the land as it flows)."
params: {height: 0.6, scale: 1, travel: 0.4, shift: 0, sea: 0.25, seed: 0, pbr: 0, trees: 0}
layers:
  - {type: mesh, shape: plane, detail: 160, opacity: "1 - step(0.5, param.pbr)", scale: 6, displace: "param.height/6*max(param.sea, pow(clamp(1 - abs(fbm(vtx.x*1.6/param.scale + param.seed*17, param.seed*3, vtx.z*1.6/param.scale + (time.t*param.travel + param.shift)/6*1.6/param.scale)), 0, 1), 2.2))", colour: height, palette: ["#16406a", "#2a5a34", "#4a6a30", "#6a6048", "#8a8478", "#e8eef4"], pos: 0, spread: 0.92, light: 1, ambient: 0.08, rim: 0.05, spec: 0.2, shine: 20, lx: 0.6, ly: 0.35, cull: true}
  # Physically based (pbr: 1): lit per pixel, rock and grass matte, lit by the look's sky and sun.
  - {type: mesh, shape: plane, detail: 200, opacity: "step(0.5, param.pbr)", material: pbr, rough: 0.8, shading: pixel, scale: 6, displace: "param.height/6*max(param.sea, pow(clamp(1 - abs(fbm(vtx.x*1.6/param.scale + param.seed*17, param.seed*3, vtx.z*1.6/param.scale + (time.t*param.travel + param.shift)/6*1.6/param.scale)), 0, 1), 2.2))", colour: height, palette: ["#16406a", "#2a5a34", "#4a6a30", "#6a6048", "#8a8478", "#e8eef4"], pos: 0, spread: 0.92, light: 1, ambient: 0.08, rim: 0.05, spec: 0.2, shine: 20, lx: 0.6, ly: 0.35, cull: true}
  # Conifers (trees: 1) on the slopes between the shore and the snow, riding the land.
  - {type: mesh, shape: cone, detail: 6, count: 500, x: "6*((hash(inst.i*1.37 + param.seed)*2 - 1)*0.95)", z: "6*(fract(hash(inst.i*2.91 + param.seed + 7) - (time.t*param.travel + param.shift)/12)*2 - 1)", y: "param.height*max(param.sea, pow(clamp(1 - abs(fbm(((hash(inst.i*1.37 + param.seed)*2 - 1)*0.95)*1.6/param.scale + param.seed*17, param.seed*3, (fract(hash(inst.i*2.91 + param.seed + 7) - (time.t*param.travel + param.shift)/12)*2 - 1)*1.6/param.scale + (time.t*param.travel + param.shift)/6*1.6/param.scale)), 0, 1), 2.2)) + 0.05*param.height", scale: "0.05 + 0.025*hash(inst.i + 3)", sy: 2.8, opacity: "step(0.5, param.trees)*step(param.sea + 0.04, pow(clamp(1 - abs(fbm(((hash(inst.i*1.37 + param.seed)*2 - 1)*0.95)*1.6/param.scale + param.seed*17, param.seed*3, (fract(hash(inst.i*2.91 + param.seed + 7) - (time.t*param.travel + param.shift)/12)*2 - 1)*1.6/param.scale + (time.t*param.travel + param.shift)/6*1.6/param.scale)), 0, 1), 2.2))*step(pow(clamp(1 - abs(fbm(((hash(inst.i*1.37 + param.seed)*2 - 1)*0.95)*1.6/param.scale + param.seed*17, param.seed*3, (fract(hash(inst.i*2.91 + param.seed + 7) - (time.t*param.travel + param.shift)/12)*2 - 1)*1.6/param.scale + (time.t*param.travel + param.shift)/6*1.6/param.scale)), 0, 1), 2.2), 0.72)*step(abs((fract(hash(inst.i*2.91 + param.seed + 7) - (time.t*param.travel + param.shift)/12)*2 - 1)), 0.92)", color: "#142418", light: 0.55, ambient: 0.06, rim: 0.25, rim_color: "#ffc890", lx: 0.6, ly: 0.35}
