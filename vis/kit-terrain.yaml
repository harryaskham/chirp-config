about: "Prefab (3D, use in a group): endless land flowing under the camera. Mountains rise from fractal noise (fbm), ridged and sharpened, coloured by height from water through green valleys and rock to snow; a flat sea fills the low ground and shines; the land streams toward the camera at travel (units a second) so a camera standing still flies over it. Lit by the scene's own lights (a low sun gives long shading) and a key light. Params: height (the mountains), scale (how big a mountain is: larger, broader), travel, sea (the water level, 0..1 of the height), seed (another land)."
params: {height: 0.6, scale: 1, travel: 0.4, sea: 0.25, seed: 0}
layers:
  - {type: mesh, shape: plane, detail: 160, scale: 6, displace: "param.height/6*max(param.sea, pow(clamp(1 - abs(fbm(vtx.x*1.6/param.scale + param.seed*17, param.seed*3, vtx.z*1.6/param.scale + time.t*param.travel/6*1.6/param.scale)), 0, 1), 2.2))", colour: height, palette: ["#16406a", "#2a5a34", "#4a6a30", "#6a6048", "#8a8478", "#e8eef4"], pos: 0, spread: 0.92, light: 1, ambient: 0.08, rim: 0.05, spec: 0.2, shine: 20, lx: 0.6, ly: 0.35, cull: true}
