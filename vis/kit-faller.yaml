about: "Prefab (3D, use in a group placed at a black hole's centre, before the host's lens layer so the lens bends it): a body drifting in from the rim on its own spiral, facing the hole, floating then tumbling, pulled long and fading at the horizon, then coming again. Params: period (seconds per fall), offset (0..1, where in its fall it starts: give instances inst.i/n), radius (where it starts), hue (its colour along the ice palette)."
params: {period: 8, offset: 0, radius: 2.3, hue: 0.3}
palette: ice
vars:
  k: {value: "fract(time.t/param.period + param.offset)"}
layers:
  - {type: figure, rig: human, motion: [float, fall], mix: "smooth(0.4, 0.9, var.k)", face: [0, 0, 0], pos: param.hue, spread: 0.6, scale: "0.32*(1 - 0.5*var.k)", sy: "1 + 3*pow(var.k, 3)", x: "param.radius*pow(1 - var.k, 0.7)*cos(param.offset + 1.2*var.k)", z: "param.radius*pow(1 - var.k, 0.7)*sin(param.offset + 1.2*var.k)", y: "0.25*(1 - var.k)*sin(param.offset*2.3)", opacity: "clamp((1 - var.k)*5, 0, 1)*clamp(var.k*10, 0, 1)", phase: "param.offset*4", energy: 0.8, light: 0.9, ambient: 0.15, rim: 1.0}
