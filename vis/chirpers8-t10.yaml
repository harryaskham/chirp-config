about: "A Light Left On, 10 Call and Return: the fugue machine and its call stack. The four voices scroll as a score in red and white; the stack is a nest of frames that deepens as the subject spawns copies at double and quadruple speed (d1-d3, u1-u3) and unwinds again; the sung lines as they come."
looks:
  stack:
    palette: kraft
    background: "#050505"
    params: {deep: 0, paper: 0}
    env: {kick: {on: track.kit, decay: 200ms}, lift: {on: audio.lift, attack: 30ms, decay: 1.2s}}
    vars:
      depth: {follow: "track.d1.gate + track.d2.gate + track.d3.gate + track.u1.gate + track.u2.gate + track.u3.gate", attack: 100ms, release: 800ms}
    layers:
      - {type: gradient, angle: 0.25, spread: 0.06, pos: "0.5 - param.deep*0.35", light: "0.07 + param.deep*0.08 + env.kick*0.06 + audio.low*0.06"}
      - {type: shape, sides: 4, radius: 0.92, width: 0.003, rotate: 0.125, count: "1 + var.depth*2", scale: 0.84, turn: 0, spread: 0.0, color: "#e8221b", opacity: "0.6 + env.kick*0.4", y: -0.05}
      - {type: notes, mode: roll, tracks: [bell, sync, pwm, bass, d1, d2, d3, u1, u2, u3, sing, sing2, cs], window: 6, playhead: 0.0, size: 0.02, height: 1.5, width: 3.5, spread: 0.5, pos: 0.0, cursor: 0.45, glow: 0.6, palette: ["#f4efe6", "#e8221b"]}
    filters:
      # A new call (the music lifting): the stack leans in.
      - {type: camera, zoom: "1 + env.lift*0.05"}
      - {type: bloom, threshold: 0.42, amount: "0.7 + env.kick*0.3", radius: 0.03}
      - {type: color, contrast: 1.15}
      - {type: invert, amount: "param.paper*0.9"}
      # Paper, not a lamp: the printed score a little darker and warmer than white.
      - {type: color, exposure: "1 - param.paper*0.18", saturation: "1 + param.paper*0.2"}
      - {type: tint, palette: [ "#1b1612", "#efe4cf" ], amount: "param.paper*0.35"}
      - {type: scanlines, amount: 0.12, count: 360}
      - {type: vignette, amount: "0.5 - param.paper*0.3"}
scenes:
  - {at: 0, look: kraft}
  - {at: 8bar, look: stack, xfade: 3s}
  - {at: 56bar, look: stack, params: {deep: 0.5}, xfade: 4s}
  - {at: 80bar, look: stack, params: {deep: 1}, xfade: 4s}
  - {at: 104bar, look: kraft, xfade: 3s, transition: wipe}
  - {at: 112bar, look: stack, params: {paper: 1}, xfade: 3s, transition: iris}
  - {at: 144bar, look: kraft, xfade: 4s}
# The words, where they are sung (found by tools/vislyrics.py from the song's phrase files).
master:
  layers:
    - type: captions
      shadow: 0.7
      size: 0.05
      y: 0.62
      color: "#f4efe6"
      typing: 14
      lines:
        - [214.224b, 1.0, "down the well of mirrors, every landing holds a smaller lamp,", 0.88]  # toy
        - [215.985b, 1.9, "and the smallest one is lit", 0.40]  # toy
        - [224.245b, 9.0, "down the well of mirrors, every landing holds a smaller lamp,", 9.00]  # sing
        - [245.770b, 6.4, "and the smallest one is lit", 4.94]  # sing
        - [320.253b, 1.0, "lit is one smallest the and lamp smaller a", 0.60]  # sing3
        - [321.461b, 2.1, "holds landing every mirrors of well the down", 0.65]  # sing3
        - [535.266b, 2.5, "up the well", 1.05]  # toy
        - [543.248b, 9.0, "up the well of mirrors, every landing hands its lamp along,", 9.00]  # sing2
        - [565.048b, 6.3, "and the highest one is on", 4.80]  # sing2
