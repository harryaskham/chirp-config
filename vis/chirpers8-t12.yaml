about: "A Light Left On, 12 Still Running When You Wake: the closer. An endless tunnel of rings that never arrives (the Shepard choir and the Risset accelerando as pictures), a figure that grows like a plant by Fibonacci steps, and at the very end only the light left on."
looks:
  grow:
    palette: lattice
    params: {grow: 1}
    vars: {turn: {integrate: "0.01 + audio.level*0.04"}}
    env: {kick: {on: track.kick, decay: 350ms}, lift: {on: audio.lift, attack: 40ms, decay: 1.6s}}
    layers:
      - {type: gradient, radial: 1, spread: 0.22, pos: 0.09, light: "0.2 + param.grow*0.004 + audio.low*0.1 + env.lift*0.12"}
      - {type: rings, res: 0.5, count: 6, speed: "0.3 + audio.level*1.2", tunnel: 1, twist: 0, duty: 0.08, soft: 0.06, spread: 0.3, pos: 0.4, opacity: "0.38 + param.grow*0.02"}
      - {type: shape, sides: 5, star: 0.5, radius: "0.28 + param.grow*0.02 + env.kick*0.03", width: 0.003, count: param.grow, scale: 0.88, turn: 0.0618, rotate: var.turn, spread: 0.025, pos: 0.55}
      - {type: shape, sides: 3, radius: "0.5 + param.grow*0.02", width: 0.002, count: "param.grow/2", scale: 0.9, turn: -0.0618, rotate: "0 - var.turn*1.5", spread: 0.04, pos: 0.7, opacity: 0.6}
      - {type: particles, on: track.kick, count: "param.grow*1.5", speed: 0.6, spread: 1, drag: 1.2, life: 1.6, size: 0.005, soft: 0.7, pos: 0.6, hues: 0.15}
      # Where the music lifts (each new growth), a bloom of seeds outward.
      - {type: particles, on: audio.lift, count: 140, speed: 1.1, spread: 1, drag: 0.9, life: 3, size: 0.009, soft: 0.6, pos: 0.55, hues: 0.2}
      - {type: notes, mode: stars, tracks: [singer, choir3, choir5, celesta, kalimba, harp, ondes, theremin], size: 0.007, life: 2.5, glow: 0.7, spread: 0.08, pos: 0.6, height: 1.6}
    filters:
      - {type: camera, zoom: "1 + scene.progress*0.15", rotate: "0 - scene.progress*0.01"}
      - {type: feedback, zoom: "1.01 + param.grow*0.0006", decay: 0.8}
      - {type: bloom, threshold: 0.42, amount: "0.6 + param.grow*0.02"}
      - {type: vignette, amount: 0.55}
  light:
    palette: lattice
    layers:
      - {type: gradient, radial: 1, spread: 0.15, pos: 0.02, light: 0.25}
      - {type: shape, sides: 0, radius: "0.025 + audio.level*0.02", fill: 1, width: 0, glow: 4, color: "#ffb347"}
    filters:
      - {type: bloom, threshold: 0.3, amount: 1.2, radius: 0.06}
      - {type: vignette, amount: 0.7}
scenes:
  - {at: 0, look: grow, params: {grow: 1}}
  - {at: 8bar, look: grow, params: {grow: 2}, xfade: 2s}
  - {at: 13bar, look: grow, params: {grow: 3}, xfade: 2s}
  - {at: 21bar, look: grow, params: {grow: 5}, xfade: 2s}
  - {at: 34bar, look: grow, params: {grow: 8}, xfade: 3s}
  - {at: 55bar, look: grow, params: {grow: 13}, xfade: 3s}
  - {at: 89bar, look: grow, params: {grow: 5}, xfade: 4s}
  - {at: 102bar, look: grow, params: {grow: 21}, xfade: 4s}
  - {at: 157bar, look: tunnel, xfade: 6s}
  - {at: 178bar, look: light, xfade: 8s}
# The end card: the album's name in the last light, while the picture fades out and the amber stays on.
master:
  layers:
    - {type: captions, size: 0.085, y: -0.42, color: "#ffd58a", typing: 10, fade: 2.5, glow: 0.4, lines: [[355, 16, "{album}"]]}
    - {type: captions, size: 0.045, y: -0.58, color: "#e0c890", typing: 14, fade: 2.5, lines: [[358, 13, "{artist}"]]}
