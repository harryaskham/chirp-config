# chirpers9 t1 "Nucleation": the seed. Co-built with the song (tools/songmap.py chirpers9-t1).
#
# What the song does, and so what the picture does:
#   - E1's five notes are five voices (seed-d, seed-a, seed-c, seed-g, seed-e), each on its own
#     cycle (9, 7, 8, 6 and 5 beats). In the sound they circle the listener on a ring
#     (`lane.gather_ring` its radius, `lane.gather_turn` its speed, a fifth of a lap apart):
#     here they are five lights on that ring, each flaring on its own notes, each note a ripple.
#   - The whistle states the seed plainly (hook*, tease): as it sings each note, that voice's
#     light flares, so the tune is seen crossing the ring, D A C G E.
#   - From 48bar the ring draws in, and at the crest (56bar, the gong) the five meet on one
#     downbeat: one body forms where they meet. The kick is its pulse; `cell` (the five notes in
#     order on one voice) lights its cracks.
#   - `lane.open` (the pad's filter) is the dust's light; `lane.halo` the glow round the middle;
#     the hats make the dust glitter; the low D (deep) sends one slow wide ring across the plane;
#     the breaths and hums swell the glimmer at the middle.
#   - From 80bar the voices part again and `lane.close` shuts the sound: the new body sinks
#     away, handing over to the next track.
# Shots cut on the bar lines, every eight bars: wide, low across the plane, from above (when
# the whistle sings, so the tune is seen crossing the ring), close on the middle.
# Reads tracks: seed-d seed-a seed-c seed-g seed-e hook0 hook hook-mid hook-last tease cell kick
#   deep hats breath hum hum-lock hum-out crest-gong. Lanes: gather_ring gather_turn open halo close.
scenes:
  - look:
      background: "#000000"
      env:
        deep: {on: track.deep, decay: 6}
        gong: {on: track.crest-gong, decay: 5}
        kick: {on: track.kick, decay: 0.35}
        cell: {on: track.cell, decay: 0.5}
      vars:
        # The body: nothing until the ring draws in, whole from the crest.
        body: {keys: [[48bar, 0], [55bar, 0.3], [56bar, 1]], ease: smooth}
        # The ring the five voices ride (its radius; never inside the body) and how far round
        # it has turned (laps).
        ring: {value: "max(0.3*lane.gather_ring, 0.36*var.body)"}
        turn: {integrate: "lane.gather_turn*time.bpm*0.5", wrap: 1}
        # The whistle's note now, and whether it sings.
        sing: {value: "max(max(track.hook0.gate, track.hook.gate), max(max(track.hook-mid.gate, track.hook-last.gate), track.tease.gate))"}
        tune: {value: "max(max(track.hook0.gate*track.hook0.key, track.hook.gate*track.hook.key), max(max(track.hook-mid.gate*track.hook-mid.key, track.hook-last.gate*track.hook-last.key), track.tease.gate*track.tease.key))"}
        hum: {follow: "max(max(track.hum.level, track.hum-lock.level), max(track.hum-out.level, track.breath.level))", attack: 80ms, release: 900ms}
        away: {value: "lane.close"}
        round: {integrate: "0.006 + 0.006*time.bpm", wrap: 1}
        # Where the middle is (it sinks away at the end).
        cy: {value: "0 - 0.8*var.away"}
        cz: {value: "3*var.away"}
      camera:
        # 0 wide; 1 low across the plane; 2 close on the middle; 3 from above.
        - {x: "(1.1 + 1.45*var.ring)*sin(var.round)", y: "0.5 + 0.62*var.ring", z: "0 - (1.1 + 1.45*var.ring)*cos(var.round)", look_at: [0, var.cy, var.cz]}
        - {x: "(1.0 + 1.8*var.ring)*sin(0.35 - var.round)", y: "0.2 + 0.14*var.ring", z: "0 - (1.0 + 1.8*var.ring)*cos(0.35 - var.round)", look_at: [0, "var.cy + 0.05", var.cz]}
        - {x: "0.95*sin(var.round + 0.5)", y: 0.34, z: "0 - 0.95*cos(var.round + 0.5)", look_at: [0, var.cy, var.cz]}
        - {x: "0.25*sin(var.round)", y: "1.25 + 1.5*var.ring", z: "0 - 0.25*cos(var.round)", look_at: [0, var.cy, var.cz]}
      shot: {keys: [[0bar, 0], [8bar, 1], [16bar, 3], [24bar, 0], [32bar, 1], [40bar, 3], [48bar, 0], [56bar, 2], [64bar, 1], [72bar, 3], [80bar, 0], [88bar, 2]], ease: step}
      layers:
        - {type: stars, count: 1600, speed: 0, twinkle: 0.3}
        # A faint glimmer far off: where everything is going.
        - {type: mesh, shape: sphere, detail: 12, x: 0.6, y: -1.2, z: 40, scale: "0.08 + 0.12*var.away", color: "#c8b8ff", light: 0, ambient: 0, rim: 0, emit: "1 + 2*var.away"}
        # Dust in the plane, drifting inward; the pad's opening is its light, the hats its glitter.
        - {type: motes, mode: infall, count: 3500, radius: "0.9 + 1.25*var.ring", life: 14, spin: 0.5, flat: 0.2, size: 0.006, glow: "0.25 + 0.5*clamp(lane.open, 0, 1) + 0.35*track.hats.level + 0.4*env.gong", twinkle: "0.25 + 0.6*track.hats.level", palette: ice, spread: 0.6, y: var.cy, z: var.cz, near: 0.2}
        # The low D: one slow wide ring across the plane.
        - {type: mesh, shape: torus, detail: 96, tube: 0.006, sy: 0.1, scale: "0.2 + 0.5*env.deep.age", opacity: "0.4*clamp(1 - env.deep.age/7, 0, 1)", color: "#8fb0ff", light: 0, ambient: 0, rim: 0, emit: 1.2, blend: add}
        # The five voices on their ring, a fifth of a lap apart: D A C G E.
        - {type: group, use: kit-voice, x: "var.ring*sin(var.turn)", y: var.cy, z: "var.cz + var.ring*cos(var.turn)", params: {size: "0.55 + 0.5*var.ring", hit: "track.seed-d.hit", gate: "track.seed-d.gate", touch: "var.sing*(1 - clamp(abs(var.tune - 0.452)*90, 0, 1))", warm: 0.9}}
        - {type: group, use: kit-voice, x: "var.ring*sin(var.turn + 0.2)", y: var.cy, z: "var.cz + var.ring*cos(var.turn + 0.2)", params: {size: "0.55 + 0.5*var.ring", hit: "track.seed-a.hit", gate: "track.seed-a.gate", touch: "var.sing*(1 - clamp(abs(var.tune - 0.536)*90, 0, 1))", warm: 0.3}}
        - {type: group, use: kit-voice, x: "var.ring*sin(var.turn + 0.4)", y: var.cy, z: "var.cz + var.ring*cos(var.turn + 0.4)", params: {size: "0.55 + 0.5*var.ring", hit: "track.seed-c.hit", gate: "track.seed-c.gate", touch: "var.sing*(1 - clamp(abs(var.tune - 0.571)*90, 0, 1))", warm: 0.05}}
        - {type: group, use: kit-voice, x: "var.ring*sin(var.turn + 0.6)", y: var.cy, z: "var.cz + var.ring*cos(var.turn + 0.6)", params: {size: "0.55 + 0.5*var.ring", hit: "track.seed-g.hit", gate: "track.seed-g.gate", touch: "var.sing*(1 - clamp(abs(var.tune - 0.512)*90, 0, 1))", warm: 0.5}}
        - {type: group, use: kit-voice, x: "var.ring*sin(var.turn + 0.8)", y: var.cy, z: "var.cz + var.ring*cos(var.turn + 0.8)", params: {size: "0.55 + 0.5*var.ring", hit: "track.seed-e.hit", gate: "track.seed-e.gate", touch: "var.sing*(1 - clamp(abs(var.tune - 0.476)*90, 0, 1))", warm: 0.7}}
        # The middle: a glimmer that swells with the breaths and hums, then the body.
        - {type: light, y: var.cy, z: var.cz, color: "#ffd8a0", power: "0.15 + 0.8*var.hum + 0.7*var.body + 0.7*env.kick*var.body + 0.8*env.gong", reach: 2.4}
        - {type: mesh, shape: sphere, detail: 12, y: var.cy, z: var.cz, scale: "0.012 + 0.05*var.hum + 0.12*lane.halo", opacity: "1 - var.body", color: "#ffe6c0", light: 0, ambient: 0, rim: 0, emit: "1 + 3*var.hum"}
        - {type: mesh, shape: sphere, detail: 32, y: var.cy, z: var.cz, scale: "var.body*(0.24 + 0.02*env.kick + 0.03*env.gong)", ry: "time.t*0.02", displace: "0.08*noise3(vtx.x*3, vtx.y*3, vtx.z*3)", color: "#3a2a20", light: 0.6, ambient: 0.05, rim: 0.6, rim_color: "#ffc890", shading: pixel, material: pbr, rough: 0.75, env_sky: "#1a1630", env_ground: "#05040a", paint_fine: true, paint: "(0.5 + 1.6*env.cell + 1.2*env.kick + 2*env.gong)*pow(clamp(1 - abs(noise3(vtx.x*4, vtx.y*4, vtx.z*4))*3, 0, 1), 2)", paint_color: "#ffb060"}
        # The crest: one ring thrown out from where they met.
        - {type: mesh, shape: torus, detail: 96, tube: 0.01, sy: 0.12, y: var.cy, z: var.cz, scale: "0.2 + 0.8*env.gong.age", opacity: "0.8*clamp(1 - env.gong.age/5, 0, 1)", color: "#ffe0b0", light: 0, ambient: 0, rim: 0, emit: 2, blend: add}
      filters:
        - {type: flare, x: 0, y: var.cy, z: var.cz, amount: "0.1 + 0.4*var.hum + 0.45*env.gong + 0.15*env.kick*var.body", threshold: 0.8, streak: 0.3, length: 0.4, ghosts: 4, size: 0.05, glow: 0.5}
        - {type: rays, x: 0, y: var.cy, z: var.cz, amount: "0.35*env.gong", length: 0.6, threshold: 0.6, decay: 0.96, radius: 0.8}
        - {type: bloom, threshold: 0.55, amount: "0.4 + 1.2*lane.halo"}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.5}
