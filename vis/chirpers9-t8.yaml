# chirpers9 t8 "All of It Falls": the release. Everything the album has gathered comes
# home: E1..E8 in stretto resolving into one radiant theme (the jet), then the horizon,
# a held light that redshifts away. Three acts:
#   I   (0:00) all of it falls in together: the hole's disk with all eight rings; round it
#       the album's figures (walkers, dancers, singers), birds and lanterns spiral slowly
#       inward, each on its own long spiral, and are bent round the shadow as they go;
#   II  (2:05) the radiant theme: the jet. The gas disk blazes, and a great beam of light
#       streams out along the axis both ways, brighter with the music; the camera rises
#       up the jet;
#   III (4:00) the horizon: the whole picture falls through it, squeezing into a ring of
#       light that brightens, then a single held point that reddens and fades.
scenes:
  - at: 0
    look:
      background: "#000000"
      palette: elements
      camera: {x: "2.7*sin(time.t*0.02)", y: 0.6, z: "0 - 2.7*cos(time.t*0.02)", look_at: [0, -0.1, 0]}
      layers:
        - {type: stars, count: 2000, speed: 0.003, streak: 1}
        - {type: motes, mode: orbit, tracks: auto, side: behind, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "0.55 + audio.level*0.5", twinkle: 0.3, spread: 1}
        # The disk's light on everything near it.
        - {type: light, x: 0, y: 0.1, z: 0, color: "#ffc890", power: "1.4 + 0.6*audio.level", reach: 2.2}
        # The album's people, spiralling in on long slow spirals, falling, stretched as they near.
        - {type: figure, count: 10, rig: human, motion: [float, fall], mix: "fract(time.t*0.02 + hash(inst.i + 10))", x: "(2.6 - 2.0*fract(time.t*0.02 + hash(inst.i + 10)))*cos(time.t*0.06 + inst.i*0.37 + 3*fract(time.t*0.02 + hash(inst.i + 10)))", z: "(2.6 - 2.0*fract(time.t*0.02 + hash(inst.i + 10)))*sin(time.t*0.06 + inst.i*0.37 + 3*fract(time.t*0.02 + hash(inst.i + 10)))", y: "0.2*(hash(inst.i + 40) - 0.5)", scale: "0.3*(0.35 + fract(1 - time.t*0.02 - hash(inst.i + 10)))", face: [0, 0, 0], sy: "1 + 1.6*pow(fract(time.t*0.02 + hash(inst.i + 10)), 3)", color: "#d8c8b8", light: 0.6, ambient: 0.35, rim: 0.9, rim_color: "#ffd0a0", material: pbr, rough: 0.5, env_sky: "#2a2440", env_ground: "#05040a", melt: 0.04}
        # Birds and lanterns, on spirals of their own.
        - {type: figure, count: 8, rig: bird, x: "(2.6 - 2.0*fract(time.t*0.03 + hash(inst.i + 30)))*cos(time.t*0.06 + inst.i*0.37 + 3*fract(time.t*0.03 + hash(inst.i + 30)))", z: "(2.6 - 2.0*fract(time.t*0.03 + hash(inst.i + 30)))*sin(time.t*0.06 + inst.i*0.37 + 3*fract(time.t*0.03 + hash(inst.i + 30)))", y: "0.3*(hash(inst.i + 60) - 0.5)", scale: "0.28*(0.35 + fract(1 - time.t*0.03 - hash(inst.i + 30)))", phase: "inst.i*0.4", color: "#f0ece8", light: 1, ambient: 0.4, rim: 0.6}
        - {type: motes, mode: infall, puff: true, count: 160, seed: 21, radius: 2.8, life: 40, spin: 1.2, flat: 0.8, size: 0.02, glow: 0.95, twinkle: 0, color: "#ffb050", near: 0.3}
        - {type: lens, radius: "0.62 + audio.low*0.04", hole: 0.42, redshift: 0.45, ring: 0.6}
        - {type: motes, mode: orbit, tracks: auto, side: front, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "0.55 + audio.level*0.5", twinkle: 0.3, spread: 1}
      filters:
        - {type: bloom, threshold: 0.6, amount: 0.7}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
  - at: 125
    transition: dissolve
    xfade: 4
    look:
      background: "#000000"
      palette: elements
      camera: {x: "2.6*sin(time.t*0.025)", y: "0.4 + 2.2*smooth(125, 240, time.t)", z: "0 - 2.6*cos(time.t*0.025)", look_at: [0, "1.6*smooth(125, 240, time.t)", 0]}
      layers:
        - {type: stars, count: 2000, speed: 0.003, streak: 1}
        - {type: motes, mode: orbit, tracks: auto, side: behind, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "0.55 + audio.level*0.5", twinkle: 0.3, spread: 1}
        - {type: mesh, shape: torus, detail: 128, cull: true, tube: 0.6, sy: 0.006, scale: 1.6, blend: add, opacity: 0.99, palette: ember, colour: v, pos: 0.25, spread: 1.0, light: 0, ambient: 0, rim: 0, paint: "2*0.7*(0.25 + 0.75*clamp(fbm(cos(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), sin(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), (len(vtx.x, vtx.z)/0.9)*2)*1.8 + 0.35, 0, 1))*clamp((1.38 - (len(vtx.x, vtx.z)/0.9))*1.3, 0, 1.2)*(0.5 + 0.7*audio.level)"}
        - {type: lens, radius: "0.62 + audio.low*0.04", hole: 0.42, redshift: 0.45, ring: 0.6}
        - {type: motes, mode: orbit, tracks: auto, side: front, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "0.55 + audio.level*0.5", twinkle: 0.3, spread: 1}
        # The jet: a great beam both ways along the axis, and matter streaming up it.
        - {type: beam, count: 2, from: [0, "(inst.i*2 - 1)*0.12", 0], to: [0, "(inst.i*2 - 1)*(2.5 + 3*smooth(125, 200, time.t) + audio.level)", 0], samples: 60, width: 0.015, taper: -3, glow: "0.12 + 0.25*smooth(125, 200, time.t) + 0.2*audio.level", fade: 0.6, color: "#c8dcff"}
        - {type: motes, mode: emit, count: 1500, from: [0, 0.1, 0], wind_y: "3 + 2*audio.level", wobble: 0.25, fall: 0, drag: 0.2, life: 2.5, streak: 0.08, size: 0.006, glow: "1.4*smooth(125, 170, time.t)", twinkle: 0.3, color: "#d8e8ff", near: 0.3}
        - {type: motes, mode: emit, count: 1500, seed: 11, from: [0, -0.1, 0], wind_y: "-3 - 2*audio.level", wobble: 0.25, fall: 0, drag: 0.2, life: 2.5, streak: 0.08, size: 0.006, glow: "1.4*smooth(125, 170, time.t)", twinkle: 0.3, color: "#d8e8ff", near: 0.3}
      filters:
        - {type: bloom, threshold: 0.55, amount: 0.8}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
  - at: 240
    transition: dissolve
    xfade: 3
    look:
      background: "#000000"
      palette: elements
      camera: {x: "2.2*sin(time.t*0.03)", y: 0.5, z: "0 - 2.2*cos(time.t*0.03)", look_at: [0, 0, 0]}
      layers:
        - {type: stars, count: 2000, speed: 0.01, streak: 1}
        - {type: motes, mode: orbit, tracks: auto, side: behind, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "0.55 + audio.level*0.5", twinkle: 0.3, spread: 1}
        - {type: mesh, shape: torus, detail: 128, cull: true, tube: 0.6, sy: 0.006, scale: 1.6, blend: add, opacity: 0.99, palette: ember, colour: v, pos: 0.25, spread: 1.0, light: 0, ambient: 0, rim: 0, paint: "2*0.7*(0.25 + 0.75*clamp(fbm(cos(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), sin(atan2(vtx.z, vtx.x) + time.t*0.05*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), (len(vtx.x, vtx.z)/0.9)*2)*1.8 + 0.35, 0, 1))*clamp((1.38 - (len(vtx.x, vtx.z)/0.9))*1.3, 0, 1.2)*(0.5 + 0.7*audio.level)"}
        - {type: lens, radius: "0.62 + audio.low*0.04", hole: 0.42, redshift: 0.45, ring: 0.6}
        - {type: motes, mode: orbit, tracks: auto, side: front, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "0.55 + audio.level*0.5", twinkle: 0.3, spread: 1}
      filters:
        - {type: bloom, threshold: 0.55, amount: 0.8}
        - {type: horizon, depth: "0.96*smooth(245, 290, time.t)"}
        - {type: hue, shift: "0 - 0.08*smooth(270, 299, time.t)"}
        - {type: color, exposure: "1 - 0.6*smooth(288, 299, time.t)"}
        # What is left at the end: one held point of light where the world went.
        - {type: flare, x: 0, y: 0, z: 0, amount: "2.5*smooth(284, 294, time.t)", threshold: 0, streak: 0.6, length: 0.7, ghosts: 0, size: 0.04, glow: 1.2}
        - {type: tonemap, knee: 0.75}
