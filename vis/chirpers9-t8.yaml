# chirpers9 t8 "All of It Falls": the release. Co-built with the song (tools/songmap.py
# chirpers9-t8). Four sections: the lens (0bar), the stretto (16bar), the jet (96bar), the
# horizon (140bar).
#
# What the song does, and so what the picture does:
#   - THE STRETTO. The album's elements enter one by one (E1 at 16bar, E2 at 28, E3 at 40, E5 at
#     52, E6 at 64, E7 at 80), and in the sound each one orbits the listener: its composer wrote
#     every orbit into two lanes a track, `pn` (where it is from left to right) and `fs` (how far
#     round to the far side). Here each element is a body of light in its own colour orbiting
#     the hole, placed by its own two lanes: it swings out, circles faster and faster and spirals
#     in, exactly as it sounds. It is large and bright in its spotlight (`orb`) and sinks into
#     orbit as the next one enters; it flares on its own notes and each note sends a ripple
#     through the disk. E7, the jet's own cell, fires a spark up the axis on each of its notes.
#   - STRETCHED THIN (88bar): the composer drains the low end (`lane.sp`) as the orbits close.
#     The hole's lens swells and the stars streak; at 96bar everything has fallen in.
#   - THE JET (96bar, the impact): a great beam both ways along the axis, as bright as the
#     choir and the hook sing; each crash sends a pulse up it; it dims in the breakdown
#     (`lane.br`, 120bar) and fires again on the second impact (128bar). The disk's gas blazes
#     with the four-lights chords.
#   - THE HORIZON (140bar): the whole picture squeezes through the horizon as far as the
#     composer has closed the sound (`lane.cl`). The light left in the disk goes out in the four
#     steps the song takes it down (`lane.lr`). The elements pass one last time in the reverse
#     of their arrival (E7, E6, E5, E3, E2, and last E1, the seed): each falls in from the rim
#     when its own track plays it. Her last word is frozen at the horizon (the `held` bus:
#     `lane.fo`): a streak of light across the ring that fades as her vowel does. What is
#     left is one held point of light, reddening (`lane.rd`) as the choir's hum rises
#     (`lane.hm`).
#   - Throughout: the disk's rings are the song's parts (each brightens with one of them); the
#     album's people fall in on long spirals, faster as the drums play harder.
# Shots cut on bar lines, on each element's entry.
# Reads tracks: e1 e2 e3 e5 e6 e7 lights kick snare hat crash impact jet choir hook hold solo.
#   Lanes: e1.pn e1.fs e2.pn e2.fs e2.orb e3.pn e3.fs e3.orb e5.pn e5.fs e5.orb e6.pn e6.fs e6.orb
#   e2.fw e3.fw e5.fw e6.fw e7.fw sp br cl lr fo rd hm.
scenes:
  - look:
      background: "#000000"
      palette: elements
      env:
        crash: {on: track.crash, decay: 1.2}
        impact: {on: track.impact, decay: 5}
        spark: {on: track.e7, decay: 0.35}
        chord: {when: "3*track.lights.hit", decay: 1.5}
        in7: {when: "lane.e7.fw", decay: 6}
        in1: {when: "track.e1.gate*step(0.5, lane.cl)", decay: 6}
        in2: {when: "lane.e2.fw", decay: 6}
        in3: {when: "lane.e3.fw", decay: 6}
        in5: {when: "lane.e5.fw", decay: 6}
        in6: {when: "lane.e6.fw", decay: 6}
      vars:
        drive: {follow: "max(max(track.kick.level, track.snare.level), track.hat.level)", attack: 60ms, release: 900ms}
        # The jet: on from the impact at 96bar; as bright as the choir and the hook sing; dim in
        # the breakdown; gone at the horizon.
        jet: {keys: [[96bar, 0], [96bar, 1], [140bar, 1], [144bar, 0]], ease: linear}
        song: {follow: "max(max(track.choir.level, track.hook.level), track.jet.level)", attack: 80ms, release: 1500ms}
        beam: {value: "var.jet*(0.25 + 0.75*var.song)*(1 + lane.br/12)"}
        # The horizon: on from 140bar.
        hz: {keys: [[140bar, 0], [140bar, 1]], ease: step}
        # The gas: blazing with the jet; in the horizon it is the held light, going out in the
        # song's four steps.
        blaze: {follow: "max(var.jet*(0.5 + 0.6*track.lights.level + 0.4*var.song)*(1 + lane.br/12), var.hz*(0.45 + 0.55*track.hold.level))*(0.08 + 0.92*lane.lr)", attack: 200ms, release: 2s}
        wind: {integrate: "0.03 + 0.05*var.drive"}
        # Stretched thin as the orbits close (88 to 96bar).
        thin: {value: "lane.sp/4.5"}
        # Her last word, frozen at the horizon from 145bar, fading as the composer fades it.
        held: {keys: [[145bar, 0], [145bar, 1]], ease: step}
        vowel: {value: "var.held*exp(lane.fo*0.115)"}
        # The album's people falling in: faster as the drums play harder.
        fall: {integrate: "0.008 + 0.022*var.drive"}
        swirl: {integrate: "0.03 + 0.05*var.drive"}
        round: {integrate: "0.012 + 0.012*var.drive", wrap: 1}
        up: {keys: [[96bar, 0], [140bar, 1]], ease: smooth}
        # e1: how far round to the far side it is, and how wide its orbit is now.
        f1: {value: "0 - lane.e1.fs/3"}
        r1: {follow: "var.f1", attack: 60ms, release: 6s}
        on1: {follow: "track.e1.gate", attack: 150ms, release: 3s}
        # e2: how far round to the far side it is, and how wide its orbit is now.
        f2: {value: "0 - lane.e2.fs/3"}
        r2: {follow: "var.f2", attack: 60ms, release: 6s}
        on2: {follow: "track.e2.gate", attack: 150ms, release: 3s}
        # e3: how far round to the far side it is, and how wide its orbit is now.
        f3: {value: "0 - lane.e3.fs/3"}
        r3: {follow: "var.f3", attack: 60ms, release: 6s}
        on3: {follow: "track.e3.gate", attack: 150ms, release: 3s}
        # e5: how far round to the far side it is, and how wide its orbit is now.
        f5: {value: "0 - lane.e5.fs/3"}
        r5: {follow: "var.f5", attack: 60ms, release: 6s}
        on5: {follow: "track.e5.gate", attack: 150ms, release: 3s}
        # e6: how far round to the far side it is, and how wide its orbit is now.
        f6: {value: "0 - lane.e6.fs/3"}
        r6: {follow: "var.f6", attack: 60ms, release: 6s}
        on6: {follow: "track.e6.gate", attack: 150ms, release: 3s}
      camera:
        # 0 wide, circling; 1 low, near the plane of the disk; 2 from above: the orbits as rings;
        # 3 rising up the jet.
        - {x: "2.9*sin(var.round)", y: 0.75, z: "0 - 2.9*cos(var.round)", look_at: [0, -0.05, 0]}
        - {x: "3.0*sin(var.round + 0.3)", y: 0.25, z: "0 - 3.0*cos(var.round + 0.3)", look_at: [0, 0, 0]}
        - {x: "0.9*sin(var.round)", y: 3.3, z: "0 - 0.9*cos(var.round)", look_at: [0, 0, 0]}
        - {x: "2.6*sin(var.round)", y: "0.4 + 2.2*var.up", z: "0 - 2.6*cos(var.round)", look_at: [0, "1.6*var.up", 0]}
      shot: {keys: [[0bar, 0], [8bar, 1], [16bar, 0], [24bar, 2], [28bar, 1], [36bar, 0], [40bar, 2], [48bar, 1], [52bar, 0], [60bar, 2], [64bar, 1], [72bar, 0], [80bar, 2], [88bar, 1], [96bar, 3], [104bar, 0], [112bar, 3], [120bar, 1], [128bar, 3], [136bar, 0]], ease: step}
      layers:
        - {type: stars, count: 2000, speed: "0.003 + 0.03*var.thin", streak: 1}
        - {type: motes, mode: orbit, tracks: auto, side: behind, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "(0.45 + 0.3*var.drive + 0.3*env.chord)*(0.2 + 0.8*lane.lr)", twinkle: 0.3, spread: 1}
        - {type: mesh, shape: torus, detail: 128, cull: true, tube: 0.6, sy: 0.006, scale: 1.6, blend: add, opacity: "0.99*step(0.02, var.blaze)", palette: ember, colour: v, pos: 0.25, spread: 1.0, light: 0, ambient: 0, rim: 0, paint: "1.4*var.blaze*(0.25 + 0.75*clamp(fbm(cos(atan2(vtx.z, vtx.x) + var.wind*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), sin(atan2(vtx.z, vtx.x) + var.wind*pow((len(vtx.x, vtx.z)/0.9), -1.5))*2.6*(len(vtx.x, vtx.z)/0.9), (len(vtx.x, vtx.z)/0.9)*2)*1.8 + 0.35, 0, 1))*clamp((1.38 - (len(vtx.x, vtx.z)/0.9))*1.3, 0, 1.2)"}
        # The disk's light on everything near it.
        - {type: light, x: 0, y: 0.1, z: 0, color: "#ffc890", power: "(1.0 + 0.6*var.drive + 0.8*var.blaze)*(0.2 + 0.8*lane.lr)", reach: 2.2}
        # The album's people, spiralling in on long slow spirals, falling, stretched as they near.
        - {type: figure, count: 10, rig: human, motion: [float, fall], opacity: "1 - var.hz", mix: "fract(var.fall + hash(inst.i + 10))", x: "(2.1 - 1.6*fract(var.fall + hash(inst.i + 10)))*cos(var.swirl + inst.i*0.37 + 3*fract(var.fall + hash(inst.i + 10)))", z: "(2.1 - 1.6*fract(var.fall + hash(inst.i + 10)))*sin(var.swirl + inst.i*0.37 + 3*fract(var.fall + hash(inst.i + 10)))", y: "0.2*(hash(inst.i + 40) - 0.5)", scale: "0.3*(0.35 + fract(1 - var.fall - hash(inst.i + 10)))", face: [0, 0, 0], sy: "1 + (1.6 + 2*var.thin)*pow(fract(var.fall + hash(inst.i + 10)), 3)", color: "#a89888", light: 0.45, ambient: 0.22, rim: 0.5, rim_color: "#ffd0a0", material: pbr, rough: 0.6, env_sky: "#2a2440", env_ground: "#05040a", melt: 0.04}
        # The elements, each on the orbit its own lanes give it (in the horizon: falling in from
        # the rim when its track plays it one last time).
        - {type: group, use: kit-element, opacity: "step(0.02, var.on1*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in1.age*4, 0, 1)*clamp(1.15 - env.in1.age/7, 0, 1))", x: "(1 - var.hz)*(0.6 + 1.5*var.r1)*clamp(lane.e1.pn/0.951/max(var.r1, 0.08), -1, 1) + var.hz*(0.45 + 1.9*clamp(1 - env.in1.age/7, 0, 1))*sin(0.05 + 0.09*env.in1.age)", y: 0.03, z: "0 - (1 - var.hz)*(0.6 + 1.5*var.r1)*clamp(1 - 2*var.f1/max(var.r1, 0.08), -1, 1) - var.hz*(0.45 + 1.9*clamp(1 - env.in1.age/7, 0, 1))*cos(0.05 + 0.09*env.in1.age)", scale: "clamp(var.on1*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in1.age*4, 0, 1)*clamp(1.15 - env.in1.age/7, 0, 1), 0, 1)", params: {which: 0.0, size: "(0.75 + 0.7*0.6)*(1 - var.hz) + 0.9*var.hz", hit: "track.e1.hit", gate: "track.e1.gate"}}
        - {type: group, use: kit-element, opacity: "step(0.02, var.on2*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in2.age*4, 0, 1)*clamp(1.15 - env.in2.age/7, 0, 1))", x: "(1 - var.hz)*(0.6 + 1.5*var.r2)*clamp(lane.e2.pn/0.975/max(var.r2, 0.08), -1, 1) + var.hz*(0.45 + 1.9*clamp(1 - env.in2.age/7, 0, 1))*sin(0.22 + 0.09*env.in2.age)", y: 0.03, z: "0 - (1 - var.hz)*(0.6 + 1.5*var.r2)*clamp(1 - 2*var.f2/max(var.r2, 0.08), -1, 1) - var.hz*(0.45 + 1.9*clamp(1 - env.in2.age/7, 0, 1))*cos(0.22 + 0.09*env.in2.age)", scale: "clamp(var.on2*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in2.age*4, 0, 1)*clamp(1.15 - env.in2.age/7, 0, 1), 0, 1)", params: {which: 0.14, size: "(0.75 + 0.7*clamp(1 + lane.e2.orb/5, 0, 1.8))*(1 - var.hz) + 0.9*var.hz", hit: "track.e2.hit", gate: "track.e2.gate"}}
        - {type: group, use: kit-element, opacity: "step(0.02, var.on3*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in3.age*4, 0, 1)*clamp(1.15 - env.in3.age/7, 0, 1))", x: "(1 - var.hz)*(0.6 + 1.5*var.r3)*clamp(lane.e3.pn/0.457/max(var.r3, 0.08), -1, 1) + var.hz*(0.45 + 1.9*clamp(1 - env.in3.age/7, 0, 1))*sin(0.39 + 0.09*env.in3.age)", y: 0.03, z: "0 - (1 - var.hz)*(0.6 + 1.5*var.r3)*clamp(1 - 2*var.f3/max(var.r3, 0.08), -1, 1) - var.hz*(0.45 + 1.9*clamp(1 - env.in3.age/7, 0, 1))*cos(0.39 + 0.09*env.in3.age)", scale: "clamp(var.on3*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in3.age*4, 0, 1)*clamp(1.15 - env.in3.age/7, 0, 1), 0, 1)", params: {which: 0.28, size: "(0.75 + 0.7*clamp(1 + lane.e3.orb/5, 0, 1.8))*(1 - var.hz) + 0.9*var.hz", hit: "track.e3.hit", gate: "track.e3.gate"}}
        - {type: group, use: kit-element, opacity: "step(0.02, var.on5*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in5.age*4, 0, 1)*clamp(1.15 - env.in5.age/7, 0, 1))", x: "(1 - var.hz)*(0.6 + 1.5*var.r5)*clamp(lane.e5.pn/0.454/max(var.r5, 0.08), -1, 1) + var.hz*(0.45 + 1.9*clamp(1 - env.in5.age/7, 0, 1))*sin(0.56 + 0.09*env.in5.age)", y: 0.03, z: "0 - (1 - var.hz)*(0.6 + 1.5*var.r5)*clamp(1 - 2*var.f5/max(var.r5, 0.08), -1, 1) - var.hz*(0.45 + 1.9*clamp(1 - env.in5.age/7, 0, 1))*cos(0.56 + 0.09*env.in5.age)", scale: "clamp(var.on5*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in5.age*4, 0, 1)*clamp(1.15 - env.in5.age/7, 0, 1), 0, 1)", params: {which: 0.56, size: "(0.75 + 0.7*clamp(1 + lane.e5.orb/5, 0, 1.8))*(1 - var.hz) + 0.9*var.hz", hit: "track.e5.hit", gate: "track.e5.gate"}}
        - {type: group, use: kit-element, opacity: "step(0.02, var.on6*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in6.age*4, 0, 1)*clamp(1.15 - env.in6.age/7, 0, 1))", x: "(1 - var.hz)*(0.6 + 1.5*var.r6)*clamp(lane.e6.pn/0.364/max(var.r6, 0.08), -1, 1) + var.hz*(0.45 + 1.9*clamp(1 - env.in6.age/7, 0, 1))*sin(0.73 + 0.09*env.in6.age)", y: 0.03, z: "0 - (1 - var.hz)*(0.6 + 1.5*var.r6)*clamp(1 - 2*var.f6/max(var.r6, 0.08), -1, 1) - var.hz*(0.45 + 1.9*clamp(1 - env.in6.age/7, 0, 1))*cos(0.73 + 0.09*env.in6.age)", scale: "clamp(var.on6*(1 - var.jet)*(1 - var.hz) + var.hz*clamp(env.in6.age*4, 0, 1)*clamp(1.15 - env.in6.age/7, 0, 1), 0, 1)", params: {which: 0.7, size: "(0.75 + 0.7*clamp(1 + lane.e6.orb/5, 0, 1.8))*(1 - var.hz) + 0.9*var.hz", hit: "track.e6.hit", gate: "track.e6.gate"}}
        - {type: lens, radius: "(0.62 + 0.03*var.drive)*(1 + 0.35*var.thin)", hole: 0.42, redshift: 0.45, ring: "0.6 + 0.5*env.chord"}
        - {type: motes, mode: orbit, tracks: auto, side: front, count: 9000, inner: 0.55, radius: 1.9, bands: 8, spin: "1.0 + time.bpm*0.3", life: 6, flat: 0.96, size: 0.007, glow: "(0.45 + 0.3*var.drive + 0.3*env.chord)*(0.2 + 0.8*lane.lr)", twinkle: 0.3, spread: 1}
        # E7, the jet's own cell: a spark up the axis on each of its notes (and in the horizon,
        # falling in first).
        - {type: beam, count: 2, from: [0, "(inst.i*2 - 1)*0.1", 0], to: [0, "(inst.i*2 - 1)*(0.4 + 1.6*env.spark + 1.2*clamp(1 - env.in7.age/5, 0, 1)*var.hz)", 0], samples: 30, width: 0.012, taper: -2.5, glow: "0.7*env.spark*(1 - var.jet) + 0.5*var.hz*clamp(1 - env.in7.age/5, 0, 1)", fade: 0.7, palette: elements, pos: 0.84}
        # The jet: a great beam both ways along the axis, and matter streaming up it.
        - {type: beam, count: 2, from: [0, "(inst.i*2 - 1)*0.12", 0], to: [0, "(inst.i*2 - 1)*(2.2 + 3.5*var.up + 1.5*env.crash + 2*env.impact)", 0], samples: 60, width: 0.015, taper: -3, glow: "var.beam*(0.25 + 0.35*env.crash + 0.5*env.impact)", fade: 0.6, color: "#c8dcff"}
        - {type: motes, mode: emit, count: 1500, from: [0, 0.1, 0], wind_y: "3 + 2*var.song + 2*env.crash", wobble: 0.25, fall: 0, drag: 0.2, life: 2.5, streak: 0.08, size: 0.006, glow: "1.4*var.beam", twinkle: 0.3, color: "#d8e8ff", near: 0.3}
        - {type: motes, mode: emit, count: 1500, seed: 11, from: [0, -0.1, 0], wind_y: "-3 - 2*var.song - 2*env.crash", wobble: 0.25, fall: 0, drag: 0.2, life: 2.5, streak: 0.08, size: 0.006, glow: "1.4*var.beam", twinkle: 0.3, color: "#d8e8ff", near: 0.3}
      filters:
        - {type: bloom, threshold: 0.55, amount: "0.7 + 0.3*env.impact + 0.5*lane.hm"}
        - {type: horizon, depth: "0.96*lane.cl"}
        - {type: hue, shift: "0.04*lane.rd"}
        - {type: color, exposure: "1 - 0.6*pow(0 - lane.rd/2, 3)"}
        # Her last word, frozen at the horizon: a streak of light across the ring.
        - {type: flare, x: 0, y: 0, z: 0, amount: "1.6*var.vowel", threshold: 0, streak: 1.0, length: 1.4, ghosts: 0, size: 0.02, glow: 0.3}
        # What is left at the end: one held point of light where the world went.
        - {type: flare, x: 0, y: 0, z: 0, amount: "2.5*clamp(lane.cl*2.6 - 1.6, 0, 1)*(0.5 + 0.5*track.hold.level + 0.5*lane.hm)", threshold: 0, streak: 0.6, length: 0.7, ghosts: 0, size: 0.04, glow: 1.2}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
