about: "Standby Amber, 9 Period Doubling: the logistic map the song is built on, drawn as its bifurcation diagram - each section pushes r further (2.9, 3.2, 3.5, 3.56, 3.7-3.82, the window at 3.835, the storm at 4.0) and settles back; the Henon map for the storm's own chaos."
looks:
  doubling:
    palette: ocean
    params: {r: 2.9}
    env: {lift: {on: audio.lift, attack: 30ms, decay: 1.4s}}
    layers:
      - {type: gradient, angle: 0.25, spread: 0.12, pos: 0.08, light: "0.3 + audio.low*0.2"}
      - {type: attractor, kind: logistic, lo: 2.8, hi: 4.0, upto: param.r, points: 400000, gain: "2.6 + audio.level*2", spread: 0.5, pos: "0.3 + lfo.drift*0.08", y: "lfo.drift*0.03"}
      - {type: particles, on: track.lead, count: 10, speed: 0.4, spread: 1, drag: 1.5, life: 1.0, size: 0.004, jitter: 0.8, soft: 0.7, pos: 0.6, hues: 0.2}
      - {type: notes, mode: stars, tracks: [sing, bell, ks], size: 0.008, life: 2, glow: 0.7, spread: 0.1, pos: 0.65, height: 1.5}
      - {type: scope, mode: wave, y: -0.86, size: 3.4, gain: 1.2, width: 0.003, glow: 0.5, pos: 0.7, opacity: 0.7}
    lfo: {drift: "sine period=16b"}
    filters:
      - {type: camera, zoom: "1 + scene.progress*0.18 + env.lift*0.06", x: "scene.progress*0.45", y: "scene.progress*0.05"}
      - {type: feedback, zoom: "1.002 + audio.onset*0.01", decay: 0.55}
      - {type: bloom, threshold: 0.4, amount: "0.6 + audio.level*0.4", radius: 0.025}
      - {type: vignette, amount: 0.5}
  storm:
    palette: storm
    vars: {spin: {integrate: "0.01 + audio.level*0.05"}}
    env: {snare: {on: track.snare, decay: 300ms}}
    layers:
      # The storm past the edge of order: low cloud, the Hénon map's folded arcs lit up, sparks on the snare.
      - {type: noise, res: 0.4, scale: 1.4, speed: "0.08 + audio.mid*0.3", octaves: 4, warp: 1.6, spread: 0.35, threshold: 0.45, pos: 0.15, light: "0.16 + audio.low*0.2 + env.snare*0.08"}
      - {type: attractor, kind: henon, a: "1.4 + lfo.w*0.02", points: 200000, size: 0.62, rotate: var.spin, gain: "3.2 + audio.level*2", spread: 0.7, pos: 0.5}
      - {type: particles, on: track.snare, count: 30, speed: 0.9, life: 0.9, size: 0.004, spread: 1, jitter: 0.6, pos: 0.75, shape: spark}
    lfo: {w: "noise period=4b"}
    filters:
      - {type: feedback, zoom: 1.01, decay: 0.82, rotate: 0.01}
      - {type: chroma, amount: "0.002 + audio.onset*0.006"}
      - {type: bloom, threshold: 0.45, amount: 0.7}
      - {type: vignette, amount: 0.55}
scenes:
  - {at: 0, look: doubling, params: {r: 2.95}}
  - {at: 20bar, look: doubling, params: {r: 3.2}, xfade: 3s}
  - {at: 36bar, look: doubling, params: {r: 3.5}, xfade: 3s}
  - {at: 56bar, look: doubling, params: {r: 3.56}, xfade: 3s}
  - {at: 76bar, look: doubling, params: {r: 3.82}, xfade: 4s}
  - {at: 108bar, look: doubling, params: {r: 3.835}, xfade: 3s}
  - {at: 126bar, look: storm, xfade: 2s, transition: diamond}
  - {at: 150bar, look: doubling, params: {r: 3.1}, xfade: 6s}

# The words, where they are sung (found by tools/vislyrics.py from the song's tts phrases).
master:
  layers:
    - type: captions
      shadow: 0.8
      y: 0.82
      size: 0.05
      color: "#bff6ff"
      typing: 18
      fade: 1.2
      lines:
        - [94.259b, 4.6, "every other morning i'm someone else", 3.08]  # other
        - [115.259b, 4.6, "every other morning i'm someone else", 3.08]  # other
        - [266.266b, 3.9, "eight steps and i'm standing where i stood", 2.44]  # eight
        - [286.266b, 3.9, "eight steps and i'm standing where i stood", 2.44]  # eight
        - [452.263b, 1.9, "it comes back in threes", 1.94]  # sing
        - [457.256b, 9.0, "it comes back in threes", 9.00]  # sing
        - [484.263b, 1.9, "it comes back in threes", 1.94]  # sing
        - [489.256b, 9.0, "it comes back in threes", 9.00]  # sing
        - [736.263b, 1.9, "it comes back in threes", 1.94]  # sing
        - [741.256b, 2.4, "it comes back in threes", 0.85]  # sing
