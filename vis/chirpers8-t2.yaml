about: "A Light Left On, 2 Everything Falls to One: the Collatz rule as weather. Hail falls on every clarinet note, the hailstone's height (the song's own `height`) lifts a column of light, and at the end everything falls to one point."
looks:
  hail:
    palette: cga
    params: {density: 1, fold: 0}
    vars:
      height: {follow: "song.height*3", attack: 80ms, release: 400ms}
    layers:
      - {type: gradient, angle: 0.25, spread: 0.12, pos: 0.02, light: 0.16}
      - {type: shape, sides: 4, radius: "0.08 + var.height*0.9", width: 0.004, fill: 0.05, rotate: 0.125, x: 0, y: -0.2, count: 3, scale: 0.7, spread: 0.12, pos: 0.25, opacity: 0.7}
      - {type: particles, on: track.clar, count: "26*param.density", speed: 0.1, dir: 0.75, spread: 0.05, gravity: 1.1, drag: 0.2, life: 2.4, x: 0, y: 1.1, jitter: 1.7, size: 0.012, soft: 0.4, pos: 0.25, hues: 0.5, shape: spark}
      - {type: particles, on: track.arp, count: "6*param.density", speed: 0.05, dir: 0.75, gravity: 0.6, life: 2.2, x: 0, y: 1.1, jitter: 1.7, size: 0.006, pos: 0.5, hues: 0.25}
      - {type: spectrum, mode: mirror, bands: 64, y: -0.92, size: 3.6, height: 0.12, fill: 0.5, floor: 0.25, spread: 0.6, pos: 0.25, opacity: 0.55}
      - {type: notes, mode: stars, tracks: [clar, clar2, bell, count], size: 0.008, life: 1.8, glow: 0.6, spread: 0.2, pos: 0.5, height: 1.4}
    filters:
      - {type: feedback, zoom: 0.995, dy: -0.05, decay: 0.72}
      - {type: kaleido, n: 2, zoom: 1, rotate: 0.25, x: 0, y: 0}
      - {type: bloom, threshold: 0.5, amount: 0.55}
      - {type: vignette, amount: 0.5}
  one:
    palette: lattice
    layers:
      - {type: gradient, radial: 1, spread: 0.2, pos: 0.02, light: 0.25}
      - {type: particles, on: track.clar, count: 10, speed: 0.6, dir: 0.25, spread: 1, gravity: 0, drag: 2.5, life: 1.5, size: 0.004, pos: 0.6, hues: 0.1}
      - {type: shape, sides: 0, radius: "0.02 + audio.level*0.03 + time.barphase*0.004", fill: 1, width: 0, glow: 2.5, pos: 0.62}
    filters:
      - {type: feedback, zoom: 0.97, decay: 0.85}
      - {type: bloom, threshold: 0.35, amount: 1.0}
      - {type: vignette, amount: 0.65}
scenes:
  - {at: 0, look: hail, params: {density: 0.4}}
  - {at: 16bar, look: hail, params: {density: 1}, xfade: 3s}
  - {at: 52bar, look: hail, params: {density: 1.3}, xfade: 4s}
  - {at: 76bar, look: hail, params: {density: 0.5}, xfade: 3s}
  - {at: 92bar, look: hail, params: {density: 1.6}, xfade: 3s}
  - {at: 148bar, look: one, xfade: 8s}
