about: "Prefab (3D, use in a group): a dark glossy sea that swells with the bass, at y -0.62. Params: swell, light, far (1: a flat sea out to the horizon), size (waves in world units: they keep their size and spacing whatever the sea's size; three swells crossing at angles, and the bass), pbr (1: physically based water that reflects the look's sky and its sun or moon in a glittering path; rough sets how choppy the reflection is; ripple, 0.5 to 1, breaks it into glitter)."
params: {swell: 1, light: 0.2, size: 4, far: 0, pbr: 0, rough: 0.12, ripple: 0}
layers:
  - {type: mesh, shape: plane, detail: 110, y: -0.62, scale: param.size, opacity: "1 - step(0.5, param.pbr)", palette: ocean, displace: "(1 - param.far*(1 - clamp((1 - max(abs(vtx.x), abs(vtx.z)))*3, 0, 1)))*param.swell*0.12/param.size*(0.5*sin(vtx.x*param.size*1.7 + vtx.z*param.size*0.6 - time.t*1.1) + 0.3*sin(0 - vtx.x*param.size*0.8 + vtx.z*param.size*2.3 - time.t*1.4) + 0.2*sin(vtx.x*param.size*3.1 - vtx.z*param.size*1.9 - time.t*2.0) + audio.low*0.4*sin(vtx.x*param.size*0.9 + vtx.z*param.size*1.2 - time.t*2.5))", light: param.light, ambient: 0.03, rim: 0.2, spec: 0.8, shine: 40, colour: height, spread: 0.4}
  - {type: mesh, shape: plane, detail: 110, y: -0.62, scale: param.size, opacity: "step(0.5, param.pbr)", palette: ocean, displace: "(1 - param.far*(1 - clamp((1 - max(abs(vtx.x), abs(vtx.z)))*3, 0, 1)))*param.swell*0.12/param.size*(0.5*sin(vtx.x*param.size*1.7 + vtx.z*param.size*0.6 - time.t*1.1) + 0.3*sin(0 - vtx.x*param.size*0.8 + vtx.z*param.size*2.3 - time.t*1.4) + 0.2*sin(vtx.x*param.size*3.1 - vtx.z*param.size*1.9 - time.t*2.0) + audio.low*0.4*sin(vtx.x*param.size*0.9 + vtx.z*param.size*1.2 - time.t*2.5))", light: "0.6 + param.light", ambient: 0.25, rim: 0, material: pbr, rough: param.rough, shading: pixel, ripple: param.ripple, ripple_scale: 5, colour: height, spread: 0.4}
  # With far: 1, a flat sea beyond the swells reaches the horizon (no gap of sky below it): a
  # frame of four sheets round the swells (two beyond and before them, two beside), tucked
  # just under their flattened rim. Nothing of it lies under the swells themselves, so it
  # never fills their troughs and costs nothing where they are.
  # The flat sea, classic.
  - {type: mesh, shape: plane, detail: 24, count: 2, y: -0.625, z: "param.size*6.485*(1 - 2*inst.i)", scale: param.size, sx: 12, sz: 5.515, opacity: "step(0.5, param.far)*(1 - step(0.5, param.pbr))", palette: ocean, pos: 0.15, light: param.light, ambient: 0.03, rim: 0.2, spec: 0.8, shine: 40, colour: height, spread: 0, cull: true}
  - {type: mesh, shape: plane, detail: 12, count: 2, y: -0.625, x: "param.size*6.485*(1 - 2*inst.i)", scale: param.size, sx: 5.515, sz: 1, opacity: "step(0.5, param.far)*(1 - step(0.5, param.pbr))", palette: ocean, pos: 0.15, light: param.light, ambient: 0.03, rim: 0.2, spec: 0.8, shine: 40, colour: height, spread: 0, cull: true}
  # The flat sea, physically based (pbr: 1): the sky and its sun or moon reflected.
  - {type: mesh, shape: plane, detail: 24, count: 2, y: -0.625, z: "param.size*6.485*(1 - 2*inst.i)", scale: param.size, sx: 12, sz: 5.515, opacity: "step(0.5, param.far)*step(0.5, param.pbr)", palette: ocean, pos: 0.15, light: "0.6 + param.light", ambient: 0.25, rim: 0, material: pbr, rough: param.rough, shading: pixel, ripple: param.ripple, ripple_scale: 5, colour: height, spread: 0, cull: true}
  - {type: mesh, shape: plane, detail: 12, count: 2, y: -0.625, x: "param.size*6.485*(1 - 2*inst.i)", scale: param.size, sx: 5.515, sz: 1, opacity: "step(0.5, param.far)*step(0.5, param.pbr)", palette: ocean, pos: 0.15, light: "0.6 + param.light", ambient: 0.25, rim: 0, material: pbr, rough: param.rough, shading: pixel, ripple: param.ripple, ripple_scale: 5, colour: height, spread: 0, cull: true}
