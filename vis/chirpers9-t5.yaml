# chirpers9 t5 "Periapsis": the inner disk; one pass round the star. Co-built with the song
# (tools/songmap.py chirpers9-t5).
#
# What the song does, and so what the picture does:
#   - The song's `orbit` voice circles the listener on an orbit its composer automates:
#     `lane.peri_near` is how far away it passes (6 far out, 0.8 at the closest pass, bar 76,
#     then out again) and `lane.peri_spin` how fast it goes round (four times faster at the
#     closest pass). The picture is that orbit: worlds round a hot star, drawing in and
#     speeding up exactly as the sound does, then swinging out and slowing.
#   - `lane.heat` is the star: how bright it burns and how fast its surface boils. Each of the
#     four-lights chords (the `lights` track) swells it.
#   - The three worlds are three voices: the inner one the orbit ostinato (E5), the middle one
#     the seed's high layer, the outer one its low layer. Each swells on its own notes.
#   - I (0bar) the star and its worlds, from outside.
#   - II (56bar, where the 808 comes in and the orbit starts to close) riding one world: the
#     star grows over its limb as far as the orbit has closed, and fills the sky at the closest
#     pass (76bar: the crest; a flare washes over everything). The clouds race as fast as the
#     orbit turns.
#   - III (100bar, the hats leaning to the middle) from outside again, swinging out and slowing.
# Shots cut on bar lines.
# Reads tracks: lights orbit seed-hi seed-lo drums crest hats-l hats-r. Lanes: peri_near
#   peri_spin heat.
scenes:
  - at: 0
    look:
      background: "#000000"
      env:
        # A flare of matter: at the closest pass.
        flare: {on: track.crest, decay: 2.5}
        chord: {on: track.lights, decay: 1.6}
      vars:
        # How far the orbit has closed (0 far out, 1 at the closest pass) and how far round
        # it has gone (laps).
        tight: {value: "clamp((6 - lane.peri_near)/5.2, 0, 1)"}
        lap: {integrate: "0.05*lane.peri_spin"}
        heat: {value: "clamp((lane.heat + 0.8)/2.1, 0, 1)"}
        boil: {integrate: "0.01 + 0.06*var.heat"}
        round: {integrate: "0.004 + 0.01*lane.peri_spin", wrap: 1}
      camera:
        # 0 wide, circling; 1 low in the plane of the orbits; 2 from above: the orbits as rings.
        - {x: "3.9*sin(var.round)", y: "1.3 - 0.5*var.tight", z: "0 - 3.9*cos(var.round)", look_at: [0, 0, 0]}
        - {x: "4.0*sin(var.round + 0.3)", y: 0.3, z: "0 - 4.0*cos(var.round + 0.3)", look_at: [0, 0, 0]}
        - {x: "1.2*sin(var.round + 0.6)", y: 2.3, z: "0 - 1.2*cos(var.round + 0.6)", look_at: [0, 0, 0]}
      shot: {keys: [[0bar, 0], [8bar, 2], [16bar, 0], [24bar, 1], [32bar, 0], [40bar, 2], [44bar, 1], [48bar, 0], [100bar, 1], [108bar, 0], [116bar, 1]], ease: step}
      layers:
        - {type: stars, count: 2000, speed: 0, twinkle: 0.3}
        - {type: light, color: "#fff4e0", power: "1.0 + 0.9*var.heat + 0.6*env.flare + 0.5*env.chord", reach: 30}
        # The star: its surface boiling.
        - {type: mesh, shape: sphere, detail: 64, scale: "0.66 + 0.06*var.heat + 0.03*env.chord", color: "#ff7020", light: 0, ambient: 0, rim: "1.0 + 1.0*var.heat + 0.8*env.flare + 0.5*env.chord", rim_power: 3, emit: "0.7 + 0.3*var.heat", paint: "(0.5 + 0.7*var.heat + 0.4*env.chord)*pow(clamp(fbm(vtx.x*5 + var.boil, vtx.y*5, vtx.z*5 - var.boil*0.7)*1.5 + 0.6, 0, 1), 2)", paint_color: "#fff0c0", paint_fine: true, rim_color: "#ffe0a0"}
        # A flare of matter thrown off at each lift.
        - {type: motes, mode: emit, spawn: env.flare, count: 700, from: [0.5, 0.45, -0.2], wobble: 0.9, wind_x: 0.4, wind_y: 0.5, fall: 0.3, drag: 0.4, life: 4, streak: 0.06, size: 0.008, glow: 1.4, twinkle: 0.3, palette: ember, spread: 0.6, near: 0.3}
        # Three worlds whipping round on tightening orbits, each turning.
        - {type: group, use: kit-world, x: "(1.7 - 0.55*var.tight)*cos(var.lap*1.9)", z: "(1.7 - 0.55*var.tight)*sin(var.lap*1.9)", scale: "0.22*(1 + 0.25*track.orbit.hit)", params: {sea: 0.2, seed: 4, spin: 0.03, clouds: 0.8}}
        - {type: group, use: kit-world, x: "(2.5 - 0.9*var.tight)*cos(var.lap*1.2 + 0.35)", z: "(2.5 - 0.9*var.tight)*sin(var.lap*1.2 + 0.35)", y: 0.1, scale: "0.3*(1 + 0.2*track.seed-hi.hit)", params: {sea: 0.5, seed: 7, spin: 0.02, cities: 1.5}}
        - {type: group, use: kit-world, x: "(3.3 - 1.3*var.tight)*cos(var.lap*0.8 + 0.7)", z: "(3.3 - 1.3*var.tight)*sin(var.lap*0.8 + 0.7)", y: -0.1, scale: "0.26*(1 + 0.2*track.seed-lo.hit)", params: {sea: -0.1, seed: 9, spin: 0.025}}
      filters:
        - {type: flare, x: 0, y: 0, z: 0, amount: "0.15 + 0.3*var.heat + 0.8*env.flare + 0.25*env.chord", threshold: 0.95, streak: 0.35, length: 0.5, ghosts: 4, size: 0.05, glow: 0.5}
        - {type: bloom, threshold: 0.7, amount: 0.6}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
  - at: 56bar
    transition: dissolve
    xfade: 3
    look:
      background: "#000000"
      env:
        flare: {on: track.crest, decay: 3}
        chord: {on: track.lights, decay: 1.6}
      vars:
        tight: {value: "clamp((6 - lane.peri_near)/5.2, 0, 1)"}
        heat: {value: "clamp((lane.heat + 0.8)/2.1, 0, 1)"}
        boil: {integrate: "0.01 + 0.06*var.heat"}
        # The world turns under us as fast as the orbit goes round.
        turn: {integrate: "0.012*lane.peri_spin"}
        hats: {follow: "max(track.hats-l.hit, track.hats-r.hit)", attack: 10ms, release: 200ms}
      camera:
        # 0 over the limb; 1 lower and to one side; 2 looking up at the star.
        - {x: 0, y: 0.05, z: -1.6, look_at: [0, "0.45 + 0.4*var.tight", 4], roll: "0.02*sin(var.turn*3)"}
        - {x: -0.9, y: 0.0, z: -1.3, look_at: [0.3, "0.5 + 0.4*var.tight", 5], roll: -0.04}
        - {x: 0.5, y: 0.1, z: -0.6, look_at: [0, "0.8 + 0.5*var.tight", 9]}
      shot: {keys: [[56bar, 0], [64bar, 1], [72bar, 0], [76bar, 2], [80bar, 0], [88bar, 1], [96bar, 0]], ease: step}
      layers:
        - {type: stars, count: 1800, speed: 0, twinkle: 0.3}
        # The star rising huge over the world's limb.
        - {type: light, x: 0, y: "0.5 + 0.7*var.tight", z: 9, color: "#fff0d8", power: "1.0 + 0.9*var.heat + 1.2*env.flare + 0.5*env.chord", reach: 30}
        - {type: mesh, shape: sphere, detail: 48, x: 0, y: "0.5 + 0.7*var.tight", z: 9, scale: "0.8 + 1.4*var.tight + 2.6*var.tight*var.tight*var.tight + 0.08*env.chord", color: "#ff7020", light: 0, ambient: 0, rim: "1.0 + 1.0*var.heat + 0.8*env.flare + 0.5*env.chord", rim_power: 3, rim_color: "#ffe0a0", emit: "0.7 + 0.3*var.heat", paint: "(0.5 + 0.7*var.heat + 0.4*env.chord)*pow(clamp(fbm(vtx.x*5 + var.boil, vtx.y*5, vtx.z*5 - var.boil*0.7)*1.5 + 0.6, 0, 1), 2)", paint_color: "#fff0c0", paint_fine: true}
        # The world beneath, its curve filling the bottom of the frame, turning fast.
        - {type: group, use: kit-world, y: -3.25, z: 1, scale: 3, ry: var.turn, params: {sea: 0.25, seed: 7, spin: 0, cities: "0.9 + 0.7*var.hats", clouds: 1.2}}
        # The flare's wave of matter washing over.
        - {type: motes, mode: emit, spawn: env.flare, count: 900, from: [0, 0.6, 8], wide: 3, wobble: 0.6, wind_z: -3, wind_y: -0.2, fall: 0, life: 3.5, streak: 0.1, size: 0.008, glow: 1.2, twinkle: 0.3, palette: ember, spread: 0.6, near: 0.4}
      filters:
        - {type: flare, x: 0, y: "0.5 + 0.7*var.tight", z: 9, amount: "0.3 + 0.5*var.tight + 1.2*env.flare + 0.3*env.chord", threshold: 0.9, streak: 0.5, length: 0.6, ghosts: 5, size: 0.06, glow: 0.7}
        - {type: warp, amount: 0.003}
        - {type: bloom, threshold: 0.7, amount: 0.6}
        - {type: tonemap, knee: 0.75}
        - {type: vignette, amount: 0.45}
  - at: 100bar
    transition: dissolve
    xfade: 3
    look:
      background: "#000000"
      env:
        # A flare of matter: at the closest pass.
        flare: {on: track.crest, decay: 2.5}
        chord: {on: track.lights, decay: 1.6}
      vars:
        # How far the orbit has closed (0 far out, 1 at the closest pass) and how far round
        # it has gone (laps).
        tight: {value: "clamp((6 - lane.peri_near)/5.2, 0, 1)"}
        lap: {integrate: "0.05*lane.peri_spin"}
        heat: {value: "clamp((lane.heat + 0.8)/2.1, 0, 1)"}
        boil: {integrate: "0.01 + 0.06*var.heat"}
        round: {integrate: "0.004 + 0.01*lane.peri_spin", wrap: 1}
      camera:
        # 0 wide, circling; 1 low in the plane of the orbits; 2 from above: the orbits as rings.
        - {x: "3.9*sin(var.round)", y: "1.3 - 0.5*var.tight", z: "0 - 3.9*cos(var.round)", look_at: [0, 0, 0]}
        - {x: "4.0*sin(var.round + 0.3)", y: 0.3, z: "0 - 4.0*cos(var.round + 0.3)", look_at: [0, 0, 0]}
        - {x: "1.2*sin(var.round + 0.6)", y: 2.3, z: "0 - 1.2*cos(var.round + 0.6)", look_at: [0, 0, 0]}
      shot: {keys: [[0bar, 0], [8bar, 2], [16bar, 0], [24bar, 1], [32bar, 0], [40bar, 2], [44bar, 1], [48bar, 0], [100bar, 1], [108bar, 0], [116bar, 1]], ease: step}
      layers:
        - {type: stars, count: 2000, speed: 0, twinkle: 0.3}
        - {type: light, color: "#fff4e0", power: "1.0 + 0.9*var.heat + 0.6*env.flare + 0.5*env.chord", reach: 30}
        # The star: its surface boiling.
        - {type: mesh, shape: sphere, detail: 64, scale: "0.66 + 0.06*var.heat + 0.03*env.chord", color: "#ff7020", light: 0, ambient: 0, rim: "1.0 + 1.0*var.heat + 0.8*env.flare + 0.5*env.chord", rim_power: 3, emit: "0.7 + 0.3*var.heat", paint: "(0.5 + 0.7*var.heat + 0.4*env.chord)*pow(clamp(fbm(vtx.x*5 + var.boil, vtx.y*5, vtx.z*5 - var.boil*0.7)*1.5 + 0.6, 0, 1), 2)", paint_color: "#fff0c0", paint_fine: true, rim_color: "#ffe0a0"}
