about: "Hill-climb reproduction of Meshuggah — I Am That Thirst (Immutable, 2022), from Songsterr tab 506004 (Mårten 1/2, leads, bass, drums), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/i-am-that-thirst.json. v4: faint independent L/R copies of the bass (bassL/bassR: pan -1/+1, +7/+19 ms, bass gain -32 dB) for the record's wider 20-60 Hz. v6: the rhythm guitars' Bb1,F2 dyads voiced root+octave (Bb1,Bb2) as the record plays them (chirper-zero's Light the Shortening Fuse finding). Master hall reverb (4 s) whose mix lane opens to 0.06 at the band stop (274.15 s), for the record ring-out."
