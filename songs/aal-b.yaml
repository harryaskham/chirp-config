about: AAL-style B — distorted F# chugs on the Nolly rig with double kicks and china/ride, a monstrous generative lead, distorted bass locked to the riff.
tempo: 132
length: 16b
vars: {dark: 0, wet: 0.35}
buses:
  room: {fx: ["reverb mix=1 size=0.6 damp=0.5"], gain: {value: -18dB, mod: [{src: var.wet, amount: 18}]}}
  gtr: {fx: [{type: filter, kind: lp, cutoff: {value: 16k, mod: [{src: var.dark, amount: -4.5}]}, q: 0.8}]}
tracks:
  - name: kick-snare
    patch: prog-kit
    sends: {room: -14dB}
    score: "[ k/16@118 k@90 . k@100 s@120 . k@96 k@88 . k@104 k@92 . s@122 . (k@96|t1@100) (k@90|.) ]x4"
  - name: cymbals
    patch: prog-kit
    score: "[ x/4@108 rd@76 x@106 rb@96 ]x4"
  - name: gtr-l
    patch: m8-nolly
    pan: L90
    out: gtr
    seed: 11
    sends: {room: -16dB}
    score: &riff >
      [ expr.pm=1 F#1/16@118 F#1@70 (F#1@96|.) expr.pm=0 (F#1,C#2,F#2|A1,E2|G1,D2)/8@122^gate=0.95
        expr.pm=1 F#1/16@106 (F#1@74|G1@100) . (F#1@112|F#2@118^ph^gate=1.6) F#1@96
        expr.pm=0 (B1,F#2|C#2,G#2)/8@120 expr.pm=1 F#1/16@104 F#1@72 . F#1@100 ]x4
  - name: gtr-r
    patch: "m8-nolly layers.0.pick=0.14 humanize.time=5ms"
    pan: R90
    out: gtr
    seed: 11
    sends: {room: -16dB}
    score: *riff
  - name: bass
    patch: m8-bass-dist
    seed: 11
    score: "[ F#1/16@118 F#1@70 (F#1@96|.) (F#1|A1|G1)/8@122 F#1/16@106 (F#1@74|G1@100) . (F#1@112|F#2@118) F#1@96 (B1|C#2)/8@120 F#1/16@104 F#1@72 . F#1@100 ]x4"
  - name: lead
    patch: lead-monster
    pan: 0.1
    sends: {room: -8dB}
    score: >
      [ R/4 (F#4|A4|B4)/8@100 (C#5|D5)@104 (E5|C#5)/4@110^gate=1.1 (D5|B4)/8@100 (A4|.)/8 ]x3
      R/4 (E5|F#5)/8@106 (G5|A5)/8@110 (F#5|B5)/2@116^gate=1.3
  - name: fx
    sends: {room: -10dB}
    score: "patch=fx-impact F1/4@112 R/4 R/2 R/1 R/1 patch=fx-riser C4/1@96"
  - name: fx-rev
    patch: fx-revcym
    score: "R/1 R/1 R/1 R/2 C5/2@96"
