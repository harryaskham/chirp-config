about: Polymetric live groove — a 7-sixteenth riff cycling against 4/4 (9× per 4 bars), random stabs and pinch squeals; vars dark, wet.
tempo: 128
length: 16b
vars:
  dark: {value: 0.1, smooth: 300ms, min: 0, max: 1}
  wet: {value: 0.3, smooth: 300ms, min: 0, max: 1}
buses:
  room: {fx: ["reverb mix=1 size=0.55 damp=0.5"], gain: {value: -18dB, mod: [{src: var.wet, amount: 18}]}}
  gtr:
    fx:
      - {type: filter, kind: lp, cutoff: {value: 16k, mod: [{src: var.dark, amount: -4.5}]}, q: 0.8}
tracks:
  - name: drums
    patch: haake
    sends: {room: -10dB}
    score: >
      [ k,c/16@124 . k@90?0.7 . s,c@120 . k@100 (k@80|.) k,c@118 . (k@84|.) k@96 s,c@122 . (t1@96|k@90) (s@40|.) ]x3
      k,c/16@124 . k@96 k@80 s,c@120 . k@104 k@84 (t1@110|s@100) t1@96 (t2@108|s@90) t2@92 ft@114 ft@100 ft,k@118 s@124
  - name: gtr-l
    patch: m8-gojira
    pan: L90
    out: gtr
    seed: 1
    sends: {room: -14dB}
    score: &riff >
      [ expr.pm=1 F1/16@118 F1@70 (F1@96|.) expr.pm=0 (F1,C2|Gb1,Db2|E1,B1)@120^gate=0.9
        expr.pm=1 F1@104 (F1@72|Gb1@100) (F1@110|F2@116^ph^gate=1.6) ]x9 .
  - name: gtr-r
    patch: "m8-gojira layers.0.pick=0.14 humanize.time=5ms"
    pan: R90
    out: gtr
    seed: 1
    sends: {room: -14dB}
    score: *riff
  - name: bass
    patch: m8-bass
    seed: 1
    score: *riff
