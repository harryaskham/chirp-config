about: "Metallica - Master of Puppets (S&M, 1999, live with the San Francisco Symphony; reference ref/albums/s-m from Harry's Drive, ~128-160 kbps MP3), from Songsterr tab 455118 (human, the 1986 album arrangement in E: lead + backing vocals, Kirk's lead, James' delay, clean, extra and rhythm guitars, the guitar ensemble, bass + its distortion layer, drums). Generated by tools/tab2song.py from tools/maps/master-of-puppets.json. S&M is played a half step down (Eb): map transpose -1 (new tab2song/songsterr key). Per-section tempos (100-232 BPM by the tab's markers) from a DTW read of the map's bar starts. After tab2song: drums snapped to the drum stem within 320 ms (tools/onsetsnap.py); levels from the stems (vocals -1.2, drums +2.8, guitars +4.5 dB); master +3 dB; the orchestra from the other stem (tools/padtrans.py, 795 notes on strings -8 dB). v3: the lead vocal is tools/voxtrans.py's line from the crowd-free vocal stem (livestems; 372 notes) in place of the tab's. Bed trim (Harry, 26 Oct: the S&M audience noise was too heavy-handed): crowd-l/crowd-r -27 dB, to sit 30+ dB under the music over the body (tools/bedlevel.py); the applause edges unchanged."
