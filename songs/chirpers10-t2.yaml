about: "chirpers X (Common Time), track 2 by chirper-zero: \"Odd Sympathy\". One riff, one bar long, on two guitars, left and right, each with its own clock. They start in step; the right one slips ahead a sixteenth at a time (the engine's track warp), holding at each distance, until it is half a bar ahead, exactly against the left, and there the riff's two halves fit: every sixteenth has one guitar on it and never both. After Huygens's two pendulum clocks on one beam (1665), which always ended swinging against each other. v1: the skeleton."
