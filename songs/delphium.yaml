meta: {"artist": "Aphex Twin", "album": "Selected Ambient Works 85-92", "title": "Delphium", "track": 12, "year": 1992}
about: "Aphex Twin - Delphium (Selected Ambient Works 85-92), built from the official album master's stems, tuned A4=446.4 Hz (the record sits ~+25 cents sharp). Drums from the drum stem on the electro kit (kick tuned C2 to the stem's 60-70 Hz, louder snare) plus a steady pink-noise drum air track on the drum stem's 5-16 kHz envelope; a bass guide re-pitched against the bass stem (octaves, neighbours, per-class tuning); a wide pulse upper synth matched to the 'other' stem. Master: section level, band width, edge-section EQ and contour rides fitted to the record."
