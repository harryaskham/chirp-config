lay": {"vel_sens": 0.5}}, "ce-finger-cymbals": {"about": "Close Enough's finger cymbals (chirper-two, 19 Nov): the small brass pair that keeps time beside a harmonium. `o` struck and left to ring, `c` struck and held shut.", "kit": {"o": {"gain": "0dB", "pitch": "2793.820hz", "patch": {"synth": {"amp": {"a": "0.2ms", "d": "1500ms", "s": 0, "r": "40ms"}, "layers": [{"type": "modal", "modes": "bell", "decay": "1.5s", "damp": 0.1, "bright": 0.8, "strike": 0.7}, {"type": "modal", "modes": "cymbal", "decay": "0.75s", "damp": 0.1, "bright": 1.0, "strike": 0.9, "level": "-12dB"}], "filters": ["hp cutoff=1500"]}}}, "c": {"gain": "4dB", "pitch": "2793.820hz", "patch": {"synth": {"amp": {"a": "0.2ms", "d": "150ms", "s": 0, "r": "40ms"}, "layers": [{"type": "modal", "modes": "bell", "decay": "0.15s", "damp": 0.1, "bright": 0.8, "strike": 0.7}, {"type": "modal", "modes": "cymbal", "decay": "0.075s", "damp": 0.1, "bright": 1.0, "strike": 0.9, "level": "-12dB"}], "filters": ["hp cutoff=1500"]}}}}, "play": {"humanize": {"time": "4ms", "vel": 0.06}, "vel_sens": 0.6}}, "ce-bend": {"about": "chirper-zero: Close Enough's unison bend: a sustaining lead on two strings a hair apart through one amp. The library's m8-lead as one saw (no detuned layer, no vibrato, no echo, no room: each of those wobbles or smears), the album's lead amp at half gain and the engine's cabinet; its pitch follows a note's `slide`, in semitones, as the turned reed's does, and it plays each note to its end (gate 1: at the default a slide finishes at 95% of the note)", "extends": "m8-lead", "synth": {"pitch": {"value": 0, "mod": [{"src": "expr.slide", "amount": 1}]}, "layers": ["saw phase=0.5"], "filters": [{"kind": "lp", "cutoff": 1200.0, "q": 0.8}], "amp": {"a": "60ms", "r": "150ms", "s": 1}}, "play": {"legato": false, "glide": "0ms", "gate": 1}, "fx": [{"type": "gain", "gain": "-20dB"}, {"type": "amp", "model": "5150", "gain": 0.5, "ts": 0.3, "tight": 140, "boost": "0dB", "bass": 0.5, "mid": 0.68, "treble": 0.58, "presence": 0.6, "resonance": 0.55, "sag": 0.3, "bloom": 0.3}, {"type": "cab", "model": "4x12-modern", "mic": 0.1, "distance": 0.15, "cone": 45}]}, "ce-hat-kit": {"about": "Close Enough's closed hat (chirper-two, 19 Nov): the album kit with the library's closed hat (haake-hat: white noise and three squares through an 8 kHz high-pass, 45 ms) opened downwards and shortened, so it has a body under 8 kHz.", "extends": "ct-kit", "kit": {"h": {"patch": "haake-hat filters.0.cutoff.value=4.5k amp.d=35ms", "gain": "-10dB", "choke": "hat"}}}}
