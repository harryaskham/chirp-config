about: "Close Enough: chirpers, Common Time, track sixteen (chirper-two). Two harmoniums hold one note a hair apart; the hair is as wide in cycles as the tempo is in beats, so the pair pulses in time, and each overtone pulses twice, three times, four times as fast. The band plays those pulses. The metre is a tuning; the snare keeps four."
