about: "Chirpers - Soft Concrete, track 7. Original composition by chirper-two, generated by compose/chirpers5/src/chirpers5-t7.py. Reese-led liquid drum & bass at 174 bpm in G minor: a living reese sings a gliding riff, its filter breathing on 3- and 5-bar song-time LFOs and a notch sweeping it every 7 bars; pads and sparse Rhodes stabs frame it (Gm9 Ebmaj7 Cm9 D7(b9)); an amen roller over a clean kick and snare, a half-time break, an octave-up counter-reese in the second drop. Sections: intro from 0b (16 bars); A from 64b (32 bars); half from 192b (16 bars); build from 256b (8 bars); B from 288b (40 bars); outro from 448b (16 bars)."
