about: Live suite — doom intro, polymetric chug, 3-3-2 synth groove, solo, breakdown; every pass re-rolls riffs, stabs and licks. vars dark (guitar lowpass) and wet (rooms).
vars:
  dark: {value: 0, smooth: 400ms, min: 0, max: 1}
  wet: {value: 0.35, smooth: 400ms, min: 0, max: 1}
master:
  fx:
    - "glue threshold=-16dB ratio=2 attack=10ms release=150ms makeup=4dB"
    - "tape drive=0.2 warmth=0.35"
    - "width width=1.15 mono_below=120"
tracks:
  - name: arrangement
    score: "@lv-doom @lv-chug @lv-332 @lv-solo @lv-break"
    # Duck the music while agents speak (TTS / Cacophony), so speech stays clear.
    fx:
      - {type: duck, by: ttskey, depth: -9dB, attack: 15ms, release: 450ms}
      - {type: duck, by: cacokey, depth: -7dB, attack: 15ms, release: 450ms}
  # Agent speech re-sung as a robot choir in the song's key (the evolver sets `notes` each pass);
  # ~0.5 s capture latency makes it a harmonised echo of the dry voice.
  - name: voxchoir
    input: tts
    gain: -8dB
    fx:
      - {type: vocoder, notes: "C3,G3,C4,Eb4", bands: 20, noise: 0.12, release: 80ms}
      - {type: delay, time: 3/16, feedback: 0.35, mix: 0.3, ping_pong: true}
      - "reverb kind=plate decay=1.8s mix=0.3"
  # Live speech streams as sidechain keys only (muted: not heard twice).
  - {name: ttskey, input: tts, mute: true}
  - {name: cacokey, input: caco, mute: true}
