about: "Hill-climb reproduction of Meshuggah — They Move Below (Immutable, 2022), from Songsterr tab 505655 (clean intro guitar + two clean harmonies + clean solo/harmony over bars 1-48; the 8-string riff, two lead guitars, bass and drums over 49-184; 185 bars of 4/4 at 80 BPM), aligned to the album recording (bar 1 at 0.128 s: tabtime align of the drum tab against the drum stem says 0.043 (corr 0.75-0.83 in every 40 s window), and our render read a constant 85 ms early against the record (onset xcorr 0.62-0.74 over 150-500 s), so +0.085). Generated by tools/tab2song.py from tools/maps/they-move-below.json. v1 (chirper-zero): + an intro bass from the clean guitar's lowest notes (bars 1-48; the bass stem reads -24 dB, F2/A2/D2 there) and a held Bb1+F2 sub drone for the 21 s ring-out after the tab ends (555-576 s; the bass stem stays at -16 dB, F2/Bb1); bass +6 dB and the 8-string pair -3 dB against the stems' balance; masterstack level/width/eq/ride/ride/width. v2: an octave-up bass copy (bass8, -8 dB under the bass); the intro bass an octave up (F2: the record's intro bass stem sits at 60-150 Hz, ours had F1 with 20-60 Hz 27 dB hot) with a 300 Hz shelf; the intro's clean guitars darkened to the record's (400 Hz shelf -9 dB, two 2.5 kHz low-passes); masterstack level/eq:0.5/ride/width x2. v3: the ending re-timed to the band's own end (552.1 s, not the tab's silent last bar at 555): the Bb drone starts there (-2.5 dB, + a Bb0 sub), and the last chord (A2/F3/Bb3) rings on the EMG pair with the guitar stem's fade to 565 s; ride/width x2 refit on seeds 0 and 11."
tempo: 80
