about: "Hill-climb reproduction of Meshuggah — Broken Cog (Immutable, 2022), from Songsterr tab 506000 (rhythm, leads, lead harmony, bass, drums), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/broken-cog.json. v3: an octave-up copy of the bass part (bass8: the tab part transposed +12, bass-fat, -8 dB) - the 5-string bass on F0/Bb0 reads its 3rd harmonic in chroma (The Faultless v6 +2.3). v5: faint independent L/R copies of the bass (bassL/bassR: pan -1/+1, +7/+19 ms, bass gain -18 dB): the record's 20-60 Hz side sits at -10 dB re mid where ours read -23.8 (stereoscan, a 13.7 dB deficit). v7 (chirper-zero): the riff toms retuned to the record's drum stem (song-local bc-kit: t2 G#2 -4 dB, was D3; t3 B2 -6 dB, was A2), then eq:0.5 + ride/width x2 refit on seeds 0 and 11. v8: the master's band-width lanes refitted from neutral with widthfit --joint (the per-band fits had run away: wb5 0.01 beside wb6 6.0, side 8-13 dB over mid above 1.2 kHz in the intro), and the kit's cymbals/hats/toms panned (room-kit's pans, audience side) with one more joint pass."
