about: "Hill-climb reproduction of Meshuggah — Broken Cog (Immutable, 2022), from Songsterr tab 506000 (rhythm, leads, lead harmony, bass, drums), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/broken-cog.json. v3: an octave-up copy of the bass part (bass8: the tab part transposed +12, bass-fat, -8 dB) - the 5-string bass on F0/Bb0 reads its 3rd harmonic in chroma (The Faultless v6 +2.3). v5: faint independent L/R copies of the bass (bassL/bassR: pan -1/+1, +7/+19 ms, bass gain -18 dB): the record's 20-60 Hz side sits at -10 dB re mid where ours read -23.8 (stereoscan, a 13.7 dB deficit)."
tempo: 174
