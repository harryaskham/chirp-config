about: "Donna Summer - I Feel Love (album version, I Remember Yesterday, 1977), from the official master (bHfrdQ8h2Pw) and its htdemucs_6s stems. 126.667 BPM; the Moog sequence C-C-G-Bb (two Cs, a G and a Bb) transposed per half-bar to the roots the stems carry (C / Eb / F / G), its 16th echo on the right; four-on-the-floor kick and noise hats programmed from the drum stem; a breathy synthesised falsetto singing the lyric syllables on the stem's pitch line, with echo."
