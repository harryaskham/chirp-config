about: "Hill-climb reproduction of Meshuggah — The Abysmal Eye (Immutable, 2022), from Songsterr tab 501674 (Fredrik leads 1/2, Fredrik and Mårten rhythm, bass, drums), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/the-abysmal-eye.json. v3: the tab's bend marks stripped from the rhythm guitars and bass (map strip ['bend'] on gtr-l/gtr-r/bass/bass8; leads keep theirs). v4: faint independent L/R copies of the bass (bassL/bassR: pan -1/+1, +7/+19 ms, bass gain -32 dB) for the record's wider 20-60 Hz. v6 (chirper-zero): the stems' balance (vocal +6 dB, drums -4 dB, rhythm guitars -2 dB; the record's drum stem sits 6.4 dB under the mix where ours sat 1.0, its vocal 9.6 where ours sat 18.5), the snare at G3 (song-local ae-kit), then a full level/eq/ride/width x2 refit on seeds 0 and 11. v7: the rhythm guitars' low single notes voiced root+octave (A1,A2 / Ab1,Ab2 / Bb1,Bb2 / C2,C3 by map subst: the record's guitar stem reads the riff's root at 30-55% per bar where ours spread at 15-20%), then a level/eq/ride refit and a --joint width pass on seeds 0 and 11. v8: the rhythm pair a +4 dB low shelf under 200 Hz (map extra fx; the mix read A's 5th/7th harmonics C#/G over the record's A/E), the last chord's low ring (Ab1/C#2/E2 on sub-saturated, ering-l/r, a lane calibrated per 0.1 s to the record's -13..-80 dB decay over 292.9-295.7 s), then ride and a --joint width pass on seeds 0 and 11. v9: the guitar shelf +6 dB (was +4), the record-contour gain lane on the rhythm pair (auto.envl, depth 1), and a --joint width pass on seeds 0 and 11."
