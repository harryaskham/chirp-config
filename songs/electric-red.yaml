about: "Hill-climb reproduction of Meshuggah — Electric Red (obZen, 2008), from Songsterr tab 43186 (ysph's human transcription: Thordendal (gtr-l) + Hagström (gtr-r) rhythm on the 8-string F standard, Fredrik's lead, Mårten's clean lead (bars 109-124), bass, drums; 156 bars of 4/4 at 110 BPM), aligned to the album recording: bar 1 at 0.256 s and tab bars 13-16 played twice (map repeat), 160 bars. The tab is four bars short of the record: from ~60 s on every 20-s window of the render sat 8.79 s (4.03 bars) early; any 4-bar repeat in bars 1-24 gained ~4 likeness points; the guitar stem's onset density per bar (sparse riff A at record bars 1-4 and 21-24, busy riff B at 13-20 and 25-32) places the extra block at tab 13-16, which also won after a fair ride refit on every seed (+0.27..+0.34 over 21-24; rhythm +16..+18 at 29-55 s). Generated by tools/tab2song.py from tools/maps/electric-red.json (the map reproduces every track). v1 (chirper-zero): stem balance (guitars -3.3, bass +3.3, drums -2.4 dB); root+octave on the rhythm pair's single low notes F1..E2 (map subst, chords restored); bass8 and bass24 copies; vox from the vocals stem (stemvox flux, re-timed on the repeat) rested in every performed bar where the stem sits under -18 dB re the mix (95 bars: stemvox had transcribed bleed), a formant EQ fitted to the stems' 1/6-octave LTAS over the sung bars (record peak 800-1000 Hz, kidman's 566-713 Hz, ours 4-7 dB short at 1.8-3.2 kHz: lowshelf 170 -5, 600 -9, 950 +8, 2000 +5, 3000 +4 dB) and its level matched in the sung bars, then -2 dB (+0.10); a song-local er-kit (metal-kit-dry, kick at C2: +0.65 every seed; scan B1 64.77 / C2 64.94 / C#2 64.41 / D2 64.77 against A1's 64.03); master: setup level/width/eq/ride/ride/width, a 2-pass ride refit on the corrected structure, the ending matched per 0.2 s from 344 s (auto.end: the record fades to -100 dB by 350.5 s, ours held -51 dB; last section 53 -> 67) and one --joint width pass on seeds 0 and 11. Tried and dropped: bass24 +6 dB (-0.12), bass-fuzz on the bass (+0.15 overall but -2.9..+5.0 by section)."
