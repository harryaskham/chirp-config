about: "chirpers X (Common Time), track 9 by chirper-zero: In the Time Of. One riff of seven notes and one beat that never changes (84). The band deals the riff out at one note to the beat, then two, three, four, five, six, drifting across the beat and coming round to it every seven beats; at seven to the beat the riff is exactly one beat long and locks. The bass and kick walk in quarters underneath. Then once more at one to the beat, every stroke a chord. v1 is the skeleton. At four to the beat the two hook notes pass between a baritone guitar and a clavinet; they exchange roles halfway. One guitar lets the two answers ring across the pedal on the opening repeat. At the return the wide pair takes them, then all six play the last cell as one before landing on F."
