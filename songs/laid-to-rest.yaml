patches: {"ltr-lead": {"about": "Laid to Rest's copy of chirp-config patches/m8-lead.yaml as of v21 (inlined so the song does not change when the shared copy does). Fluid, saturated legato lead (Thordendal-ish) with delayed vibrato, ping-pong delay and a big room.", "fx": [{"bias": 0.1, "drive": 0.5, "type": "drive"}, "delay time=3/16 mix=0.25 feedback=0.4 ping_pong=true tone=3k", "reverb mix=0.3 size=0.85"], "gain": "-16dB", "play": {"glide": "45ms", "legato": true}, "synth": {"amp": {"a": "8ms", "r": "150ms", "s": 1}, "env": {"f": {"a": "5ms", "d": "400ms", "s": 0.4}}, "filters": [{"cutoff": {"mod": [{"amount": 1, "src": "env.f"}], "value": "2.8k"}, "kind": "lp", "q": 1.4}], "layers": ["saw", "square cents=-6 level=-6dB", "sine ratio=0.5 level=-10dB"], "lfo": {"vib": {"delay": "200ms", "fade": "300ms", "rate": "6hz", "retrig": true, "wave": "sine"}}, "pitch": {"mod": [{"amount": 0.3, "src": "lfo.vib"}], "value": 0}}}, "ltr-rhythm-l": {"about": "Laid to Rest's copy of chirp-config patches/m8-rhythm-l.yaml as of v21 (inlined so the song does not change when the shared copy does). Left rhythm rig for double-tracked heavy riffs: the 8-string into a 5150-voiced amp with a screamer, cookie-monster/kitten-slayer cab blend, fizz dip and high shelf, a short plate. Pair with m8-rhythm-r on the right (different rig, pick and seed) for a real double.", "extends": "m8 layers.0.pick=0.12 layers.0.pickup=0.09 layers.0.click=0.2 layers.0.scrape=0.12 layers.0.thump=expr.pm*0.7 layers.0.squeak=expr.move*0.6", "fx": [{"decay": "1.2s", "mix": 0.06, "notes": "F1,Bb1,Eb2,Ab2,Db3,Gb3,Bb3,Eb4", "type": "sympathetic"}, {"bass": 0.55, "bloom": 0.35, "boost": "4dB", "gain": 0.8, "mid": 0.62, "model": "5150", "presence": 0.5, "resonance": 0.65, "sag": 0.25, "tight": 120, "treble": 0.5, "ts": 0.6, "type": "amp"}, {"blend": 0.35, "blend_file": "jester/kitten-slayer", "breakup": 0.3, "file": "jester/cookie-monster", "length": "120ms", "room": 0.12, "type": "ir"}, {"bands": ["peak cutoff=250 q=1