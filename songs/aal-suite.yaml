about: Animals-as-Leaders-style suite — thump/pop clean groove, clean tapped arpeggios, distorted chugs with a monster lead, back to the thump groove. vars dark, wet.
vars:
  dark: {value: 0, smooth: 400ms, min: 0, max: 1}
  wet: {value: 0.35, smooth: 400ms, min: 0, max: 1}
master:
  fx:
    - "glue threshold=-16dB ratio=2 attack=10ms release=150ms makeup=4dB"
    - "tape drive=0.2 warmth=0.35"
    - "width width=1.15 mono_below=120"
tracks:
  - name: arrangement
    score: "@aal-a @aal-c @aal-b @aal-a"
