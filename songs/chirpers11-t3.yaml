about: "Chirpers - Escapement, track 3 by chirper-zero: STANDING ROOM. One click a bar between two walls; a wall is a number of sixteenths there and back, so a room is a rhythm: 3 + 4 a room in seven, 2 + 3 in five, 5 + 7 in twelve, and 3 + 5, which is eight and fits the bar, where the echoes stand. A tock keeps each room's time, not the bar's. The click is in every room all the time; the song opens and shuts their doors. From v2 the click walks across each room a step a row (2 + 5, 3 + 4, 4 + 3, 5 + 2 in the corridor), and in standing room it stands. From v3 the bass learns the room's three-three-two (a note for the click, one for each wall) and carries it out of the door; the dry click is panned to where it stands. From v4 the walls close in between the stairwell and the hangar: eight rooms too small to count, which sing a rising scale. From v5 the click begins 163 m off across a square and is as late, as quiet and as dull as it is far; it walks in over the first sixteen bars and away over the last sixteen. From v8 it goes past again in the door, the other way and at a third of the speed of sound: three against two as it comes, three against four when it has gone, and its note falls an octave. From v7 something goes past outside, a sixteenth of sound away at a fifth of the speed of sound, striking straight eighths on one note: its strokes are heard five against four and a major third high as it comes, five against six and a minor third low when it has gone (the Doppler effect, of a rhythm and of a pitch at once). From v10 there are stairs in the stairwell: a clap at their foot comes back as a chirp, because each of sixty steps sends its own echo and the higher ones are further apart in time (D5 falling towards A4 in an eighth of a second); you walk to the stairs, so the chirp comes sooner and falls further. From v9 there is a standing wave in standing room: five held notes that fit between its walls, each as loud as it is where the ear is, and for three rows you walk from one wall to the other: the chord changes with where you stand and the top notes pass from ear to ear. From v6 there is a pipe in each wall of standing room, tuned to that wall's note, and one where the click stands: the click and its echoes strike them, so the room sings the bass's line (D, F from the left, C from the right) and for one row the bass rests under it. Generated by compose/chirpers11/src/chirpers11-t3.py."
