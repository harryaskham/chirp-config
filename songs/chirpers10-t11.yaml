about: "On Its Hinge \u2014 chirpers, Common Time, track eleven. A twelve-eighth riff in B flat; the drummer swaps six quick steps for four broad ones, on an unchanged riff. The reed organ breathes the broad walk before the kit takes it. The kettledrum answers the heavy riff on the next broad steps, then takes its last C."
