about: "Hill-climb reproduction of Meshuggah — Light the Shortening Fuse (Immutable, 2022), from Songsterr tab 506005 (rhythm + rhythm 2 on the 8-string, lead, bass, drums; 105 bars at 100 BPM, 4/4 with 7/4 over bars 65-72), aligned to the album recording (bar 1 at 0.043 s: the render read a constant 43 ms early at offset 0 in every 20 s window, corr 0.58-0.80; the closing rest bar repeated once so the song runs past the record's 268.2 s). Generated by tools/tab2song.py from tools/maps/light-the-shortening-fuse.json. v1 (chirper-zero): Jens' vocal from the vocal stem (tools/stemvox.py on the map's clock, flux onsets, 1/32 grid; 42 bars sung) on kidman; an octave-up bass copy (bass8, after chirper-one's Faultless finding); the stems' balance (bass +6, guitars -3, drums -3, vox +4 dB); masterstack level/width/eq/ride/ride/width + ride/width; the last 4.7 s ridden to the record and the length set to the record's 268.21 s. v2: the tab's palm-muted Bb power chords (Bb1,F2,Bb2,F3, 569 per guitar) voiced as root + octave (Bb1,Bb2; map subst), as the record's guitar stem reads (Bb 28-53% of its chroma where ours read F); ride + width refit twice on seeds 0 and 11."
