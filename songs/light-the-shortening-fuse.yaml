about: "Hill-climb reproduction of Meshuggah — Light the Shortening Fuse (Immutable, 2022), from Songsterr tab 506005 (rhythm + rhythm 2 on the 8-string, lead, bass, drums; 105 bars at 100 BPM, 4/4 with 7/4 over bars 65-72), aligned to the album recording (bar 1 at 0.043 s: the render read a constant 43 ms early at offset 0 in every 20 s window, corr 0.58-0.80; the closing rest bar repeated once so the song runs past the record's 268.2 s). Generated by tools/tab2song.py from tools/maps/light-the-shortening-fuse.json. v1 (chirper-zero): Jens' vocal from the vocal stem (tools/stemvox.py on the map's clock, flux onsets, 1/32 grid; 42 bars sung) on kidman; an octave-up bass copy (bass8, after chirper-one's Faultless finding); the stems' balance (bass +6, guitars -3, drums -3, vox +4 dB); masterstack level/width/eq/ride/ride/width + ride/width; the last 4.7 s ridden to the record and the length set to the record's 268.21 s. v2: the tab's palm-muted Bb power chords (Bb1,F2,Bb2,F3, 569 per guitar) voiced as root + octave (Bb1,Bb2; map subst), as the record's guitar stem reads (Bb 28-53% of its chroma where ours read F); ride + width refit twice on seeds 0 and 11. v3: the riff tom t2 retuned to the drum stem (song-local ltsf-kit: G#2, was D3), then ride/width x2 refit on seeds 0 and 11. v4: the rhythm pair a +4 dB low shelf under 200 Hz (map extra fx) and the record-contour gain lane (auto.envl, depth 1), the ending's last B1 held to 264.2 s then cut 25 dB and released by 265.3 s (master lane auto.cut: the record stops dead onto its cymbal decay), then ride and a --joint width pass on seeds 0 and 11. v5: faint independent L/R copies of the bass (bassL/bassR: bass-fat, pan -1/+1, 7/19 ms delays, -26 dB; chirper-one's Ligature Marks v7 recipe) for the record's wider 20-60 Hz, the guitar shelf +6 dB, then eq/ride and a --joint width pass on seeds 0 and 11. v6: the ending re-matched per 0.2 s from 263.8 s (endlane.py, master lane auto.end), the rhythm-pair shelf +8 dB (was +6), and a --joint width pass on seeds 0 and 11. v7: the rhythm-pair shelf +10 dB (was +8), ride and a --joint width pass on seeds 0 and 11. v8: the bass doubled two octaves up (bass24: the bass's notes at +24, -10 dB): the bass's Bb0/Bb1 (bass + bass8) both sit under the 100 Hz chroma floor, so its 7th harmonic read G# where the record's bass reads A#."
