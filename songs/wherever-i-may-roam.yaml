about: "Metallica - Wherever I May Roam (S&M, 1999, live with the San Francisco Symphony; reference from Harry's Drive, ~128-160 kbps MP3), from Songsterr tab 3707 (human, the Black Album arrangement in E standard, played a half step down on S&M: map transpose -1; vocals, Kirk's lead, James' clean, harmony and rhythm guitars, Jason's bass, Kirk's electric sitar, drums and shaker). Generated by tools/tab2song.py from tools/maps/wherever-i-may-roam.json. Offset 3.42 s and per-marker-section tempos 115-155 BPM (clamped to +-15% of the take's global 135) from a DTW read of the map's bar starts. The crowd as chirper-zero's sm-crowd bed (-6 dB); drums and shaker snapped within 320 ms to an htdemucs_6s drum stem (plain separation, /tmp; the crowd-free livestems run was still going); the orchestra from that run's other stem (tools/padtrans.py, 675 notes on strings -8 dB); the vocal from its vocal stem (tools/monotrans.py, 171 notes on maynard) in place of the tab's. v6: the tab ends at 391 s but the S&M band holds an Eb5 ending (guitar/bass stems Eb/Bb at -25/-24 dB) to ~412 s: an ending of Eb5 restruck each bar (1.75 s) with decaying velocity on two rhythm-guitar tracks (pan -/+0.6, 12 ms apart) and Eb1 on the bass, 393.6-412.4 s, 6 dB under the rhythm/bass. Bed trim (Harry, 26 Oct: the S&M audience noise was too heavy-handed): crowd-l/crowd-r -25 dB, to sit 30+ dB under the music over the body (tools/bedlevel.py); the applause edges unchanged."
