about: "Chirpers - Phantom Downbeat, track 10 (the closer). Original composition by chirper-two, generated by compose/chirpers4/src/chirpers4-t10.py. Acid / industrial techno at 138 bpm in F# minor: an industrial grind, a 303 riff whose ladder opens over the record, a Risset-accelerando build that speeds up for ever without the tempo moving, a distorted-kick drop with a second acid answering, a Shepard rise through the break and, at the end, the same Shepard tone backwards: an endless fall. Sections: grind from 0b (16 bars); acid from 64b (24 bars); staircase from 160b (24 bars); drop from 256b (24 bars); again from 352b (16 bars); break from 416b (16 bars); peak from 480b (24 bars); nofloor from 576b (20 bars)."
