about: "chirpers X (Common Time), track 7 by chirper-zero: Extreme and Mean. Two cells, a long of three sixteenths and a short of two, and one rule: a long becomes a long and a short, a short becomes a long. The pattern it makes never loops and is the same at every size, so the band plays it at many sizes at once: muted strokes, open notes, chords, crashes, the root, and the song's own sections (long ones heavy, short ones quiet). The kit keeps common time against it. In the quiet sections a wire harp has no notes, only the rule (the engine's L-system). The slow song: 80. v1 is the skeleton."
