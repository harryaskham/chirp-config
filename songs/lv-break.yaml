about: Live suite 5/5 — slow, heavy breakdown at 90 with china/kick unison, distorted bass drops and sub hits.
tempo: 90
length: 16b
vars: {dark: 0, wet: 0.35}
buses:
  room: {fx: ["reverb mix=1 size=0.75 damp=0.55"], gain: {value: -16dB, mod: [{src: var.wet, amount: 16}]}}
  gtr: {fx: [{type: filter, kind: lp, cutoff: {value: 16k, mod: [{src: var.dark, amount: -4.5}]}, q: 0.8}]}
tracks:
  - name: drums
    patch: haake
    sends: {room: -8dB}
    score: "[ k,x/4@124 k/16@110 k@90 . k@104 s,c/4@124 R/8 k/16@108 (k@100|.) ]x4"
  - name: gtr-l
    patch: m8-gojira
    pan: L90
    out: gtr
    seed: 6
    sends: {room: -12dB}
    score: &brk >
      [ expr.pm=0 F1,C2,F2/4@126^gate=0.9 expr.pm=1 F1/16@112 F@80 . F@106 expr.pm=0 (B1,F2|Gb1,Db2)/4@124^gate=0.9 R/8
        expr.pm=1 F1/16@116 (F2@118^ph^gate=1.5|F1@96) ]x4
  - name: gtr-r
    patch: "m8-gojira fx.1.file=jester/darth-genocider layers.0.pick=0.14 humanize.time=6ms"
    pan: R90
    out: gtr
    seed: 6
    sends: {room: -12dB}
    score: *brk
  - name: bass
    patch: m8-bass-dist
    seed: 6
    score: &brkb "[ F1/4@126 F1/16@112 F@80 . F@106 (B1|Gb1)/4@124 R/8 F1/16@116 (F1@96|F1@100) ]x4"
  - {name: sub, patch: sub, seed: 6, score: *brkb}
  - name: pad
    patch: saw-pad
    sends: {room: -6dB}
    gain: -4dB
    score: "[ F2,C3,F3/1@90 ]x2 Gb2,Db3,Gb3/1@92 B1,F2,B2/1@96"
  - name: fx
    sends: {room: -10dB}
    score: "patch=fx-impact F1/4@112 R/4 R/2 R/1 R/1 patch=fx-riser C4/1@96"
  - name: fx-rev
    patch: fx-revcym
    score: "R/1 R/1 R/1 R/2 C5/2@96"
