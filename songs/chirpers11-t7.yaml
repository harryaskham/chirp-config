about: "Chirpers - Escapement, track 7 by chirper-zero: OUT OF STEP. Two clicks, the same sound and the same half-bar pattern; one is on the grid, the other slips a sixteenth ahead every eight bars and catches there (eight locks, then home), and later drifts back without stopping. Where they part they make a comb; the bass is two sines one cycle a beat apart that cancel on every beat. From v5, while B drifts home, the bass plays the first stroke the two clicks share at each lock B passes, G or B flat: it moves for the first time, and says where the locks are. From v4, while the two are one click (the opening and the ending) they are given an ear each and one swings 0.6 ms ahead of the other and behind it: the click is heard to swing from ear to ear, with nothing panned. From v2 a third click plays the pattern's three holes once the two are home: together they sound every sixteenth exactly once, and apart they collide. From v3 a small pip plays the sixteenths on which the two clicks strike together, a note for each stroke of the pattern (G, B flat, D, F, A): every lock has its own tune, and home is the whole chord. From v7, for the first four rows of the slips, A has the left ear and B the right (0.85 of the way): the strokes they share are one click in the middle, each one's own are at its side, and as B slips the middle click leans, then splits (on one speaker the two clicks are as they were). From v8, for the last eight bars of one click, the two clicks stand in one place and B goes half a turn of the click's own wave ahead (2.55 ms), then a whole turn, and back: at half a turn the odd harmonics cancel and the click is heard an octave up; at a whole turn it is itself again. From v9, in the second row of one again, one click plays its wave's own scale: struck n times, a n-th of a turn of its wave apart, it is the click on n times its note and no higher in peak (G3 G4 D5 G5 D6 F6 G6 A6 for n = 1 2 3 4 6 7 8 9), a click a beat, up and down twice. From v10 the click rolls: from sixteenths it quickens by the same ratio every beat until its strokes are one turn of its own wave apart, 196 a second, where every stroke is in step with the last one's tail and the row of clicks is one held note, G3: once, in the two bars of slips where the drum rests, landing on its return. From v12 a small bright click on the odd sixteenths, wherever the hat plays, is two clicks in one place: in slips and drifts the second goes up to twelve samples behind the first and back every four bars (too close to be heard as two, they are heard as a colour: a comb whose notches walk down the undertones of 24 kHz and up again), and in home they are in step to the sample. From v11 the bass has a second pair of tones under it from the middle of drifts until it stops, on D2 and a cycle and a half a beat apart: it swells three times in two beats while the bass swells twice, and the two agree once every two beats: three against two, from four sines. From v14 a third pair of tones sounds wherever the bass does, on C4 and two and a half cycles a beat apart: it swells five times in two beats while the bass swells twice and the D pair three times, and all three agree once every two beats: two against three against five, from six tones that never change. From v6, in the second row of home, the tune has a B of its own: a second pip an octave lower plays the same five notes and slips a sixteenth ahead of the tune every two bars, so the tune is heard in canon with itself at four distances (Piano Phase's way, in the record's chord). From v13, in the eight bars of drifts in which the bass drum stands back, the click's own note is held (the note the roll arrives at) and goes through a phaser: which of its harmonics are weakened sweeps there and back every two bars. From v15 a vernier runs through bars 25 to 48: 17 small high ticks in every bar against its sixteen sixteenths, so the ticks are with the click at the bar line and slip a whole sixteenth ahead of it by the bar's end, once every bar. From v16, through bars 49 to 56, A's strokes are heard a second time in the middle with every phase set to nought (a phase vocoder's robot): the same spectrum, but now each has a note, the one the tune gives its place, an octave down. From v17, in 2 rows where the bass drum rests and then comes in, fifteen held low tones (44.1 to 73.5 Hz, the beat's own multiples) come slowly into phase: a hum that draws itself together into a thump a beat, and is a drum on the line where the drum comes in. From v18, in the two breaks where the bass drum rests, 12 small clicks that begin as one come apart (each has its own tempo, up to 4% off) and then, listening only to each other, find the beat again and are one click when the drum comes in. From v19 a second small drum changes gear against the bass drum: it plays every ratio between one and two whose lower number is 4 or less, in order (1:1, 5:4, 4:3, 3:2, 5:3, 7:4, 2:1), each for whole turns and a bar's worth of beats at least, which is eight bars exactly; the two strike together at the start of every turn, so every change is made in step: up through the gears before the roll, down through them in the last row the bass drum plays. From v20 the note the roll arrives at stays for 6 bars, one plain tone, and is turned upside down every three sixteenths, half-way between two sixteenths, where nobody strikes: nothing is struck, and every turn is a click, because the ear does not hear which way up a tone is but hears it change. How loud the click is depends on where in its wave the tone is caught: at its top the step is twice its height, at nought there is none; the tone has a sixteenth of a wave more than a whole number in every turn, so the clicks swell and die away every eight turns, 4 times in the 6 bars, with nobody playing louder or softer. (The track is heard through a shelf, 12dB up over 600 Hz, where a plain tone has nothing: only the turns are brighter for it.) From v21 the pendulum the song began with is pushed until it goes over the top (bars 113 to 120, a row of the drifts that had nothing of its own). It is a real pendulum, so a wide swing takes longer than a small one, and the escapement pushes it at every pass through the bottom (its tick, in the middle; 12.2% of its speed each time). A small tick 8 times a beat is where the bob is: it swings from side to side, wider and slower (2.15 2.19 2.26 2.36 2.52 2.85 6.32 beats from tick to tick), all but stops at the top, far off, falls back, and at the next push goes over: after that it only goes round, 7.5 turns by the row's end, each quicker than the last. From v22 one note comes apart into 8 rhythms (bars 105 to 112): the first 8 harmonics of Bb2, each a plain tone, the n-th striking n times a bar; two more come in every bar, and all 8 play the row's second half. On every bar line they strike together from the same point of their waves and are one note, a saw; inside the bar they are 1 against 2 against 3 and so on to 8, and what strikes at p/q of the bar is harmonic q with its multiples: the note heard is the denominator (a rhythmicon: Cowell and Theremin, 1931). From v23 A's click comes apart (bars 65 to 72): on two sixteenths of every bar a second copy of it goes through a chain of all-pass filters, which change nothing in it but the phase of each frequency: the spectrum is the click's, and the sound is a falling chirp, because its harmonics no longer start together: the chain holds the low ones back longest. Every two bars the chain is twice as long (32, 64, 128, 256 filters): the click's third harmonic (588 Hz) comes 13, 26, 51, 102 ms after its twenty-fourth. From v24 the same chains are used the other way (bars 129 to 136): a rising whistle goes in and a click comes out. Each frequency of the whistle, from 588 Hz to 6000, is sounded as long before the instant as the chain will hold it back, so the chain puts them all in step: a radar's pulse, a bat's call. The whistle is 107, 53, 27, 13 ms long through 256, 128, 64, 32 filters, two bars each, 3 dB up for every halving: the same energy goes in, and the same click comes out, half a sixteenth after A's clicks on 6 and 14, where nothing else strikes. The whistle is heard as it goes in, quietly, on B's side; the click comes out on A's. From v25 one note is out of step with itself (bars 33 to 40, under the vernier, before the bass comes in): a plain tone on the bass's G2 whose phase an unheard wave pushes 0.25 of a turn ahead and 0.25 back. A bar each: 1 a beat, 2 a beat, 4 a beat, 8 a beat, 16 a beat, 0.5 a wave, 1 a wave, 2 a wave. Slowly it is a wobble of pitch (94.7 to 101.3 Hz at once a beat); faster, the wobble cannot be followed and the one tone is heard as several: the note itself -6.5 dB, a pair of side tones -4.9 dB as far above and below it as the phase is turned a second, the next pair -12.1 dB (Bessel's functions): phase modulation, the way a whole family of synthesizers makes its sounds. From v26 the swarm hums (bars 57 to 64, the first break, where the bass drum rests): each of the swarm's 12 clicks holds a low tone that makes 31 waves for every beat of its own tempo (65.1 Hz and its octave). A rhythm and a pitch are one thing at two speeds: while the clicks are out of step the tones are out of tune, a rumble that gathers itself into a soft thump every 4.44 beats (a drum nobody strikes, slipping against the bar); as the clicks find the beat the thumps grow longer until they are one held note, which shows the swarm's last error 31 times larger than the clicks do. From v27 there is an octave by phase alone (bars 89 to 96, the first row of home): one note on every off beat, harmonics 13 to 26 of the bass's G2 and nothing under them. For 2 bars every harmonic starts on its sine and the wave pulses once a period; after that every second note has its even harmonics a quarter turn on, pulses twice a period, and is heard an octave up: 20 notes and 12, the same harmonics at the same strengths in both. From v28 two saws are out of step (bars 97 to 104, the second row of home): a sawtooth on C3 (130.8 Hz, 8 harmonics) is held a bar at a time; from the second bar the same sawtooth sounds with it, upside down: bar by bar the second is in step (the two are nothing), 1/16 of a wave late, 1/4 of a wave late, 1/2 of a wave late, 1/4 of a wave late, 1/16 of a wave late, in step (the two are nothing), and what is left is a pulse as wide as the second is late: at half a wave a square, every even harmonic gone. No note changes: only the second saw's phase. From v29 a phrase is in phase and out of phase (bars 73 to 80, the row of the gears in 'slips'): G4 Bb4 D5 C5 Bb4 G4 F4 G4, two bars, 4 times, the same in each ear every time; the second and fourth time the right ear's wave is upside down: the phrase is then in neither the left nor the right alone but in their difference, where almost nothing else is: it leaves the middle and comes clear of the drum; on one speaker it is not there. From v30 a beat is only in the head (bars 49 to 56, the row of the sung clicks in 'slips'): a low note in each ear, 249 waves to the bar in the left (130.725 Hz) and 250, 250, 251, 251, 253, 253, 257, 257 in the right, bar by bar: each ear by itself has a steady note, and the difference in phase between the ears goes round 1, 1, 2, 2, 4, 4, 8, 8 times a bar: slowly it crosses the head, fast it flutters; on one speaker it is a plain beat. From v31 loudness is lateness (bars 145 to 152, the row after the drum has gone): two low tones of 28 waves to the beat (58.8 Hz) at one level, and neither ever changes: one is held, the other begins again on every beat, in step, 1/4 of a wave late, 1/3 of a wave late, 1/2 of a wave late: together +6.0 dB, +3.0 dB, +0.0 dB, nothing of one. From v32 in step, a click; out of step, a hum (bars 17 to 24): the 5th to the 20th tones of G1 (245 to 980 Hz), all at one level, struck on the off beats in pairs: one with every tone begun together (in step once every wave of the note: a tick 49 times a second) and one with each begun a different part of its own wave late (the same tones at the same levels, and no tick), the order turned round every other pair: 14 of each. From v33 five out of step make a stair without end (bars 25 to 32): G1 with all its overtones, held, through 5 narrow windows 1 octave apart (98 Hz and up) that all climb an octave every 4 bars, each coming in at the bottom and going out at the top: the overtones are picked out one after another, always upward, and every 4 bars the same chord stands there again. From v34 one and one make two, one, or nothing (bars 113 to 120): a plain tone (520.8 Hz) alone and steady for 2 bars; then a second tone of the same pitch and loudness sounds with it all the time, in step (the two make one twice as high), a third of a turn out (one exactly as loud as either) or half a turn out (nothing): the rhythm is the second tone's phase and nothing else. From v35 a quarter of a turn and the throb is gone (bars 137 to 144): three plain tones, a middle one (Bb5) and one 4.2 Hz to either side; for 2 bars the middle one is in step with the sides and the three swell and sink 2 times a beat; for the next 2 it is turned a quarter of a turn and the same three tones, as loud, hardly throb; and again. From v36 the wave slips under its own beat (bars 43 to 48): a short note whose beat is G3's and whose every tone is moved up by the same eighth of that at each step: the beat inside the note never changes, the wave under it is an eighth of a turn further on, and after 8 steps it is the first note again. From v37 out of step, and the ear cannot tell (bars 9 to 16): a short note of two plain tones an octave apart, twice a bar; the first of each pair always the same, the second with its upper tone an eighth of a turn further out of step each bar; the wave changes shape and the two tones do not. The throb's last note goes out over two bars. Generated by compose/chirpers11/src/chirpers11-t7.py."
