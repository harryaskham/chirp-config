about: "Chirpers - Escapement, track 7 by chirper-zero: OUT OF STEP. Two clicks, the same sound and the same half-bar pattern; one is on the grid, the other slips a sixteenth ahead every eight bars and catches there (eight locks, then home), and later drifts back without stopping. Where they part they make a comb; the bass is two sines one cycle a beat apart that cancel on every beat. From v5, while B drifts home, the bass plays the first stroke the two clicks share at each lock B passes, G or B flat: it moves for the first time, and says where the locks are. From v4, while the two are one click (the opening and the ending) they are given an ear each and one swings 0.6 ms ahead of the other and behind it: the click is heard to swing from ear to ear, with nothing panned. From v2 a third click plays the pattern's three holes once the two are home: together they sound every sixteenth exactly once, and apart they collide. From v3 a small pip plays the sixteenths on which the two clicks strike together, a note for each stroke of the pattern (G, B flat, D, F, A): every lock has its own tune, and home is the whole chord. From v7, for the first four rows of the slips, A has the left ear and B the right (0.85 of the way): the strokes they share are one click in the middle, each one's own are at its side, and as B slips the middle click leans, then splits (on one speaker the two clicks are as they were). From v8, for the last eight bars of one click, the two clicks stand in one place and B goes half a turn of the click's own wave ahead (2.55 ms), then a whole turn, and back: at half a turn the odd harmonics cancel and the click is heard an octave up; at a whole turn it is itself again. From v9, in the second row of one again, one click plays its wave's own scale: struck n times, a n-th of a turn of its wave apart, it is the click on n times its note and no higher in peak (G3 G4 D5 G5 D6 F6 G6 A6 for n = 1 2 3 4 6 7 8 9), a click a beat, up and down twice. From v10 the click rolls: from sixteenths it quickens by the same ratio every beat until its strokes are one turn of its own wave apart, 196 a second, where every stroke is in step with the last one's tail and the row of clicks is one held note, G3: once, in the two bars of slips where the drum rests, landing on its return. From v12 a small bright click on the odd sixteenths, wherever the hat plays, is two clicks in one place: in slips and drifts the second goes up to twelve samples behind the first and back every four bars (too close to be heard as two, they are heard as a colour: a comb whose notches walk down the undertones of 24 kHz and up again), and in home they are in step to the sample. From v11 the bass has a second pair of tones under it from the middle of drifts until it stops, on D2 and a cycle and a half a beat apart: it swells three times in two beats while the bass swells twice, and the two agree once every two beats: three against two, from four sines. From v14 a third pair of tones sounds wherever the bass does, on C4 and two and a half cycles a beat apart: it swells five times in two beats while the bass swells twice and the D pair three times, and all three agree once every two beats: two against three against five, from six tones that never change. From v6, in the second row of home, the tune has a B of its own: a second pip an octave lower plays the same five notes and slips a sixteenth ahead of the tune every two bars, so the tune is heard in canon with itself at four distances (Piano Phase's way, in the record's chord). From v13, in the eight bars of drifts in which the bass drum stands back, the click's own note is held (the note the roll arrives at) and goes through a phaser: which of its harmonics are weakened sweeps there and back every two bars. From v15 a vernier runs through bars 25 to 48: 17 small high ticks in every bar against its sixteen sixteenths, so the ticks are with the click at the bar line and slip a whole sixteenth ahead of it by the bar's end, once every bar. From v16, through bars 49 to 56, A's strokes are heard a second time in the middle with every phase set to nought (a phase vocoder's robot): the same spectrum, but now each has a note, the one the tune gives its place, an octave down. From v17, in 2 rows where the bass drum rests and then comes in, fifteen held low tones (44.1 to 73.5 Hz, the beat's own multiples) come slowly into phase: a hum that draws itself together into a thump a beat, and is a drum on the line where the drum comes in. From v18, in the two breaks where the bass drum rests, 12 small clicks that begin as one come apart (each has its own tempo, up to 4% off) and then, listening only to each other, find the beat again and are one click when the drum comes in. Generated by compose/chirpers11/src/chirpers11-t7.py."
