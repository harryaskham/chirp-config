 Hz: nothing of it over 10 kHz.", "play": {"vel_sens": 1}, "synth": {"layers": ["saw phase=0"], "filters": [{"kind": "hp", "cutoff": 700, "q": 0.7}, {"kind": "lp", "cutoff": 7500.0, "q": 0.7}, {"kind": "lp", "cutoff": 7500.0, "q": 0.7}], "amp": {"a": "0.1ms", "d": "16ms", "s": 0, "r": "8ms", "curve": 3}}}, "ht-gliss": {"about": "Hearing Things' falling tone (chirper-zero, 27 Nov, v26): one plain tone, held; its note is drawn by its track's lane `auto.fall` (semitones over the written note) and its loudness by the track's `gain` on `auto.bell` (dB): one tone of the bass that falls for ever.", "play": {"vel_sens": 0, "gate": 1}, "synth": {"layers": ["sine phase=0"], "pitch": {"value": 0, "mod": [{"src": "auto.fall", "amount": 1}]}, "amp": {"a": "60ms", "d": "0s", "s": 1, "r": "60ms"}}}, "ht-swell": {"about": "Hearing Things' low note with a shape (chirper-zero, 27 Nov, v27): a plain tone and its octave, 240 ms long, its loudness drawn by its track's lane (auto.shape, dB, a straight line 40 dB long): on the track `swell` it rises to its top and stops, on the track `struck` it begins at its top and dies away: one is the other played backwards. Nothing over 165 Hz.", "play": {"vel_sens": 0, "gate": 1}, "synth": {"layers": ["sine phase=0 ratio=1 level=0dB", "sine phase=0 ratio=2 level=-9dB"], "amp": {"a": "2ms", "d": "0s", "s": 1, "r": "8ms"}}}, "ht-alike": {"about": "Hearing Things' ticks that are all alike (chirper-zero, 27 Nov, v28): a plain tone on E8 (5274 Hz) that dies in 12 ms; its loudness goes as the velocity squared, and the velocity only undoes what the master does to a tick at its place in the bar. The track `alike-twice` strikes the same tick again at the same instant: the two add to one tick 6 dB up.", "play": {"vel_sens": 1}, "synth": {"layers": ["sine phase=0"], "filters": ["lp cutoff=7000"], "amp": {"a": "0.1ms", "d": "12ms", "s": 0, "r": "4ms", "curve": 3}}}, "ht-hole": {"about": "Hearing Things' chord of plain tones (chirper-zero, 27 Nov, v29): one sine