about: "Chirpers - Escapement, track 5 by chirper-zero: HEARING THINGS. Three things that are not on the record: a beat that turns around (the click and the bass are on the off-beats from the first bar; the bass drum says so later), a bass with nothing at its own pitch (harmonics two to six), and a hat that speeds up through every row and starts the next where it started the last (a Risset rhythm in four layers). From v2 each layer of the hat has a small tone of its own that climbs an octave a row, so it is faster and higher for ever. From v7 the same bells are stairs, in the first two rows of never arrives: B, D, F, A flat, a minor third from each to the next and from the last to the first, so every step is heard to rise and the fifth bell is the first again (Shepard's scale). From v6 a bell with no octave says B C D and is answered B F, then B A G and the same answer: the same two strokes are heard going up the first time and down the second (the tritone paradox, set by what was just heard). From v8 a click struck four times on the left and four on the right, faster each time, is heard to hop across through places where nothing was struck (saltation: the rabbit), in the bar where the drum rests at the end of each row of round the click. From v5 a pip plays three strokes and a rest (A B A .) and B moves away from A a third, a fifth, an octave, and back: no stroke moves, and the one galloping line comes apart into two even ones (stream segregation). From v4 there is a chord with a hole in every other sixteenth; when a noise is put in the holes it is heard held, unbroken (the continuity illusion). From v3 the drum goes round the click a sixteenth a row (just before it, on it, just after it, then the true beat), so the same click is heard as every sixteenth of the beat and never moves. Generated by compose/chirpers11/src/chirpers11-t5.py."
