about: "Chirpers - Escapement, track 5 by chirper-zero: HEARING THINGS. Three things that are not on the record: a beat that turns around (the click and the bass are on the off-beats from the first bar; the bass drum says so later), a bass with nothing at its own pitch (harmonics two to six), and a hat that speeds up through every row and starts the next where it started the last (a Risset rhythm in four layers). From v2 each layer of the hat has a small tone of its own that climbs an octave a row, so it is faster and higher for ever. From v7 the same bells are stairs, in the first two rows of never arrives: B, D, F, A flat, a minor third from each to the next and from the last to the first, so every step is heard to rise and the fifth bell is the first again (Shepard's scale). From v6 a bell with no octave says B C D and is answered B F, then B A G and the same answer: the same two strokes are heard going up the first time and down the second (the tritone paradox, set by what was just heard). From v8 a click struck four times on the left and four on the right, faster each time, is heard to hop across through places where nothing was struck (saltation: the rabbit), in the bar where the drum rests at the end of each row of round the click. From v9 there is a pulse in not there that is not on the record: two plain tones either side of A4, three cycles a beat apart, beat in the middle (a real beat, a triplet), then go apart to an ear each, where each is steady and the pulse is heard all the same (a binaural beat); in the last row they are a cycle and a half a beat apart. From v10 the scale of A minor goes up and down at once, its notes dealt to the two ears turn about, so each ear is given a jagged tune and neither a scale; two smooth lines are heard, the high in one ear and the low in the other (the scale illusion). Each ear's part is heard alone first. From v12 a small wooden click in held is given to both ears, the same click and as loud in each, and the right ear gets it later and later: at 0.65 ms it has walked to the left, up to 5 ms it is still one click there, and then it comes apart into a click and its echo; and back, with the late ear twice as loud (the law of the first wavefront). The click's own two notes (E5 and its third partial) are turned down 4 and 5 dB from bar 9 to bar 176 (the first two bars and the last sixteen have it as it was). From v14 there is a section after held, in the noise: both ears are given the same noise, but the right ear's has been through an all-pass filter that turns the phase a whole turn at one frequency and changes no loudness anywhere. Each ear has plain noise; between them there is a faint note at that frequency, and it is moved through a tune (A C E A, A E C A) that neither ear is given. The second time the tune is also played quietly by a plain tone, so that one speaker has it too. From v13 two small clicks that are the same click to the sample come two sixteenths apart, either side of the song's click on beats one and three: the second is heard as the loud one (an accent made of time alone), and section by section it is really turned down, 0, 2, 4 and 6 dB, until the two sound equal or the first wins. From v11 the bells go down for six bars in all three, three semitones a step, while the curve they are under climbs an octave: forty-eight steps down, and the last bell is the first one's name and higher than it (Risset's paradox). The first bell is said before and the two side by side after. From v15, in bars 3 to 8, a pip climbs three notes (A C E) over and over, a sixteenth each, shared turn about between two hands; when the second hand's sound is made brighter the one climbing line is heard as two lines, each going down (Wessel's illusion). From v5 a pip plays three strokes and a rest (A B A .) and B moves away from A a third, a fifth, an octave, and back: no stroke moves, and the one galloping line comes apart into two even ones (stream segregation). From v4 there is a chord with a hole in every other sixteenth; when a noise is put in the holes it is heard held, unbroken (the continuity illusion). From v3 the drum goes round the click a sixteenth a row (just before it, on it, just after it, then the true beat), so the same click is heard as every sixteenth of the beat and never moves. From v16, wherever the line plays, the beat after each loud click is filled with 3 small dry ticks and the beat after each soft click is left empty: every beat is the same length, and the full ones are heard as longer (the filled-duration illusion). From v17 each of those strokes carries a crack as well (ten plain tones from 2.4 to 9.2 kHz, gone in 5 ms; the same in both ears to the sample): the law is measured with clicks, and a crack comes apart into two sooner than the wooden click does. From v18, in the first eight bars of turned around, two plain notes an octave apart (A4 and A5) change ears every eighth: each ear is given both, turn about, and never the one the other has; the left ear's part is heard alone, then the right's, then both, and with both most people hear the high note in one ear only and the low note in the other (Deutsch's octave illusion), whichever way round the headphones are. From v19, in the first row of round the click, a bell whose tones are 2.1 times apart is written an octave higher at every click (D1 to D8) and back: each octave up is heard as a small semitone down (Risset's paradox). From v20 one low note (D2: 18 plain tones, its multiples) is held through the first row of held, and from its third bar some of its tones waver together, every third, fourth, sixth, fourth, third, second, a bar each: nothing is added and nothing gets louder, and the ones that waver are heard as a second voice singing the note they are the multiples of (McAdams 1984): a tune that is written nowhere. From v21, in the 3 pairs of bars of never arrives that had nothing of their own, two plain tones in one place set out for each other's notes: one from A3 straight up to A5, one from A5 straight down to A3, an octave a bar; they cross on A4 a bar in. Neither turns. But the ear follows what is nearest in pitch, and hears the high one come down, touch and go back up, and the low one go up and come back down: two turns that are not there, and neither line arrives. The last time the rising one flutters, and is heard to go straight through. From v22 a tune everybody knows is played with every note thrown to another octave, and is not known (bars 161 to 168, the first row of all three, which had nothing of its own): the half hour of the clock in Give or Take, the record's first song. First thrown about (C6 E4 D6 G4 C5 D6 E4 C6: every NAME is right), then plainly (C4 E4 D4 G3 C4 D4 E4 C4), then thrown about again, the same eight notes as before: and now the tune is in them (Deutsch 1972). From v23 there is a hiss in the row with no hat (bars 145 to 151): for two bars a hiss that never repeats, then the same kind of hiss, as loud, in the same band, that is only 6, 3, 1.5 sixteenths long and comes round and round. Nothing is struck and its level is not moved: but a noise that repeats is heard to have a pattern in it, each listener's own, and here the pattern is three against the beat's four, then six, then twelve (Guttman and Julesz, 1963). From v24 there are two plain high tones in the first row of 'not there' (bars 81 to 88): one held on D7 (2349 Hz) and one sliding over it, from 1.1 to 1.3 times it and back. Two tones in one ear make a third IN THAT EAR, at twice the lower less the upper: here from 2114 Hz to 1645 Hz: as the upper tone goes up, a tone nobody wrote goes down, half as far again, and the other way about. Nothing in the file is at its frequency. For the two middle phrases the tones are given an ear each: on headphones no ear has both, and the third tone is gone; on loudspeakers it stays. From v25 every click of the third row of 'round the click' (from bar 153) has two small clicks before it: three strokes, two empty times. For 4 bars the times are 60 ms and then 120 ms: the second twice the first, and (time-shrinking) heard as nearly the same: the click seems to come on time. For the next 3 the middle click is 60 ms later, the times are 120 and 60 ms, and they are heard as they are: long, short. From v26 there is a bass in the second row of 'held' (bars 113 to 120), where there was no drum and no bass: 4 plain tones an octave apart, all sliding down together, an octave every 2 bars, under one fixed curve of loudness from 27.5 to 440 Hz, loudest at 110 Hz and silent at both ends. Each tone goes out unheard at the bottom as a new one comes in unheard at the top. It is heard to fall the whole row: 48 semitones by its tones; and at the end it is where it began (Shepard, 1964; Risset, 1969). From v27 a swell is heard late (bars 129 to 136, 'the wrong one again', where there is no drum and the bass has no fundamental): a low note on the bass's own note begins on every true beat and lasts two sixteenths, to the click. For 4 bars it swells and stops on the click: it is heard where it arrives, with the click, and the click is the beat. For 4 bars the same notes at the same instants are struck and die away: they are heard where they begin, and the click is the off beat. No note has moved; a sound's moment is not its start (the perceptual centre). From v28 there is an accent that is not there (bars 33 to 40, the last row of 'turned around'): a small tick on every sixteenth, 128 of them, every one the same where it is heard. For 2 bars they are all alike, then for 2 bars every third one is struck twice as hard (6 dB), then for 4 bars they are all alike: 11 ticks are struck twice. Ticks that are all alike are not heard alike: the ear groups them, and hears an accent that is not in the sound. From v29 there is a tune of holes (bars 97 to 104, the last row of 'not there'): a chord of 8 plain tones (E6 G6 A6 C7 D7 E7 G7 A7), every tone as loud as every other, sounds 16 times, the same every time; before each it is heard for 1 of a beat with one tone left out. In the whole chord the tone that was left out stands out, though it is no louder than the rest: the ear has got used to the others. The tones left out are the tune that is in neither ear (A6 C7 E7 A7 A7 E7 C7 A6). From v30 there is a hurry that is not there (bars 89 to 96, the middle row of 'not there'): a stair of low notes (E2 to A4), three to every two beats and exactly even in time, climbs for two bars and comes down for two, twice (48 notes, 320 ms apart, every one): a line that rises is judged to be speeding up and one that falls to be slowing down; nothing in its time changes. From v31 the louder is the lower (bars 81 to 88, the first row of 'not there'): one plain low note (E2), loud and soft by turns (12 dB apart, a note every 2 beats) for 4 bars, then held for 4, swelling 12 dB and sinking back: its frequency never moves; a plain low note is said to be heard lower the louder it is. From v32 the longer is the louder (bars 25 to 32, the second row of 'turned around'): a pip 1/3 of a beat after every beat, always B5 at the same height; only its length changes, beat by beat: 5, 10, 20, 40, 80, 40, 20, 10 ms: every doubling is twice the sound at the same height, and under about a fifth of a second the ear adds it up. From v33 far in pitch is far in time (bars 145 to 151): three pips a bar, a beat apart, each midway between two strokes of the drum: A4, then B4 or G5 (bar by bar in turn), then A5. The middle pip is in the middle in time; the ear is said to hear it nearer in time to the pip it is nearer in pitch. In bars 149 and 150 it is truly moved that way, by 30 ms, to be compared. From v34 the same spacing is another note (bars 89 to 96): a pip of three plain tones 196 Hz apart, a third of a beat after every beat; beat by beat all three are moved up together an eighth of that distance, and begin again after eight. The distance never changes; the note the ear makes of them is said to rise a third of a semitone a step and to fall back at the fifth. In bars 95 and 96 the tune it is said to be is played plainly, an octave up, to be compared. From v35 the gap goes to the other one (bars 137 to 143): a long plain tone glides slowly up and a short one quickly down across it; in bars 137 and 141 the long one is broken for 90 ms where they cross and the short one is whole, and it is said to be heard the other way round; in bars 139 and 143 it is made the way it is said to sound. From v36 after the fall, a note that does not move (bars 121, 123, 125): the moment the bass that falls for ever stops, one plain note (E4) is held for 3 beats and does not move; after a long fall a steady note is said to seem to rise; the same note is held again 4 and 8 bars on. From v37 the wider, the louder (bars 59 to 64): two pips that read the same on a meter, one a single plain tone and one of 4 tones spread over an octave and a half; then the spread one is really turned down, 3 and 6 dB. From v38 the odd one out seems longer (bars 185 to 192): a plain note on every beat, every one held the same 300 ms; every seventh is another note, and is said to seem longer than its fellows. Generated by compose/chirpers11/src/chirpers11-t5.py."
