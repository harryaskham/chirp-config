      - {name: bass, patch: m8-bass, gain: 5dB, score: "R/3b B0/0.5b@40 B0/0.5b@40 B0/1.5b@112 B1/1b@112 B0/0.5b@112 B0/1b@112 B0/0.5b B1/1b B0/0.5b B1/0.5b C2/0.5b B0/0.5b B0/0.5b B0/1.5b B1/1b B0/0.5b B0/1b B0/0.5b B1/1b B0/0.5b B1/0.5b C2/0.5b A1/1b B0/1.5b B1/1b B0/0.5b B0/1b B0/0.5b B1/1b B0/0.5b B1/0.5b C2/0.5b B0/0.5b B0/0.5b F#1/1.5b D1/1.5b F1/1b F1/0.5b C1/1.5b R/1b B0/0.5b B0/0.5b B0/1.5b B1/1b B0/0.5b B0/1b B0/0.5b B1/1b B0/0.5b B1/0.5b C2/0.5b B0/0.5b B0/0.5b B0/1.5b B1/1b B0/0.5b B0/1b B0/0.5b B1/1b B0/0.5b B1/0.5b C2/0.5b A1/1b B0/1.5b B1/1b B0/0.5b B0/1b B0/0.5b B1/1b B0/0.5b B1/0.5b C2/0.5b B0/0.5b B0/0.5b F#1/1.5b D1/1.5b F1/1b F1/0.5b C1/1.5b C1/0.5b A1/0.5b C1/1b R/4b"}
      - {name: kit, patch: "metal-kit play.humanize.time=4ms play.humanize.vel=0.08", sends: {hall: -20dB}, score: "R/4b c,k/1b@124 oh/0.5b@124 k/0.5b@124 oh,s/1b@127 k,oh/1b@124 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 k/0.5b@100 k,oh/0.5b@100 k/0.5b@100 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh,s/1b@112 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 k/0.5b@100 k,oh/1b@100 c,k/1b@100 oh/0.5b@100 k/0.5b@100 oh,s/1b@112 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 k/0.5b@100 k,oh/0.5b@100 k/0.5b@100 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh,s/1b@112 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 s/0.5b@112 k,oh/0.5b@100 k/0.5b@100 c,k/1b@100 oh/0.5b@100 k/0.5b@100 oh,s/1b@112 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 k/0.5b@100 k,oh/0.5b@100 k/0.5b@100 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh,s/1b@112 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 k/0.5b@100 k,oh/1b@100 c,k/1b@100 oh/0.5b@100 k/0.5b@100 oh,s/1b@112 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 k/0.5b@100 k,oh/0.5b@100 k/0.5b@100 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh,s/1b@112 k,oh/1b@100 oh/0.5b@100 k/0.5b@100 oh/0.5b@100 k/0.5b@100 oh,s/0.5b@112 s/0.5b@112 k,oh/0.5b@100 k/0.5b@100 R/4b"}
