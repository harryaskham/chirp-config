chirp: 1
about: >-
  Benchmark reproduction of "When The Shadows First Lengthened" (DOOM: The Dark Ages main menu,
  Finishing Move): B pedal, 128 BPM, Archetype-style Nolly (bulk high gain) + compressed low-mid
  Gojira layer, bass tagelharpa doubling the riff, high tagelharpa on top, orchestra and choir.
  Written by ear from numeric analysis (tools/likeness.py); never samples the reference.
tempo: 128
meter: 4/4
seed: 7
tail: 3s

songs:
  # bars 0-1: the opening hit
  boom:
    tempo: inherit
    buses:
      hall: {fx: ["reverb kind=hall decay=3.2s mix=1 predelay=25ms"]}
    tracks:
      - {name: kit, patch: "metal-kit play.humanize.time=4ms play.humanize.vel=0.08", sends: {hall: -20dB}, score: "k,cch/1@124 R/2.663b"}
      - {name: sub, patch: sub, score: "B0/6.663b@120", gain: -2dB}
      - {name: cluster, patch: horn-section, score: "C2,C#2,G2/1@112 R/2.663b", gain: -4dB}

  # bars 2-15: bowed drone, strings brightening in the second half
  intro:
    tempo: inherit
    buses:
      hall: {fx: ["reverb kind=hall decay=3.2s mix=1 predelay=25ms"]}
    tracks:
      - {name: drone, patch: tagelharpa-bass, score: "[B1,B2/1]x14", gain: -19dB, sends: {hall: -4dB}}
      - {name: sub, patch: sub, score: "[B0/1@80]x14", gain: -12dB}
      - {name: strings, patch: mellotron-strings, sends: {hall: -6dB}, score: "R/1 R/1 [B3,F#4/1 C4,F#4/1 B3,F#4/1 A3,E4/1]x3", gain: -14dB}
      - {name: impact, patch: fx-impact, sends: {hall: -6dB}, score: "R/12.27b C2/4b@96 R/39.23b C2/0.5b@127"}
      - {name: swell, patch: fx-revcym, sends: {hall: -8dB}, score: "R/22.8b C4/2b@90 R/31.2b"}
      - {name: tom, patch: prog-tom, sends: {hall: -6dB}, score: "R/27.8b G2/1b@112 R/27.2b"}

  # bars 16-33: main riff — 16th chugs on low B, open accents on the 3+3+2 grid
