about: "Chirpers - Ferrous Bloom, track 6 'The machine' (original composition, chirper-zero; generator compose/chirpers1/src/chirpers1-t6.py). 128 bpm 4/4 in F. GEARTRAIN, a 13-sixteenth chug riff, realigns every 13 bars, so each section is a 13-bar realignment; the machine assembles out of t5's 13-count clock (gears: a second guitar, LATTICE's 7-cell as a high ping, the GOVERNOR lead in 13 eighths), stalls, overdrives on 23 sixteenths (GEARTRAIN + two of t5's breath cells) and seizes on LATTICE's cluster F1 B1 E2, held into t7."
