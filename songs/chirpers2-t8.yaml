about: "Chirpers - Odd Hours, track 8. Original composition by chirper-two, generated by compose/chirpers2/src/chirpers2-t8.py. Mallet chamber in phase: two marimbas phase one 12-eighth cell through all twelve offsets and back to unison; vibes sing palindromic phrases; a bowed bass walks 4/4 against the 12/8; a physical frame drum. 112 bpm. Sections: cell from 0b (4 bars); phase from 24b (12 bars); melody from 96b (16 bars); solo from 192b (8 bars); trades from 240b (8 bars); bridge from 288b (16 bars); blur from 384b (4 bars); duet from 408b (4 bars); peak from 432b (16 bars); unison from 528b (8 bars); chorale from 576b (4 bars); coda from 600b (6 bars)."
