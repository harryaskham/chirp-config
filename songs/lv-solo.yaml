about: Live suite 4/5 — solo at 128 over half-time chugs; a generative guitar lead doubled an octave up by the synth lead.
tempo: 128
length: 16b
vars: {dark: 0, wet: 0.35}
buses:
  room: {fx: ["reverb mix=1 size=0.65 damp=0.5"], gain: {value: -18dB, mod: [{src: var.wet, amount: 18}]}}
  gtr: {fx: [{type: filter, kind: lp, cutoff: {value: 16k, mod: [{src: var.dark, amount: -4.5}]}, q: 0.8}]}
tracks:
  - name: drums
    patch: haake
    sends: {room: -10dB}
    score: "[ k,c/16@124 k@90 s@110 k@92 k,c@120 k@88 s@112 k@94 ]x7 k,c/16@124 t1@100 t2@104 ft,k@118"
  - name: gtr-l
    patch: m8-mark
    pan: L90
    out: gtr
    seed: 5
    sends: {room: -14dB}
    score: &solo "[ expr.pm=1 F1/8@118 F@74 F@100 . expr.pm=0 (F1,C2,F2|Gb1,Db2,Gb2)/4@122^gate=1 expr.pm=1 F1/8@110 (F@80|.) ]x4"
  - name: gtr-r
    patch: "m8-mark layers.0.pick=0.14 humanize.time=5ms"
    pan: R90
    out: gtr
    seed: 5
    sends: {room: -14dB}
    score: *solo
  - name: bass
    patch: m8-bass-dist
    seed: 5
    score: &solob "[ F1/8@118 F@74 F@100 . (F1|Gb1)/4@122 F1/8@110 (F@80|.) ]x4"
  - {name: sub, patch: sub, seed: 5, score: *solob}
  - name: lead
    patch: m8-lead
    pan: -0.1
    gain: -3dB
    seed: 9
    sends: {room: -6dB}
    score: &lick >
      [ (F4|Ab4|Bb4)/16@100 (C5|Db5)@104 (Eb5|C5)@108 (F5|Eb5)@112 (Gb5|F5)/8@114 (Eb5|Db5)/16@106 (C5|Bb4)@102
        (Ab4|C5)/4@110^gate=1.1 R/8 (F5|Ab5)/8@116 ]x4
  - name: synth
    patch: synth-lead
    pan: 0.2
    seed: 9
    transpose: 12
    gain: -7dB
    sends: {room: -8dB}
    score: *lick
  - name: fx
    sends: {room: -10dB}
    score: "patch=fx-impact F1/4@112 R/4 R/2 R/1 R/1 patch=fx-riser C4/1@96"
  - name: fx-rev
    patch: fx-revcym
    score: "R/1 R/1 R/1 R/2 C5/2@96"
