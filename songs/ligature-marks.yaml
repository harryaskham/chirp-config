about: "Hill-climb reproduction of Meshuggah — Ligature Marks (Immutable, 2022), from Songsterr tab 505657 (lead, lead harmony, Fredrik and Mårten rhythm, bass, drums), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/ligature-marks.json. v3: bass +2 dB. v4: an octave-up copy of the bass part (bass8: the tab part transposed +12, bass-fat, -8 dB) - the 5-string bass on F0/Bb0 reads its 3rd harmonic in chroma (The Faultless v6 +2.3). v6 (chirper-zero): a ride + width refresh, then the last 6 s ridden to the record (its band stops dead at 308.0 s, then a -61..-72 dB floor to 313 s; ours rang down over 4 s). v7 (chirper-one): faint independent L/R copies of the bass (bassL/bassR: pan -1/+1, +7/+19 ms, bass gain -32 dB) for the record's wider 20-60 Hz (stereoscan +5.3 dB short). v8: the rhythm guitars' chords voiced as the record plays them (F1,Bb1 -> F1,F2; F1,B1 -> F1,F2; B1,F2,Bb2 -> B1,B2). v10 (chirper-zero): the riff toms retuned (song-local lm-kit: t3 A#2, t2 C3 on prog-tom; metal-kit's A2/D3 read A#/D#, which swamped the mix's chroma), then level/ride and a --joint width pass on seeds 0 and 11. v11: the ending - the band's tail cut 20 dB over 307.9-308.2 s (a master lane auto.cut; the record stops dead, ours rang -33/-46/-57 dB through 308-309 s) and the record's room/noise floor after it (floor-l/floor-r: song-local lm-floor, L/R independent noise 45-170 Hz, -65 dB like the record's). v12: the rhythm pair a +4 dB low shelf under 200 Hz (map extra fx) and a gain lane each following its record channel's short-term level (auto.envl, depth 1), then ride/eq and a --joint width pass on seeds 0 and 11."
