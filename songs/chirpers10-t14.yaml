about: "chirpers X (Common Time), track 14 by chirper-three: Slow Enough to Count. A chord is a rhythm too fast to count. At this tempo a pulse every three sixteenths is an F six octaves down, common time is a C and the fives are an A flat, so threes against fours against fives are F minor. Three toms tuned to the chord are rolled at their own notes, slowed six octaves until they can be counted, handed to the band a pulse at a time, and wound back up into the chord at the end. The band is tuned to the pulses' own notes, and a lead plays a tune in which every note lasts as long as its period. From 2:11.0 the count is 16/15 as fast, so by the song's own rule every note is too: the D flat struck every fifteen becomes the bar, and the song ends a just semitone above the chord it began on."
