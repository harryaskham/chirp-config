about: "Radiohead - Knives Out (Amnesiac, 2001, track 6). v1 from the stems: the two hard-panned guitars transcribed channel by channel (monotrans on the guitar stem's L and R, which are uncorrelated) on the jazz-box archtop (its fundamental-led tone matches the stem's chroma; a strat's 2.5 kHz partials smeared it), finger bass low-passed at 450 Hz (the stem is dark: ours was +23..+37 dB above 450 Hz), a grid-programmed rock kit (111.58 bpm), Thom's lead on the soft tenor voice with per-note vowels measured from the vocal stem's formants; the ending's E2 ring-out on a sub following the record's decay, a low-passed last bass note and a faint noise floor; master: section levels, width x3, two section EQs, two contour rides. v3: every programmed kit hit snapped to the drum stem's strongest band-matched onset within 120 ms (tools/onsetsnap.py, chirper-one's method). v4: the vocal sings the words - CMUdict phonemes per syllable from the Songsterr tab's lyric syllables (tab 17312), the tab's vocal line time-mapped to the vocal stem (137.27 bpm, +0.149 s), each syllable on the first of our stem notes it covers. v5: a low room rumble bed (mono noise, 22-50 Hz) following the record's 30-40 Hz level section by section."
buses: {"room": {"fx": [{"decay": "1.2s", "kind": "room", "mix": 1, "mono_below": 200, "predelay": "15ms", "type": "reverb"}]}}
