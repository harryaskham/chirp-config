about: "Radiohead - Knives Out (Amnesiac, 2001, track 6). v1 from the stems: the two hard-panned guitars transcribed channel by channel (monotrans on the guitar stem's L and R, which are uncorrelated) on the jazz-box archtop (its fundamental-led tone matches the stem's chroma; a strat's 2.5 kHz partials smeared it), finger bass, a grid-programmed rock kit (111.58 bpm), Thom's lead on the soft tenor voice with per-note vowels measured from the vocal stem's formants; the ending's E2 ring-out on a sub following the record's decay, a low-passed last bass note and a faint noise floor; master: section levels, width x3, two section EQs, two contour rides."
