about: "Radiohead - You and Whose Army? (Amnesiac, 2001, track 4). v1 from the stems: the two guitars (the stem's L and R are separate parts) on the jazz-box archtop, low-passed twice at 650 Hz (the stem falls ~30 dB by 1 kHz); Thom's lead on the soft tenor voice (the 118-170 s climax as two voices: the stem's G#/B thirds made the monophonic tracker sing their implied E root), low-passed at 3.5 kHz (the record's vocal has no air), per-note vowels from the stem, with his opening inhale as band-passed noise; a low organ drone under the opening, finger bass from 66 s, the piano chords, and a rock kit programmed from the drum stem in 95-171 s; a faint room rumble under the end; master: section levels x2, width x3, two section EQs, two contour rides. v4: the programmed kit's hits snapped to the drum stem's band-matched onsets within 80 ms (tools/onsetsnap.py). v5: the lead sings the words (CMUdict syllables from Songsterr tab 16842's lyrics, its vocal timeline fitted to the vocal stem; the stem's own vowels kept). v6: master band widths refitted in five low-stereo sections (intro, 32-39 s, 63-96.5 s)."
