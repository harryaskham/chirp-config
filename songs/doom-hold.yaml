about: Long-note doom section — 8 bars at 60 BPM, distorted chords held two bars each, half-time drums, long lead bends, sub.
tempo: 60
length: 32b
vars: {dark: 0, wet: 0.35}
buses:
  room: {fx: ["reverb kind=hall decay=3.5s mix=1 predelay=25ms"], gain: {value: -14dB, mod: [{src: var.wet, amount: 14}]}}
  gtr: {fx: [{type: filter, kind: lp, cutoff: {value: 16k, mod: [{src: var.dark, amount: -4.5}]}, q: 0.8}]}
tracks:
  - name: drums
    patch: prog-kit
    fx: ["ott depth=0.3 time=0.5", "gain gain=-4dB"]
    sends: {room: -8dB}
    score: "[ k,c/4@122 R/4 s,x/4@120 (ft/8@100|k/8@96) (ft/8@96|.) ]x7 k,c/4@124 t1/8@104 t2@106 t3/8@108 ft@112 ft2/4@118"
  - name: gtr-l
    patch: m8-gojira
    pan: L90
    out: gtr
    seed: 51
    sends: {room: -10dB}
    score: &g "expr.pm=0 F1,C2,F2/1@124^gate=1 _ (Gb1,Db2,Gb2|E1,B1,E2)/1@122^gate=1 _ (Ab1,Eb2,Ab2|Db2,Ab2,Db3)/1@122^gate=1 _ B1,F2,B2/1@124^gate=1 F1,C2,F2/2@124^gate=1 F2/2@116^ph^gate=1.5"
  - {name: gtr-r, patch: "m8-gojira fx.1.file=jester/darth-genocider layers.0.pick=0.14", pan: R90, out: gtr, seed: 51, sends: {room: -10dB}, score: *g}
  - name: bass
    patch: m8-bass-dist
    seed: 51
    score: &b "F1/1@122 _ (Gb1|E1)/1@120 _ (Ab1|Db2)/1@120 _ B1/1@122 F1/2@122 F1/2@116"
  - {name: sub, patch: sub, seed: 51, score: *b}
  - name: lead
    patch: lead-monster
    pan: 0.15
    gain: -3dB
    sends: {room: -4dB}
    score: "R/1 C5/1@104 bend=1 _ bend= R/1 (Db5|Eb5)/1@106 _ bend=-1 _ bend= R/1 F5/1@110 bend=2 _ bend="
