about: "Metallica - Sad but True (S&M, 1999, live with the San Francisco Symphony; reference ref/albums/s-m from Harry's Drive, ~128-160 kbps MP3), from Songsterr tab 317 (human, the Black Album arrangement in D: lead + backing vocals, Kirk's lead, James' rhythm, three extra guitars, the low-tuned Danelectro, bass, drums, shaker). Generated by tools/tab2song.py from tools/maps/sad-but-true.json. Offset 6.51 s (crowd before the intro) and per-8-bar tempos 85-97 BPM from a DTW read of the map's bar starts. After tab2song: drums+shaker snapped to the drum stem within 320 ms (rhythm 8 -> 45); levels from the stems (vocals -2.2, bass -1.9, drums +3, guitars +5.4 dB); master +3 dB; the orchestra from the other stem (tools/padtrans.py, 469 notes on strings -8 dB). Round 3: the audience as a full-length wide crowd bed (patches/sm-crowd, crowd-l/crowd-r pan -1/+1 11 ms apart, head/tail vel .8; chirper-zero's recipe) at -22 dB under v2's fitted master. v5: the lead vocal is tools/voxtrans.py's line from the crowd-free vocal stem (365 notes; chirper-zero's recipe) in place of the tab's. v9: the tab ends at 323 s but the S&M band plays a D5 ending to 344 s (guitar stem D/A at -25..-35 dB, bass to ~336 s, drums fading): a held D5 restruck each bar (2.82 s) with decaying velocity on two rhythm-guitar tracks (pan -/+0.6) and D1 on the bass to 336 s, 16 dB under the rhythm/bass. v12: the second half of Kirk's live solo (195.4-217.2 s) from the crowd-free guitar stem (tools/voxtrans.py, 150-1500 Hz) on a sololine track with the lead's patch/gain/pan; the tab's lead muted there by a lane. Bed trim (Harry, 26 Oct: the S&M audience noise was too heavy-handed): crowd-l/crowd-r -16 dB, to sit 30+ dB under the music over the body (tools/bedlevel.py); the applause edges unchanged."
