ecay": "6ms", "bright": 0.9, "strike": 0.8}, {"type": "noise", "color": "white", "level": {"value": "-70dB", "mod": [{"src": "env.burst", "amount": 52}]}}], "env": {"burst": {"a": "0.1ms", "d": "2ms", "s": 0, "r": "2ms"}}, "amp": {"a": "0.1ms", "d": "0s", "s": 1, "r": "20ms"}}, "play": {"event_stable": true, "vel_sens": 0.6}}, "rt-seeds": {"about": "Ring True: the gourd (v28), the eleventh thing, the only one that is shaken: dry seeds in a shell. They do not arrive together (a front of 3 ms), rattle on the wall for 30 ms, and a few run on round it for as long as the note is held, 14 dB under. Nothing in it has a note: noise from 4.5 to 11 kHz, most of it near 6.8 kHz.", "synth": {"layers": [{"type": "noise", "color": "white"}], "filters": ["hp cutoff=4500", "lp cutoff=11000", "peak cutoff=6800 q=1.2 gain=6dB"], "amp": {"a": "3ms", "d": "30ms", "s": 0.2, "r": "25ms", "curve": 2}}, "play": {"event_stable": true, "vel_sens": 0.6, "gate": 1}}, "rt-tine": {"about": "Ring True: the comb (v26; these words v27), the tenth thing, the only one that is plucked: a steel tongue clamped at one end, bent and let go: a plain tone that rings half a second, the clamped bar's second mode (6.27 times the note) as a tick on its front (20 dB down in 60 ms), and the nail's click. It cannot be stopped: it is not played until it is let go.", "synth": {"layers": [{"type": "osc", "wave": "sine"}, {"type": "osc", "wave": "sine", "ratio": 6.27, "level": {"value": "-80dB", "mod": [{"src": "env.ting", "amount": 68}]}}, {"type": "noise", "color": "white", "level": {"value": "-80dB", "mod": [{"src": "env.nail", "amount": 62}]}}], "env": {"ting": {"a": "0.1ms", "d": "200ms", "s": 0, "r": "30ms"}, "nail": {"a": "0.1ms", "d": "1.5ms", "s": 0, "r": "1.5ms"}}, "amp": {"a": "0.5ms", "d": "450ms", "s": 0, "r": "90ms"}}, "play": {"event_stable": true, "vel_sens": 0.5}}}
