about: Live suite 1/5 — doom intro at 70 BPM, long ringing chords, supersaw swell, sub drops, a slow bending lead.
tempo: 70
length: 16b
vars: {dark: 0, wet: 0.35}
buses:
  room: {fx: ["reverb mix=1 size=0.9 damp=0.55"], gain: {value: -16dB, mod: [{src: var.wet, amount: 16}]}}
  gtr: {fx: [{type: filter, kind: lp, cutoff: {value: 16k, mod: [{src: var.dark, amount: -4.5}]}, q: 0.8}]}
tracks:
  - name: drums
    patch: haake
    sends: {room: -8dB}
    score: >
      [ k,c/4@120 . s,c/4@118 (t1/8@96|.) (ft/8@104|k/8@90) ]x3
      k,c/4@122 s/8@100 s@90 t1/16@100 t1@92 t2@104 t2@96 ft@110 ft@104 ft,k@118 s,c@124
  - name: gtr-l
    patch: m8-gojira
    pan: L90
    out: gtr
    seed: 2
    sends: {room: -12dB}
    score: &doom >
      expr.pm=0 F1,C2,F2/1@120^gate=1 (Gb1,Db2,Gb2|E1,B1,E2)/2@118^gate=1 (Ab1,Eb2,Ab2|Bb1,F2,Bb2)/2@118^gate=1
      F1,C2,F2/1@124^gate=1 B1,F2/2.@120^gate=1 F2/4@116^ph^gate=1.6
  - name: gtr-r
    patch: "m8-gojira fx.1.file=jester/darth-genocider layers.0.pick=0.14 humanize.time=6ms"
    pan: R90
    out: gtr
    seed: 2
    sends: {room: -12dB}
    score: *doom
  - name: bass
    patch: m8-bass-dist
    seed: 2
    score: &doomb "F1/1@118 (Gb1|E1)/2@116 (Ab1|Bb1)/2@116 F1/1@122 B1/2.@118 F1/4@114"
  - name: sub
    patch: sub
    seed: 2
    score: *doomb
  - name: pad
    patch: saw-pad
    seed: 2
    gain: -4dB
    sends: {room: -6dB}
    score: "F3,Ab3,C4/1@90 (Gb3,Bb3,Db4|E3,Ab3,B3)/2@90 (Ab3,C4,Eb4|Bb3,Db4,F4)/2@90 F3,Ab3,C4/1@96 B2,Eb3,Gb3/2.@92 F3,C4/4@88"
  - name: lead
    patch: m8-lead
    pan: 0.15
    gain: -3dB
    sends: {room: -4dB}
    score: "R/2 C5/4@100 _ bend=1 _ bend= Ab4/4@98 (Gb4|F4)/2@102 R/4 Db5/4@104 C5/8@100 Bb4/8@98 C5/4@106 _ bend=2 _ _ bend= R/4"
  - name: fx
    sends: {room: -10dB}
    score: "patch=fx-impact F1/4@112 R/4 R/2 R/1 R/1 patch=fx-riser C4/1@96"
  - name: fx-rev
    patch: fx-revcym
    score: "R/1 R/1 R/1 R/2 C5/2@96"
