about: "Hill-climb reproduction of Meshuggah — Combustion (obZen, 2008), from Songsterr tab 43188 (Metallord's human transcription: Thordendal + Hagström rhythm on the 8-string, solo, bass, drums; 225 bars at 220 BPM), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/combustion.json. v2 (chirper-zero): the obZen recipe — root+octave on every rhythm-guitar note F1..E2 (Combustion's guitar parts are all single notes; map subst), a bass24 copy (+24, -10 dB re bass), the vox rested in the 106 bars where the vocals stem sits under -18 dB re the mix (stemvox had transcribed bleed through bars 1-44 and 164-192), a formant EQ fitted to the stems' 1/6-octave LTAS over the sung bars (the shout peaks at 800-1000 Hz where kidman's sat 9-11 dB short: lowshelf 170 -10, 600 -6, 900 +10, 2400 -5, highshelf 4k -7 dB) with the level matched on the sung bars and then -2 dB; a song-local cb-kit with the kick at D2 (scan C2 64.72/64.78, C#2 64.86/65.01, D2 65.04/64.85, D#2 64.41/64.14, E2 64.09/64.50 against A1's 63.84/63.89); a two-pass ride refit, the ending matched per 0.2 s from 244.5 s (auto.end) and one --joint width pass on seeds 0 and 11. Tried and dropped: filling the tab's rests in bars 93-109 (the record's guitar-only break is bars 93/94-99 with both guitar channels equal, and the bass returns at bar 101 where the tab rests it) with a right-hand double of gtr-l and bass copies of its riff: -0.26 before and -0.19 after a fair ride refit. v3 (chirper-zero): the lead (track 1, Thordendal's solo, bars 149-185) without the tab's bend= marks (map strip ['bend'] on lead): its bend=2 tremolo dyads (G5,A5 / A5,B5 / B5 / C6 / D6) played bent read E/C#/D/A/B where the record's guitar stem reads D#/D; unbent +0.63 (sections 154 s +2.9, 173 s +5.6); lead -3 / +3 / -6 / -12 dB all lost. Then two ride passes and one --joint width pass on seeds 0 and 11. Tried and dropped: a right-hand double of gtr-l's intro riff in bars 1-8 (the record's intro guitar is level L/R, ours hard left: stereo +5.6 but spectral/ltas/loudness lost, -0.02; at -6 dB +0.01); a low F1 ring-out (bass-fat, lane-shaped to the record's sub-120 decay) for the last 3 s: -0.17 (the master's auto.end lane lifts the tail by up to +20 dB, so a ring there needs the end lane refitted with it). v4 (chirper-zero): ceiling -0.1dB (none before: the engine's limiter held peaks at -1.0 dBFS, ours RMS -12.3 against the record's -10.1; +0.71/+0.79 on seeds 0/11, every section) and two ride passes on it (+0.20); then the solo's bent notes at the pitches the record lands on — partchroma on the lead (200 Hz-2 kHz) against the guitar stem read the unbent B5 as the record's C (bars 166-167, 179-180), C6 as D (181-182) and D6 as D# (183-186): the tab's bend=2 marks are a half step on B and D and a whole step on C, so they are written as the target notes (map subst on lead, bends still stripped): +0.64/+0.63, section 191 s +8.6, 173 s +1.9; the lead's partchroma cos0 0.70 -> 0.88 with no bar flagged. Tried and dropped: the intro riff doubled on the right at -6 dB with a fair ride refit (tied: -0.001..-0.02 on all four seeds), a --joint width pass after the ride (tied). v5 (chirper-zero): the exposed guitar on m8-obzen. In the guitar-only passages (bars 6-8 of the intro, the breaks 93-99 and 186-191, drums/bass/vox out) the record's guitar reads +10..+15 dB at 76-95 Hz and 5-15 dB less at 300 Hz-2.4 kHz than m8-emg's (1/3-oct, level-normalised); there the riff plays on m8-obzen-l (Bleed's rig: tight 80 Hz, +7 dB under 120 Hz) as gtr-lx, gtr-l muted by a track lane (auto.mx) - gtr-lx is the LAST track and gtr-l keeps its notes so the per-note random stream of every other track is unchanged (moving the bars between tracks shifted untouched sections by up to 1.7). Sections 6 s +2.4, 98 s +1.2, 107 s +1.1, 191 s +1.6 (seeds 0/11). Tried and dropped: a left/right m8-obzen pair at -3 dB each (the record's break guitar is L/R uncorrelated at equal level, but our pair went anti-correlated through the master width lanes: stereo -13..-18; a 23/41 ms delay on the right copy didn't decorrelate it), the swap in bars 1-5 too (intro 0-6 s -2.5). v6 (chirper-zero): the intro's first five bars as an L/R pair - the record's intro guitar is two uncorrelated takes at equal level (side/mid +0.4 dB, L/R corr -0.04), ours was gtr-l alone, hard left: gtr-ri (gtr-l's riff on m8-emg-r, pan +1, bars 1-5) appended as the last track (RNG-safe: only sections 0 and 6 moved), then a --joint width pass and a ride pass on seeds 0 and 11. Against the same refit without the pair (70.680/70.752/70.385/70.517) the pair adds +0.06/+0.01/+0.04/+0.01; the refit itself also re-fits the width lanes over v5's m8-obzen passages (98 s +1.4, 191 s +1.0, 206 s +1.2). An m8-obzen-r double in bars 6-8 too lost there (-2.6 vs -1.7 before the refit)."
