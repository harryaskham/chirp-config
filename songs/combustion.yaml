about: "Hill-climb reproduction of Meshuggah — Combustion (obZen, 2008), from Songsterr tab 43188 (Metallord's human transcription: Thordendal + Hagström rhythm on the 8-string, solo, bass, drums; 225 bars at 220 BPM), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/combustion.json. v2 (chirper-zero): the obZen recipe — root+octave on every rhythm-guitar note F1..E2 (Combustion's guitar parts are all single notes; map subst), a bass24 copy (+24, -10 dB re bass), the vox rested in the 106 bars where the vocals stem sits under -18 dB re the mix (stemvox had transcribed bleed through bars 1-44 and 164-192), a formant EQ fitted to the stems' 1/6-octave LTAS over the sung bars (the shout peaks at 800-1000 Hz where kidman's sat 9-11 dB short: lowshelf 170 -10, 600 -6, 900 +10, 2400 -5, highshelf 4k -7 dB) with the level matched on the sung bars and then -2 dB; a song-local cb-kit with the kick at D2 (scan C2 64.72/64.78, C#2 64.86/65.01, D2 65.04/64.85, D#2 64.41/64.14, E2 64.09/64.50 against A1's 63.84/63.89); a two-pass ride refit, the ending matched per 0.2 s from 244.5 s (auto.end) and one --joint width pass on seeds 0 and 11. Tried and dropped: filling the tab's rests in bars 93-109 (the record's guitar-only break is bars 93/94-99 with both guitar channels equal, and the bass returns at bar 101 where the tab rests it) with a right-hand double of gtr-l and bass copies of its riff: -0.26 before and -0.19 after a fair ride refit. v3 (chirper-zero): the lead (track 1, Thordendal's solo, bars 149-185) without the tab's bend= marks (map strip ['bend'] on lead): its bend=2 tremolo dyads (G5,A5 / A5,B5 / B5 / C6 / D6) played bent read E/C#/D/A/B where the record's guitar stem reads D#/D; unbent +0.63 (sections 154 s +2.9, 173 s +5.6); lead -3 / +3 / -6 / -12 dB all lost. Then two ride passes and one --joint width pass on seeds 0 and 11. Tried and dropped: a right-hand double of gtr-l's intro riff in bars 1-8 (the record's intro guitar is level L/R, ours hard left: stereo +5.6 but spectral/ltas/loudness lost, -0.02; at -6 dB +0.01); a low F1 ring-out (bass-fat, lane-shaped to the record's sub-120 decay) for the last 3 s: -0.17 (the master's auto.end lane lifts the tail by up to +20 dB, so a ring there needs the end lane refitted with it). v4 (chirper-zero): ceiling -0.1dB (none before: the engine's limiter held peaks at -1.0 dBFS, ours RMS -12.3 against the record's -10.1; +0.71/+0.79 on seeds 0/11, every section) and two ride passes on it (+0.20); then the solo's bent notes at the pitches the record lands on — partchroma on the lead (200 Hz-2 kHz) against the guitar stem read the unbent B5 as the record's C (bars 166-167, 179-180), C6 as D (181-182) and D6 as D# (183-186): the tab's bend=2 marks are a half step on B and D and a whole step on C, so they are written as the target notes (map subst on lead, bends still stripped): +0.64/+0.63, section 191 s +8.6, 173 s +1.9; the lead's partchroma cos0 0.70 -> 0.88 with no bar flagged. Tried and dropped: the intro riff doubled on the right at -6 dB with a fair ride refit (tied: -0.001..-0.02 on all four seeds), a --joint width pass after the ride (tied)."
