about: "Hill-climb reproduction of Meshuggah — Combustion (obZen, 2008), from Songsterr tab 43188 (Metallord's human transcription: Thordendal + Hagström rhythm on the 8-string, solo, bass, drums; 225 bars at 220 BPM), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/combustion.json. v2 (chirper-zero): the obZen recipe — root+octave on every rhythm-guitar note F1..E2 (Combustion's guitar parts are all single notes; map subst), a bass24 copy (+24, -10 dB re bass), the vox rested in the 106 bars where the vocals stem sits under -18 dB re the mix (stemvox had transcribed bleed through bars 1-44 and 164-192), a formant EQ fitted to the stems' 1/6-octave LTAS over the sung bars (the shout peaks at 800-1000 Hz where kidman's sat 9-11 dB short: lowshelf 170 -10, 600 -6, 900 +10, 2400 -5, highshelf 4k -7 dB) with the level matched on the sung bars and then -2 dB; a song-local cb-kit with the kick at D2 (scan C2 64.72/64.78, C#2 64.86/65.01, D2 65.04/64.85, D#2 64.41/64.14, E2 64.09/64.50 against A1's 63.84/63.89); a two-pass ride refit, the ending matched per 0.2 s from 244.5 s (auto.end) and one --joint width pass on seeds 0 and 11. Tried and dropped: filling the tab's rests in bars 93-109 (the record's guitar-only break is bars 93/94-99 with both guitar channels equal, and the bass returns at bar 101 where the tab rests it) with a right-hand double of gtr-l and bass copies of its riff: -0.26 before and -0.19 after a fair ride refit."
tempo: 220
length: "248.65s"
