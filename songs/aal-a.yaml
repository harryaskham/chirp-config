about: AAL-style A — Tosin-style thump/pop with hammer-ons on clean 8-string, prog kit ghost groove with hat ratchets, bass, ambient swells.
tempo: 132
length: 16b
vars: {dark: 0, wet: 0.35}
buses:
  room: {fx: ["reverb mix=1 size=0.6 damp=0.5"], gain: {value: -18dB, mod: [{src: var.wet, amount: 18}]}}
tracks:
