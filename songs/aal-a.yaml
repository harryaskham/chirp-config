  - name: swells
    patch: ambient-swell
    pan: 0.35
    sends: {room: -8dB}
    score: "F#3,C#4,E4/1@80^gate=1.4 F#3,C#4,E4/1@78^gate=1.4 D3,A3,E4/1@80^gate=1.4 E3,B3,D4/1@84^gate=1.4"
  - name: fx
    sends: {room: -10dB}
    score: "patch=fx-impact F1/4@112 R/4 R/2 R/1 R/1 patch=fx-riser C4/1@96"
  - name: fx-rev
    patch: fx-revcym
    score: "R/1 R/1 R/1 R/2 C5/2@96"
