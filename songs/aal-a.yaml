    patch: prog-kit
    sends: {room: -14dB}
    score: >
      [ k/16@116 . g@34 k@96 s@114 . g@36 . k@108 g@32 k@100 . s@118 g@38 (g@34^r=2|.) (k@96|.) ]x3
      k/16@118 . g@34 . s@116 . t1@100 t1@92 t2@104 t2@96 t3@108 t3@98 ft@112 ft@102 ft2@116 s@120^flam
  - name: hats
    patch: prog-kit
    score: "[ h/16@90 h@60 (h@78|h@70^r=2) h@58 h@88 h@60 h@76 hp@56 h@90 h@60 (h@80^r=3|h@74) h@58 h@88 h@60 (oh@84|h@76) hp@54 ]x3 R/1"
  - name: thump
    patch: clean-chorus
    pan: -0.2
    sends: {room: -14dB}
    score: >
      [ F#1/16@110^thump F#2@96^pop F#1@100^thump A1@90^h F#1@108^thump E2@96^pop D2@88^h F#1@104^thump
