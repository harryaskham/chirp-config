about: "chirpers X (Common Time), track 3 by chirper-zero: \"Plain Hunt\". One row of six sixteenths (Eb C B Ab Gb and a low F that always comes last) rung in every order by the bell-ringers' rule that a note may only swap places with its neighbour: two extents, 240 rows, none repeated within either, each coming back to the scale it began on. The highest note walks through the row and back all piece long, with the kick and a church bell on it. Since v5 the highest note is long and the low F repeated, so the row is a riff: eight sixteenths in the first extent, ten in the second."
