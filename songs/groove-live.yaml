about: Generative 2-bar djent groove for live steering — every pass re-rolls ghost notes, chord stabs and fills; vars dark (guitar lowpass) and wet (room).
tempo: 124
length: 8b
vars:
  dark: {value: 0, smooth: 300ms, min: 0, max: 1}
  wet: {value: 0.3, smooth: 300ms, min: 0, max: 1}
buses:
  room: {fx: ["reverb mix=1 size=0.5 damp=0.55"], gain: {value: -18dB, mod: [{src: var.wet, amount: 18}]}}
  gtr:
    fx:
      - {type: filter, kind: lp, cutoff: {value: 16k, mod: [{src: var.dark, amount: -4.5}]}, q: 0.8}
tracks:
  - name: drums
    patch: haake
    sends: {room: -10dB}
    score: >
      [ k,c/16@122 k@74?0.85 (k@96|.) k@70 k,x@108 . (k@80|k@60|.) k@112
        k,x,s@124 k@92?0.7 . k@104 (k,x@96|s@40) k@70?0.6 (k@108|ft@100) (s@34|.) ]x2
  - name: gtr-l
    patch: m8
    pan: L90
    out: gtr
    seed: 1
    sends: {room: -14dB}
    score: &riff >
      [ expr.pm=1 F1/16@118 (F1@66|F1@84) F1@74?0.8 . F1@108 (F1@70|.) (Gb1@100|F1@104) F1@114
        expr.pm=0 (B1,F2|Bb1,E2|C2,G2)/8@116^gate=1.05
        expr.pm=1 F1/16@106 (F1@70|.) F1@92 (F2@110^ph|F1@100) . F1@96?0.7 ]x2
  - name: gtr-r
    patch: "m8 layers.0.pick=0.14 humanize.time=5ms"
    pan: R90
    out: gtr
    seed: 1
    sends: {room: -14dB}
    score: *riff
  - name: bass
    patch: m8-bass
    seed: 1
    score: *riff
