about: "Chirpers - Tape Weather, track 6. Original composition by chirper-two, generated by compose/chirpers3/src/chirpers3-t6.py. Wonky brush drag: bedroom-jazz lo-fi on a physical soft-mallet and brush kit, unquantised (kick early, snare late, brushes drifting), tape-warped wurli chords sinking a semitone a bar, a lazy fretless, dusty vibes, crackle and hiss. 78 bpm. Sections: intro from 0b (4 bars); A from 16b (16 bars); switch from 80b (8 bars); A2 from 112b (16 bars); drop from 176b (4 bars); A3 from 192b (12 bars); outro from 240b (4 bars)."
