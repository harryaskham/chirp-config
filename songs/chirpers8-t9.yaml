about: "chirpers - A Light Left On, track 9. Original composition by chirper-two, generated by compose/chirpers8/src/chirpers8-t9.py. Polytempo braindance in Bohlen-Pierce tuning (13 steps to the 3:1 tritave): the logistic map, iterated each sixteenth, walks from one note through period doubling into chaos, its period-three window and back, on a physical reed. Sections: one 4/4 from 0b (20 bars); two 7/8 from 80b (16 bars); four 4/4 from 136b (20 bars); eight 5/4 from 216b (20 bars); chaos 4/4 from 316b (32 bars); window 4/4 from 444b (18 bars); storm 11/8 from 516b (24 bars); settle 4/4 from 648b (28 bars)."
