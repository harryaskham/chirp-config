about: "Radiohead - Morning Bell/Amnesiac (Amnesiac, 2001, track 7). v1 from the stems: the keyboard chords (guitar stem, an electric piano), the organ as two hard-panned parts (the other stem's L and R are uncorrelated, each transcribed on its own), the piano, the bass from 98 s, Thom's lead on the soft tenor voice with per-note vowels measured from the vocal stem; the keys and organs played only as chords struck at the record's onsets (no sustained beds: the backing's pulse); a faint hiss under the fade; master: section levels, width x3, three section EQs, four contour rides. v3: the keys' and organs' onset strikes 55 ms later (placed on the record's flux-peak frames, their own flux peaked ~40 ms early). v4: the record's 8-16 kHz air over 136-156 s (two independent noises hard left/right, calibrated to the record's band level). v5: the 136-156 s air at +-0.4 (the record's air there is nearly mono-wide, side -2 dB) and the last 3.7 s narrowed. v6: the bass high-passed (2x 70 Hz): the mix read 4-7 dB over the record at 25-50 Hz."
