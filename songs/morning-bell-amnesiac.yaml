about: "Radiohead - Morning Bell/Amnesiac (Amnesiac, 2001, track 7). v1 from the stems: the keyboard chords (guitar stem, an electric piano), the organ as two hard-panned parts (the other stem's L and R are uncorrelated, each transcribed on its own), the piano, the bass from 98 s, Thom's lead on the soft tenor voice with per-note vowels measured from the vocal stem; the keys' and organs' chords re-struck at the record's onsets (the backing's pulse); a faint hiss under the fade; master: section levels, width x3, three section EQs, four contour rides."
