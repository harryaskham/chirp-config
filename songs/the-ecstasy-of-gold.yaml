about: "Metallica / Ennio Morricone - The Ecstasy of Gold (S&M, 1999: the San Francisco Symphony alone, the show's opener; reference from Harry's Drive, ~128-160 kbps MP3). No tab: the whole score transcribed from the record (padtrans chords, monotrans melody), the audience as chirper-zero's wide sm-crowd bed. v1: the orchestra as tools/padtrans.py chords from the record itself (4 voices over 100-2000 Hz on strings, 1055 notes; 2 voices over 40-200 Hz on cellos, 392 notes; 0.5 s windows), dry and centred at -3 dB (hall sends lost: -1.4..-4.4); the crowd bed at -6 dB; master +3 dB. A monotrans melody on violins lost (-1.0). Sections: every 10 s. v3: the orchestra's percussion from the crowd-free drum stem (livestems): onset peaks per band (40-150 Hz -> t3, 150-1000 + 2-5 kHz -> s, 6-12 kHz -> c; flux over 4x its rolling median, 120 ms apart; 796 hits) kept only where the stem plays (59.5-70.5 s and from 79.5 s), on metal-kit at -12 dB with a hall send (~/.cache/c1/stemhits.py)."
