about: "chirpers X (Common Time), track 6 by chirper-zero: Carrying Capacity. No riff was written. There is one rule, x <- r x (1 - x), applied once every half bar, and the number it gives is the half bar: how many of its six places the band strikes, where the accent falls and how high. The form is the dial r turned up from 1.5 to 4 and back down: the riff settles, splits in two, four, eight, stops repeating, locks by itself on five half bars and then on three, fills the whole range, and dies out. Triplets at 138, on E, with a drum machine; the lead has no notes, only the rule (the engine's own logistic generator). v1 is the skeleton."
