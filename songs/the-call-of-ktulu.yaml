about: "Metallica - The Call of Ktulu (S&M, 1999, live with the San Francisco Symphony; instrumental; reference from Harry's Drive, ~128-160 kbps MP3), from Songsterr tab 12258 (human, the S&M arrangement in Eb: Kirk's lead and James' rhythm (clean and distorted), Jason's 5-string bass, the orchestra in two parts, drums). Generated by tools/tab2song.py from tools/maps/the-call-of-ktulu.json. Offset 6.34 s and per-marker-section tempos 117-143 BPM (the closing bars 79) from a DTW read of the map's bar starts (the S&M take runs 6.5 s late mid-song and 16 s early by the end against the tab); the audience as a full-length wide crowd bed (patches/sm-crowd: crowd-l/crowd-r, pan -1/+1, 11 ms apart; chirper-zero's recipe) at -6 dB; master +3 dB. v2: drums snapped to the crowd-free drum stem (tools/livestems.py) within 320 ms. v8 (chirper-zero): James' intro (before 63 s) on a clean guitar doubled wide (m8-clean L/R, 12 ms apart, level-matched) in place of the distorted rhythm patch; the orchestra -8 dB under it until 40 s (the record's sits 5-10 dB below the guitar there); a ride + width refit. Bed trim (Harry, 26 Oct: the S&M audience noise was too heavy-handed): crowd-l/crowd-r -24 dB on chirper-zero's v8, to sit 30+ dB under the music over the body (tools/bedlevel.py)."
