about: "Metallica - Battery (S&M, 1999, live with the San Francisco Symphony; reference from Harry's Drive, ~128-160 kbps MP3), from Songsterr tab 500449 (human, the S&M arrangement in Eb: Kirk's lead, James' rhythm, Jason's 5-string bass, the orchestra in three parts (pizzicato, violins, cellos), drums; no vocal). Generated by tools/tab2song.py from tools/maps/battery.json. Offset 5.7 s (a DTW read of the map's bar starts holds within ~1 s at the tab's own tempos); the take ends at 345 s and ~100 s of applause follow; the crowd as chirper-zero's wide sm-crowd bed (crowd-l/crowd-r) at -6 dB. v2: drums snapped within 320 ms to the crowd-free drum stem (tools/livestems.py); the vocal from its vocal stem (tools/monotrans.py, 100 notes on maynard; the tab has none). v7: the S&M intro (5.7-72.7 s) has bass and guitar under the orchestra where the tab's band parts rest: an intro bass from the crowd-free bass stem (tools/padtrans.py, 1 voice 30-250 Hz, 39 notes, m8-bass -6 dB) and an intro guitar from the guitar stem (3 voices 80-1200 Hz, 202 notes, velocities x3, m8-clean -4 dB). Bed trim (Harry, 26 Oct: the S&M audience noise was too heavy-handed): crowd-l/crowd-r -26 dB, to sit 30+ dB under the music over the body (tools/bedlevel.py); the applause edges unchanged."
