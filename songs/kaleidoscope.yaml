about: "Hill-climb reproduction of Meshuggah — Kaleidoscope (Immutable, 2022), from Songsterr tab 505656 (Fredrik, Mårten L/R, bass, drums), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/kaleidoscope.json. v2: Jens' vocal from the vocal stem (tools/stemvox.py --map --note auto --onsets flux, 101 bars) on kidman (amp attack 40 ms), -6 dB. v4: bass +2 dB (bass-fat at 0 dB). v6: an octave-up copy of the bass part (bass8: the tab part transposed +12, bass-fat, -8 dB) - the 5-string bass on F0/Bb0 reads its 3rd harmonic in chroma (The Faultless v6 +2.3). v8: the tab's bend marks stripped from the rhythm guitars and bass (map strip ['bend'] on gtr-l/gtr-r/bass/bass8; leads keep theirs). v10: faint independent L/R copies of the bass (bassL/bassR: pan -1/+1, +7/+19 ms, bass gain -32 dB) for the record's wider 20-60 Hz. v12: a master hall reverb (4 s) whose mix lane opens to 0.06 at the band stop (238.6-239.4 s), for the record ring-out our dry kit lacks."
