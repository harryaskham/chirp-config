about: "Metallica - Outlaw Torn (S&M, 1999, live with the San Francisco Symphony; track 17; reference ref/albums/s-m/17.mp3 from Harry's Drive, ~128-160 kbps MP3), from Songsterr tab 13844 (human, the Load studio arrangement: vocals, James' rhythm and Kirk's lead in Eb, the delay guitar, bass, drums, shaker). Generated by tools/tab2song.py from tools/maps/outlaw-torn.json. Offset 8.58 s (crowd before the intro) and per-8-bar tempos 54-78 BPM from a DTW read of the map's own bar starts against the record (the live performance drifts ±15 s from the studio tab). After tab2song: drums+shaker snapped to the drum stem within 320 ms (tools/onsetsnap.py; rhythm 5 -> 39); levels from the stems (vocal -1, bass +1, drums +3, guitars +4.6 dB), guitars wide; master +4 dB; the orchestra from the other stem (tools/padtrans.py, 3 voices, 1 s windows, 969 notes on strings at -8 dB). Round 3: the audience as a full-length wide crowd bed (patches/sm-crowd, crowd-l/crowd-r pan -1/+1 11 ms apart, head/tail vel .8; chirper-zero's recipe) at -22 dB under v2's fitted master. v5: the vocal is tools/voxtrans.py's line from the crowd-free vocal stem (438 notes) in place of the tab's. v7: drums and shaker regenerated from the tab and re-snapped (320 ms) to the crowd-free drum stem (tools/livestems.py --force; v1's snap used the plain separation). v10: the record's ending is a held Eb (guitar feedback, bass Eb/Bb) over 568-588 s, not the tab's F-centred riff: rhythm/lead/bass muted there by lanes, a held Eb power chord restruck every 2 s (endgtr pair +-0.6, endbass). Bed trim (Harry, 26 Oct: the S&M audience noise was too heavy-handed): crowd-l/crowd-r -12 dB, to sit 30+ dB under the music over the body (tools/bedlevel.py); the applause edges unchanged."
