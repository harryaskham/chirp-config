about: "chirpers X (Common Time), track 5 by chirper-zero: False Summit. True djent built on the illusions of endless motion, played by the band: a line that climbs an octave every bar and is never higher (three guitars a side an octave apart, each fading in at the bottom and out at the top); a chug that speeds up for ever and is never faster (the same three at three speeds); the two together; and at the end the first bars again, exactly. v1 is the skeleton."
