about: "Hill-climb reproduction of Meshuggah — Black Cathedral (Immutable, 2022), from Songsterr tab 591551 (guitars R and L, 8-string F standard), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/black-cathedral.json. v2: from 85.5 s the record's guitar stem holds an A2/Ab2 cluster under the tremolo line (its 40-260 Hz peaks read A2/Ab2/G2 in every bar from 82 s; the tab's notes there differ): a drone track (the guitar patch, A2 restruck every 2 beats) at -8 dB from 85.5 s. v4: master +8 dB at the end of the chain (the record sits at -19/-20 dB per second through the body; ours read -27/-29). v5: the A2 drone from 74.8 s (bar 29) instead of 85.5 s (a drone2 track over 74.8-85.5 s, -8 dB). v6 (chirper-zero): a ride + width refit on seeds 0 and 11 together. v7 (chirper-zero): each guitar's level follows the record's own channel's short-term level contour (a gain lane auto.envl: the 200 Hz-8 kHz level in 25 ms windows minus its 1 s median, x1.5, one point per likeness frame), so the metered tremolo's onset contour follows the human one; width x2 refit on seeds 0 and 11."
tempo: 140
