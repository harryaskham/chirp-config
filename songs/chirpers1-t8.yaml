about: "Chirpers - Chirpers I, track 8 (outro), v1 by chirper-one: an original epic closer in six movements at 96 BPM (dawn / gathering / the cog / the climb / the crush / dissolve). Motifs M1 (7- then 11-sixteenth chug cells on F with Gb and a B tritone stab), M2 (a clean 5-note arpeggio F3 C4 Ab4 G4 Db4 on 8ths, 5 against 8), M3 (the lead line), pads in F Phrygian (Fm add9 / Dbmaj7 / Bbm / Gb). Generator: chirper-one compose_t8.py."
