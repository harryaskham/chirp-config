about: "Radiohead - Like Spinning Plates (Amnesiac, 2001, track 10). v1 from the stems: a sine sub bass (bass stem), a 'backwards' saw pad swelling over each chord (other stem, 0.5 s windows) plus the same chords re-struck at the record's onsets (the backing's restless flutter, ~1180 hits), a G# glass ping (guitar stem), Thom's lead on the Pyramid Song voice (vocal stem, from 94.5 s), a wide hiss bed (two hard-panned noises above 4 kHz) and an intro of hiss and low rumble following the record's band envelopes; master: section levels, 7-band width, two section EQs and a contour ride. v4: the re-struck pad hits 30 ms later (their onset flux peaked ~25 ms before the record's: the saw pad's 25 ms attack). v5: the 4-14 s intro rumble struck at the record's onsets (its bursts), then a ride refit. v6: the intro's stereo - the hiss and rumble get faint independent L/R copies (-22 dB: the record's side sits ~28 dB under its mid), and the air bed is centred until 15 s (hard L/R after). v7: the bass on its own patch (lsp-bass): sub's sine with a 2nd harmonic at -9 dB (and faint 3rd-5th), lp 300 - the bass stem's 100-160 Hz, which a pure sine left 10-16 dB short."
