about: "Radiohead - Like Spinning Plates (Amnesiac, 2001, track 10). v1 from the stems: a sine sub bass (bass stem), a 'backwards' saw pad swelling over each chord (other stem, 0.5 s windows) plus the same chords re-struck at the record's onsets (the backing's restless flutter, ~1180 hits), a G# glass ping (guitar stem), Thom's lead on the Pyramid Song voice (vocal stem, from 94.5 s), a wide hiss bed (two hard-panned noises above 4 kHz) and an intro of hiss and low rumble following the record's band envelopes; master: section levels, 7-band width, two section EQs and a contour ride."
