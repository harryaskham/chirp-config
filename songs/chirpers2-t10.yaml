about: "Chirpers - Odd Hours, track 10 (the closer; original composition, chirper-zero; generator compose/chirpers2/src/chirpers2-t10.py). An Afro-Cuban / Latin-jazz suite in clave, D minor: 12/8 bembe -> 4/4 son montuno (3-2) -> horn mambo with trumpet and tenor trading fours (clave flipped) -> a 7/4 interlude on a stretched 3+2+2 clave (rhodes) -> an afro 12/8 descarga with a coro, rising D to E -> cierre and a last Dmaj9#11. One pulse throughout by metric modulation (dotted quarter 104 = half note 104)."
