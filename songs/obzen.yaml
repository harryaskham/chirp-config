about: "Hill-climb reproduction of Meshuggah — obZen (obZen, 2008), from Songsterr tab 43187 (Head's human transcription: Thordendal (gtr-l) + Hagström (gtr-r) rhythm on the 8-string F standard, harmony guitar (lead), bass, drums; 186 bars of 4/4 at 170 BPM), aligned to the album recording (bar 1 at 0.256 s: tabtime align 0.192 in every 30-s window, then the render's onsets read +0.064 in 12 of 13 20-s windows, corr 0.65-0.73). Generated by tools/tab2song.py from tools/maps/obzen.json (the map reproduces every track; the master lanes are song-level). v1 (chirper-zero): stem balance (guitars -3.5, bass +2.7, drums -4.2 dB); chug voicing A1,E2 -> A1,A2 and single F1/F#1/A1 -> root+octave (map subst); bass24 (the bass +24 at -10 dB re bass: the record's bass stem sits 21-26 dB under its total below 60 Hz and reads F2/C3/F3, ours sat 2-9 dB); the intro bass (bars 1-32) on Bb (the record's bass stem reads A# 72% / A 48% there, its harmonics 57.1/85.7/114.3 Hz = 2-4 x 28.6 Hz); vox from the htdemucs vocals stem (stemvox flux) rested where the stem sits under -18 dB re the mix (bars 1-29, 114-152, 171-186: stemvox had transcribed guitar bleed at -7..-10 dB where the record has -22..-30) and 4.5 dB lower; a vox formant EQ from the stems' 1/6-octave LTAS (the record's shout peaks at 800-1000 Hz, ours at 566-713 and 2.2-2.5 kHz: lowshelf 170 -10, 600 -9, 900 +12, 2.4k -7, highshelf 4k -8 dB; the record's vocal carries 35-58% of the scored chroma power and reads F#-A#, ours read D-F); a song-local oz-kit (metal-kit-dry with the kick at D2 - its 31-semitone pitch sweep starts at A4 instead of E4; the record's drums read A#/G#/A/B, ours E/F; kick scan C2 64.13 / C#2 64.00 / D2 64.40 / D#2 63.64 / E2 63.68 - and the snare at G#3); a clean low layer (brk: the rhythm line +12 on bass-fat at -12 dB, bars 130-136) for the drumless break where the record's guitar alone carries 60-120 Hz at -8 dB of the total and ours sat at -21; master: level/width/eq/ride/ride/width from the setup, a ride refit and one --joint width pass on seeds 0 and 11. v2 (chirper-zero): the limiter ceiling. v1 had no `ceiling` (the engine's default holds peaks at -1.0 dBFS): ours measured peak -1.0 / RMS -11.5 / crest 10.5 dB over 10-240 s where the record reads 0.0 / -9.6 / 9.6, 1.5-1.9 dB quieter in every 2-s window. ceiling -0.1dB alone +1.01/+0.92 (seeds 0/11; every section +0.5..+0.8); with +0.25/+0.5/+1/+1.5/+2 dB into it 67.79/66.99, 67.73/66.95, 67.49/66.79, 67.17/66.46, 66.80/66.07 (the limiter's squash costs more than the level gains); a glue compressor -1.1; ceiling 0dB +0.1 more (kept -0.1 for playback headroom). Then two ride passes on seeds 0 and 11 (a --joint width pass after them tied: -0.05). Also tried: root+two-octave voicing on the rhythm pair (F1,F2,F3; chirper-three's +5 bars 141-169 read our F as C) mixed by seed (-0.14/+0.46) and a quiet octave-up guitar copy (-0.15). v3 (chirper-zero): the ending matched per 0.2 s from 261.8 s (auto.end): the record cuts from -26 to -51 dB at 262.0-262.25 s (only its sub decays on), ours rang at -31/-40/-50 dB; last section 59 -> 64 (loudness +36), the album join into This Spiteful Snake 34.6 -> 42.1. Tried and dropped (0/11): the harmony lead (bars 16-32; partchroma read its Eb4,Bb4 dyads as Bb/F where the guitar stem reads D#) muted 68.03/67.18, -6 dB 68.11/67.26, lower notes only 68.15/67.30 against 68.23/67.38; the drumless break (bars 131-136: the record L/R level, ours +4.5 dB left) with gtr-l's riff doubled on the right (-3.5 at that section; at -3 dB -1.4) and a section-only master EQ for it (sectioneq --only 13: -1.4); a clean sine root layer (sub, the rhythm riff +24) at -18/-12/-6/0 dB re gtr-l: 0.0/0.0/-0.06/-0.32 (it lowered chroma: the guitar-only F-reads-C audit isn't what the full mix's chroma lacks). v4 (chirper-zero): the vocal's share of the scored band. chromaattr (100 Hz-4 kHz power by part) over 82-154 s: the record's vocal stem carries 54% and its guitar 25%, ours 13% and 47% (206-244 s: 35/37% vs 12/46%) - level-matched by RMS, our guitars still fill the mids; a broad guitar mid cut (peak 800 Hz q 0.7 -4 dB on gtr-l/gtr-r) lifts chroma +3..+5 in every vocal section; -8 dB +5..+9 but spectral lost more (66.40..67.80); vox +2 dB on top lost; master EQ refits dropped. One ride pass on seeds 0 and 11. Fair control (v3 with the same ride pass): 68.425/67.541/67.632/67.282 - the cut adds +0.08/+0.01/+0.13/-0.01 over it. v5 (chirper-zero): a more harmonic shout. The record's vocal stem carries 35-54% of the scored band's power where ours carried 12-13% (v4's note); kidman's voice layer at scream 0.5 / fold 0.3 (patch defaults 0.8 / 0.6) puts more of its energy on harmonics: chroma +2..+6 in the vocal sections (146 s +1.3). Four seeds (vs 68.505/67.551/67.762/67.275): scream 0.5 68.593/67.681/67.830/67.398; scream 0.5 + fold 0.3 68.617/67.713/67.849/67.408 (kept); + rasp 0.5 68.551/67.678/67.738/67.329; + rasp 0.6 68.535/67.742/67.675/67.369; scream 0.3 + fold 0.2 68.495/67.738/67.726/67.349; scream 0.2 + fold 0 68.509/67.691/67.680/67.322. Also tried: tools/otherpad.py over 240-260 s (the other stem's only span within 30 dB; 38 notes) at -12/-8/-4 dB: within +-0.01. v6 (chirper-zero): v4's guitar cut (800 Hz q0.7) at -2 dB rather than -4 - refitted after v5's more harmonic shout. Four seeds (vs 68.617/67.713/67.849/67.408): +2 dB 67.748/67.111/67.023/66.880, none 68.525/67.763/67.748/67.486, -1 68.700/67.898/67.898/67.585, -2 68.746/67.912/67.951/67.588 (kept), -6 68.292/67.334/67.519/67.094. LTAS of our rhythm guitars vs the BS-RoFormer-SW guitar stem still shows +4..+8 dB over 311-740 Hz, but added mid cuts lost (500 Hz -3 67.748 mean, 560 -4 67.531, 450 -4 67.770; v5 67.897), as did 2 kHz -3 (67.517)."
