about: "Hill-climb reproduction of Meshuggah — obZen (obZen, 2008), from Songsterr tab 43187 (Head's human transcription: Thordendal (gtr-l) + Hagström (gtr-r) rhythm on the 8-string F standard, harmony guitar (lead), bass, drums; 186 bars of 4/4 at 170 BPM), aligned to the album recording (bar 1 at 0.256 s: tabtime align 0.192 in every 30-s window, then the render's onsets read +0.064 in 12 of 13 20-s windows, corr 0.65-0.73). Generated by tools/tab2song.py from tools/maps/obzen.json (the map reproduces every track; the master lanes are song-level). v1 (chirper-zero): stem balance (guitars -3.5, bass +2.7, drums -4.2 dB); chug voicing A1,E2 -> A1,A2 and single F1/F#1/A1 -> root+octave (map subst); bass24 (the bass +24 at -10 dB re bass: the record's bass stem sits 21-26 dB under its total below 60 Hz and reads F2/C3/F3, ours sat 2-9 dB); the intro bass (bars 1-32) on Bb (the record's bass stem reads A# 72% / A 48% there, its harmonics 57.1/85.7/114.3 Hz = 2-4 x 28.6 Hz); vox from the htdemucs vocals stem (stemvox flux) rested where the stem sits under -18 dB re the mix (bars 1-29, 114-152, 171-186: stemvox had transcribed guitar bleed at -7..-10 dB where the record has -22..-30) and 4.5 dB lower; a vox formant EQ from the stems' 1/6-octave LTAS (the record's shout peaks at 800-1000 Hz, ours at 566-713 and 2.2-2.5 kHz: lowshelf 170 -10, 600 -9, 900 +12, 2.4k -7, highshelf 4k -8 dB; the record's vocal carries 35-58% of the scored chroma power and reads F#-A#, ours read D-F); a song-local oz-kit (metal-kit-dry with the kick at D2 - its 31-semitone pitch sweep starts at A4 instead of E4; the record's drums read A#/G#/A/B, ours E/F; kick scan C2 64.13 / C#2 64.00 / D2 64.40 / D#2 63.64 / E2 63.68 - and the snare at G#3); a clean low layer (brk: the rhythm line +12 on bass-fat at -12 dB, bars 130-136) for the drumless break where the record's guitar alone carries 60-120 Hz at -8 dB of the total and ours sat at -21; master: level/width/eq/ride/ride/width from the setup, a ride refit and one --joint width pass on seeds 0 and 11."
