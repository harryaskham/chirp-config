about: "Hill-climb reproduction of Meshuggah — Armies of the Preposterous (Immutable, 2022), from Songsterr tab 506003 (leads, Mårten L/R, drums, bass), aligned to the album recording. Generated by tools/tab2song.py from tools/maps/armies-of-the-preposterous.json. v3: the final E (bars 165-167) held through bar 168 at 50 BPM (to ~305.5 s, as the record rings on), and a master tail lane (-11 dB over 301-304.4 s, back to 0 by 306.4 s) matching the record's decay. v4: an octave-up copy of the bass part (bass8: the tab part transposed +12, bass-fat, -8 dB) - the 5-string bass on F0/Bb0 reads its 3rd harmonic in chroma (The Faultless v6 +2.3). v6: bass8 at -5 dB. v8: the tab's bend marks stripped from the rhythm guitars and bass (map strip ['bend'] on gtr-l/gtr-r/bass/bass8; leads keep theirs). v9: faint independent L/R copies of the bass (bassL/bassR: pan -1/+1, +7/+19 ms, bass gain -32 dB) for the record's wider 20-60 Hz. v10: chirper-zero's tom recipe (Broken Cog): a song-local kit, metal-kit-dry with the riff toms on prog-tom retuned, here t2 G2 / t3 B2."
