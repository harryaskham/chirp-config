about: "chirpers X (Common Time), track 8 by chirper-zero: Common Measure. Two riffs of different lengths, 52 sixteenths on the left guitar and 32 on the right, and Euclid's way of finding what measures both: take the less from the greater. Each section the longer riff is cut down to what was left over, its own tail: 52 against 32, 20 against 32, 20 against 12, 8 against 12, 8 against 4. Four goes into eight: the measure is one beat, the four sixteenths both riffs end with, and then the two riffs are played whole, together. The fast song: 160. v1 is the skeleton."
