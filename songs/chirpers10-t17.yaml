about: "So Far. Halve it if it is even; treble it and add one if it is odd. The first sixteen numbers, each walked to one: a number is its length in sixteenths, its harmonic over the low F and its own riff. Common Time t17 v1. v2: at the top of the fifteenth walk (160) two more guitars and the bass already say the phrases of 80 and 40. v9: from forty in the fifteenth walk a voice says the numbers as they come; five more say the sixteenth walk; one word a turn on the wheel."
