about: "Metallica - Devil's Dance (S&M, 1999, live with the San Francisco Symphony; track 10; reference ref/albums/s-m/10.mp3), from Songsterr tab 522264 (human, studio arrangement: vocals, Kirk's lead and additional guitar, James' rhythm, Jason's bass, Lars' drums; D standard). Generated by tools/tab2song.py from tools/maps/devil-s-dance.json. v1: a beat-tracked live bar clock (~97 bpm, 88-105 per bar; bar 1 at 7.1 s after the crowd) +60 ms; the audience as wide pink noise (250 Hz-6 kHz) at the head, the tail and under the whole song; vox -12, lead +4, bass +4 dB; ride and width fitted. The orchestra is not in yet. v2: the vocal from the crowd-free vocals stem (tools/voxtrans.py, 228 notes) on the maynard voice at -3 dB; the orchestra as a pad transcribed from the other stem (padtrans, strings -8 dB, to 281.6 s); the master refitted with level and eq lanes as well as ride and width; the first 2 s / last 6 s ridden to the record. v3: the live solo and lead lines transcribed from the guitar stem (tools/voxtrans.py, 200-1200 Hz) on a `solo` track where they beat the studio tab (7-94.5, 109.5-127, 137-152, 166.9-251.9 s; the tab lead muted there by a lane); the crowd bed's body 22 dB down (Harry: the audience noise was too heavy-handed; now 36 dB under the music, every 10 s window 34+ dB under); the master refitted (eq:0.5, ride + width twice)."
