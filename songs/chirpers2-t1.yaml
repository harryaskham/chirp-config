about: "Chirpers - Odd Hours, track 1: Doors at Seven (the opener; original composition, chirper-zero; generator compose/chirpers2/src/chirpers2-t1.py). A modal hard-bop quintet whose meter changes with each chorus: swung 7/4 head (C dorian / Db lydian, G7alt turnaround) -> even-eighth 4/4 bridge (a whole-step stair of major chords) -> head -> tenor solo in 4/4 -> piano trio in a 3/4 jazz waltz -> tenor and drums trading twos in 7/4 -> head out -> coda on Cm(add9). 176 bpm, swing 0.62."
