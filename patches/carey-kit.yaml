about: >-
  Danny Carey's Fear Inoculum-era hybrid kit (for Tool's "Pneuma"): the metal-kit kick, snare and hats,
  modal toms and cymbals (membranes and dense plates with wash), his Mandala-pad tabla voices (borrowed
  tabla-kit bols), a modal gong and a castanet click.
  Tab mapping (tab2song --drums): 60=dha 61=tun 62=te 63=tin 64=ge 65=ke 76=wb 85=cas 92=gong 98=gong.
extends: metal-kit
kit:
  dha: tabla-kit.dha
  tun: tabla-kit.tun
  te: tabla-kit.te
  tin: tabla-kit.tin
  ge: tabla-kit.ge
  ke: tabla-kit.ke
  na: tabla-kit.na
  cas: {gain: -10dB, patch: {synth: {layers: [{type: noise}], filters: ["bp cutoff=3.2k q=3"], amp: {a: 0.1ms, d: 25ms, s: 0, r: 8ms, curve: 5}}}}
  # Toms and cymbals on the modal layer (struck membranes / dense chaotic plates with wash): the additive
  # stand-ins read as chimes and thin sine sweeps. A/B on Pneuma (two-pass with mastering re-fit): 59.9 vs 59.8.
  t1: {pitch: F#3, patch: modal-tom}
  t2: {pitch: D3, patch: modal-tom}
  ft: {pitch: F2, patch: modal-tom}
  rd: {pitch: D4, pan: 0.4, gain: -9dB, patch: modal-ride}
  c: {pitch: F4, pan: -0.5, gain: -9dB, patch: modal-crash}
  x: {pitch: C4, pan: 0.6, gain: -5dB, patch: modal-china}
  gong: {pitch: A1, gain: -6dB, patch: modal-gong}
