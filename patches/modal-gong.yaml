about: >-
  Symphonic gong / tam-tam on the modal layer: a very dense low plate, slow wash bloom that swells
  after the strike, a long ring; soft mallet. Pitch ~A1.
synth:
  layers:
    - name: plate
      type: modal
      modes: gong
      strike: 0.6
      bright: {value: 0.3, mod: [{src: vel, amount: 0.35}]}
      decay: 10s
      damp: 0.02
      tilt: -1
      bloom: 0.9
      vary: 0.5
  filters: ["hp cutoff=35", "lp cutoff=9k"]
  amp: {a: 2ms, d: 10s, s: 0, r: 2s, curve: 3}
play: {vel_sens: 0.5}
