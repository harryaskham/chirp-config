about: "Music box: tiny steel comb tines plucked by a cylinder — bright, slightly inharmonic partials, a short ring and a faint mechanical tick. Lullaby hooks, warped liminal melodies."
synth:
  layers:
    - {type: additive, partials: [[1, 1], [2.92, 0.28], [5.6, 0.12], [9.2, 0.05]], damp: 0.6}
    - {type: noise, color: white, level: {value: -70dB, mod: [{src: env.tick, amount: 40}]}}
  env:
    tick: {a: 0.2ms, d: 6ms, s: 0}
  filters: ["hp cutoff=400", "lp cutoff=9k"]
  amp: {a: 0.5ms, d: 1.4s, s: 0, r: 300ms, curve: 3}
play: {gate: 1, vel_sens: 0.5, humanize: {time: 6ms, vel: 0.08}}
fx: ["reverb kind=room decay=1.4s mix=0.22"]
gain: -6dB
