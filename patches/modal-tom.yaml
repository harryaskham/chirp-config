about: >-
  Tuned tom on the modal layer: circular-membrane modes (centre-ish strike: the fundamental family
  leads, the off-centre modes give the "tone"), stick contact whose hardness follows velocity,
  head pitch glide on hard hits, a short stick click, slight drive. Set the pitch per piece.
synth:
  layers:
    - name: head
      type: modal
      modes: membrane
      strike: {value: 0.3, mod: [{src: rand, amount: 0.08}]}
      bright: {value: 0.45, mod: [{src: vel, amount: 0.4}]}
      decay: 1.3s
      damp: 0.45
      tilt: -2
      sharp: 70
      vary: 0.4
    - name: stick
      type: noise
      level: {value: -66dB, mod: [{src: env.att, amount: 50}, {src: vel, amount: 8}]}
  env:
    att: {a: 0.1ms, d: 5ms, s: 0}
  filters: ["hp cutoff=40", "peak cutoff=4k q=1 gain=2dB"]
  amp: {a: 0.2ms, d: 1.8s, s: 0, r: 150ms, curve: 3}
  drive: 0.12
play: {vel_sens: 0.55}
