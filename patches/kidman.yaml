about: "Harsh barked metal vocal on the voice engine (scream 0.8 and false-fold 0.6 put its harmonic-to-noise ratio and subharmonics inside Jens Kidman's measured range; syllables via ^on=/^off= consonant codes and ^vow= vowels, e.g. from tools/stemvox.py --phones)'s source–filter layer (glottal pulse → 5-formant tract; bd-4664e9): pressed effort, heavy rasp (symmetric period doubling keeps a bark on its note — strained shouts are strongly pitched), a strong singer's ring, an open 'a' that wanders a little per bark, a scoop up into each onset, drive and tight compression, upfront and nearly dry. Jens Kidman-style barks: play the shout rhythm on the shout's pitch (Bleed: A4; tools/stemvox.py transcribes a vocal stem's syllables). On Bleed's mix it measures below the noisier 'bark' stand-in (62.3 vs 63.0): soloed it is better pitched (A/E against bark's E/A; the reference reads A/Ab/G/Bb), but its clean harmonic series imprints its 3rd harmonic (E) on the mix's chroma."
play: {mono: true, glide: 20ms, humanize: {time: 4ms, vel: 0.05}}
synth:
  layers:
    - type: voice
      vowel: {value: 0, mod: [{src: expr.vow, amount: 1}, {src: rand, amount: 0.08}]}
      breath: 0.3
      effort: {value: 0.5, mod: [{src: vel, amount: 0.15}]}
      rasp: {value: 0.75, mod: [{src: vel, amount: 0.2}]}
      scream: 0.8
      fold: 0.6
      ring: 0.1
      vary: 0.5
      onset: expr.on
      coda: expr.off
  pitch: {value: 0, mod: [{src: env.scoop, amount: -1.5}]}
  env:
    scoop: {a: 0.5ms, d: 90ms, s: 0}
  amp: {a: 8ms, d: 0s, s: 1, r: 70ms}
  drive: {value: 0.5, mod: [{src: vel, amount: 0.25}]}
fx:
  - {type: compressor, threshold: -24dB, ratio: 6, attack: 2ms, release: 80ms, makeup: 6dB}
  - "reverb kind=room decay=0.6s mix=0.08 predelay=8ms"
gain: -12.4dB
