about: "Sampleless spoken-vocal gestures: a softer opt-in sibling of kidman, without its scream/period-doubling and with gentler rasp, effort and drive. No TTS or intelligible lyrics are claimed. Use flux-timed syllables and ^on/^off/^dvow marks (stemvox --onsets flux --grid 0.03125 --min 0.0625 --phones); do not replace a sparse pitched-vocal line without compensating the increased voiced duration. First measured on Mind's Mirrors. Existing harsh-vocal defaults are unchanged (bd-855e25)."
extends: "kidman synth.layers.0.scream=0 synth.layers.0.fold=0 synth.layers.0.rasp.value=0.15 synth.layers.0.rasp.mod=[] synth.layers.0.effort.value=0.3 synth.layers.0.effort.mod=[] synth.drive.value=0.1 synth.drive.mod=[]"
