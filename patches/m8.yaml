about: >
  Meshuggah-style 8-string (F standard: F1 Bb1 Eb2 Ab2 Db3 Gb3 Bb3 Eb4): bridge-humbucker DI (pickup
  position, resonance) into a 3-stage `modern` amp with sag and a 4×12 cab. Dynamic: velocity drives pick attack, brightness and sustain; every note varies slightly.
  Articulations: `expr.pm=1` palm mute (latching; `^pm` for one note) damps and darkens the string;
  `^ph` true pinch harmonic (node-excited 3rd–6th); alternate picking (expr.up) flips stroke polarity
  and attack; released notes are choked by the fret hand; stiff wound strings clank; hard picks buzz.
  `^dead` muted ghost tick; a fret-hand thump on chokes. Held notes grow vibrato; `^gate=1.2` lets a note ring.
synth:
  layers:
    - name: string
      type: pluck
      pick: 0.11
      pickup: 0.09
      coil: 0.3
      stiff: 0.32
      buzz: {value: 0.22, mod: [{src: expr.thump, amount: 0.6}, {src: expr.pop, amount: 0.4}]}
      node: {value: 0, mod: [{src: expr.nh, amount: 1}]}
      choke: 55ms
      fret: 0.3
      pinch: {value: 0, mod: [{src: expr.ph, amount: 1}, {src: expr.nh, amount: 1}]}
      polarity: {value: 1, mod: [{src: expr.up, amount: -2}]}
      decay: {value: 4.5s, mod: [{src: expr.pm, amount: -4.15}, {src: vel, amount: 0.3}, {src: expr.dead, amount: -4.44}]}
      bright: {value: 0.76, mod: [{src: expr.pm, amount: -0.42}, {src: vel, amount: 0.2}, {src: expr.up, amount: -0.05}, {src: expr.dead, amount: -0.5}, {src: rand, amount: 0.04}]}
      level: {value: 0dB, mod: [{src: expr.up, amount: -1.2}, {src: expr.ph, amount: 3}, {src: expr.dead, amount: -5}]}
    - name: pick
      type: noise
      level: {value: -60dB, mod: [{src: env.pick, amount: 44}, {src: vel, amount: 10}, {src: expr.up, amount: -3}]}
  pitch: {value: 0, mod: [{src: env.bite, amount: 0.15}, {src: rand, amount: 0.05}, {src: lfo.vib, amount: 0.2}]}
  env:
    pick: {a: 0.1ms, d: 6ms, s: 0}
    bite: {a: 0.2ms, d: 45ms, s: 0}
  lfo:
    vib: {wave: sine, rate: 5.3hz, delay: 380ms, fade: 450ms, retrig: true}
  filters:
    - {kind: lp, cutoff: {value: 11k, mod: [{src: expr.pm, amount: -3.4}, {src: vel, amount: 0.6}]}, q: 0.6}
    - "peak cutoff=3.2k q=1.8 gain=3dB"
    - "lp cutoff=7.5k q=0.6"
  amp: {a: 1ms, s: 1, r: 90ms}
play:
  voicing: guitar
  tuning: F1 Bb1 Eb2 Ab2 Db3 Gb3 Bb3 Eb4
  frets: 24
  strum: 7ms
  gate: 0.88
  humanize: {time: 4ms, vel: 0.07}
  vel_sens: 0.35
fx:
  - {type: amp, model: modern, gain: 0.8, tight: 120, boost: 3dB, bass: 0.55, mid: 0.42, treble: 0.6, presence: 0.62, resonance: 0.62, sag: 0.25}
  - {type: cab, model: 4x12, mic: 0.25, distance: 0.1}
  - {type: gate, threshold: -52dB, attack: 0.5ms, hold: 20ms, release: 45ms}
gain: -17dB
