about: >
  Haake-style metal kit, dynamic: every hit varies (pitch, tone, level) and velocity changes timbre
  (beater click, snare crack/wires, cymbal brightness), so ghost notes and accents sound different.
  Pieces: k s x(china) h hh(half-open) oh rd rb c t1 t2 ft. Combine hits: k,x. Length defaults to 1/16.
play: {len: /16, vel_sens: 0.6, humanize: {time: 3ms, vel: 0.06}}
gain: -8dB
fx:
  - {type: compressor, threshold: -16dB, ratio: 3.5, attack: 4ms, release: 100ms, makeup: 4dB}
  - type: eq
    bands: ["hp cutoff=30", "peak cutoff=330 q=1 gain=-3dB", "highshelf cutoff=9k gain=2dB"]
  - "reverb mix=0.1 size=0.28 damp=0.6"
kit:
  # Kick: swept sine body + knock + beater click whose level follows velocity.
  k:
    pitch: A1
    patch:
      synth:
        layers:
          - {name: body, wave: sine}
          - {name: knock, wave: sine, ratio: 2.1, level: {value: -60dB, mod: [{src: env.knock, amount: 54}, {src: rand, amount: 2}]}}
          - {name: click, type: noise, level: {value: -66dB, mod: [{src: env.click, amount: 56}, {src: vel, amount: 12}, {src: rand, amount: 2}]}}
          - {name: tick, wave: triangle, fixed: 3200, level: {value: -66dB, mod: [{src: env.click, amount: 52}, {src: vel, amount: 10}]}}
        pitch: {value: 0, mod: [{src: env.p, amount: 25}, {src: rand, amount: 0.35}]}
        env:
          p: {a: 0.3ms, d: 32ms, s: 0, curve: 5}
          click: {a: 0.1ms, d: 5ms, s: 0, curve: 3}
          knock: {a: 0.3ms, d: 25ms, s: 0}
        filters:
          - {kind: peak, cutoff: {value: 4k, mod: [{src: rand, amount: 0.15}]}, q: 1, gain: {value: 1dB, mod: [{src: vel, amount: 5}]}}
          - "lowshelf cutoff=80 gain=3dB"
        amp: {a: 0.3ms, d: 270ms, s: 0, r: 30ms, curve: 4}
        drive: 0.2
      play: {vel_sens: 0.5}
  # Snare: body + shell, wires and crack scale with velocity (ghosts are soft and dark).
  s:
    pitch: G3
    patch:
      synth:
        layers:
          - {name: body, wave: triangle, level: {value: -60dB, mod: [{src: env.body, amount: 60}]}}
          - {name: shell, ratio: 1.58, level: {value: -60dB, mod: [{src: env.body, amount: 50}, {src: rand, amount: 3}]}}
          - {name: wires, type: noise, level: {value: -68dB, mod: [{src: env.wires, amount: 62}, {src: vel, amount: 6}]}}
          - {name: crack, type: noise, level: {value: -72dB, mod: [{src: env.crack, amount: 60}, {src: vel, amount: 12}]}}
        pitch: {value: 0, mod: [{src: env.p, amount: 5}, {src: rand, amount: 0.3}]}
        env:
          p: {a: 0.2ms, d: 18ms, s: 0}
          body: {a: 0.3ms, d: 120ms, s: 0, curve: 4}
          wires: {a: 0.5ms, d: 230ms, s: 0, curve: 4}
          crack: {a: 0.1ms, d: 12ms, s: 0}
        filters:
          - "hp cutoff=140"
          - {kind: peak, cutoff: {value: 5k, mod: [{src: rand, amount: 0.2}]}, q: 0.8, gain: {value: 0dB, mod: [{src: vel, amount: 7}]}}
          - "peak cutoff=900 q=1 gain=-3dB"
          - {kind: lp, cutoff: {value: 6k, mod: [{src: vel, amount: 1.8}]}}
        amp: {a: 0.2ms, d: 340ms, s: 0, r: 30ms}
        drive: 0.15
      play: {vel_sens: 0.75}
  # China: noisy and trashy, brighter and longer-ringing when hit hard.
  x:
    gain: -5dB
    patch:
      synth:
        layers:
          - type: additive
            fixed: 380
            partials: [[1, 0.4], [1.47, 0.5], [2.09, 0.7], [2.56, 0.6], [3.11, 0.8], [3.67, 0.7], [4.32, 0.9], [4.97, 0.8], [5.71, 1], [6.38, 0.9], [7.24, 0.9], [8.09, 0.8], [9.13, 0.8], [10.4, 0.7], [11.8, 0.6], [13.3, 0.5], [15.1, 0.4]]
            damp: 0.9
            level: -14dB
          - {type: noise}
          - {type: noise, color: pink, level: -6dB}
        pitch: {value: 0, mod: [{src: rand, amount: 0.6}]}
        filters:
          - "hp cutoff=900"
          - {kind: peak, cutoff: {value: 3.5k, mod: [{src: rand, amount: 0.2}]}, q: 0.6, gain: 7dB}
          - "peak cutoff=6.5k q=1.5 gain=4dB"
          - {kind: lp, cutoff: {value: 7k, mod: [{src: vel, amount: 1.4}]}}
        amp: {a: 0.5ms, d: 1.6s, s: 0, r: 200ms, curve: 6}
        drive: 0.3
      play: {vel_sens: 0.7}
  # Hats: closed, half-open, open (choke each other).
  h: {choke: hat, gain: -9dB, patch: haake-hat}
  hh: {choke: hat, gain: -9dB, patch: "haake-hat amp.d=160ms amp.r=40ms"}
  oh: {choke: hat, gain: -10dB, patch: "haake-hat amp.d=520ms amp.r=80ms"}
  # Ride bow and bell.
  rd:
    gain: -9dB
    patch:
      synth:
        layers:
          - {type: additive, fixed: 520, partials: [[1, 0.5], [2.4, 0.4], [3.3, 0.3], [5.1, 0.3], [6.9, 0.25], [8.7, 0.2]], damp: 0.3, level: -6dB}
          - {type: noise, level: {value: -6dB, mod: [{src: vel, amount: 4}]}}
        pitch: {value: 0, mod: [{src: rand, amount: 0.2}]}
        filters: ["hp cutoff=2.5k", "peak cutoff=6k q=0.7 gain=3dB"]
        amp: {a: 0.3ms, d: 1.2s, s: 0, r: 200ms, curve: 6}
  rb:
    gain: -7dB
    patch:
      synth:
        layers:
          - {type: additive, fixed: 760, partials: [[1, 1], [2.03, 0.6], [2.97, 0.5], [4.21, 0.4], [5.4, 0.3]], damp: 0.15}
          - {type: noise, level: -18dB}
        pitch: {value: 0, mod: [{src: rand, amount: 0.15}]}
        filters: ["hp cutoff=400"]
        amp: {a: 0.2ms, d: 1.8s, s: 0, r: 250ms, curve: 5}
  c:
    gain: -9dB
    patch:
      synth:
        layers:
          - {type: noise}
          - {type: additive, fixed: 430, partials: [[1, 0.3], [2.7, 0.4], [4.1, 0.5], [6.3, 0.4], [9.2, 0.3], [12.6, 0.3]], damp: 0.4, level: -8dB}
        pitch: {value: 0, mod: [{src: rand, amount: 0.4}]}
        filters: ["hp cutoff=2.5k", {kind: lp, cutoff: {value: 8k, mod: [{src: vel, amount: 1}]}}]
        amp: {a: 1ms, d: 2.4s, s: 0, r: 300ms, curve: 6}
  # Toms: swept sine + stick attack, velocity-dependent attack.
  t1: {pitch: D3, patch: &tom {synth: {layers: [sine, {type: noise, level: {value: -66dB, mod: [{src: env.att, amount: 52}, {src: vel, amount: 8}]}}], pitch: {value: 0, mod: [{src: env.p, amount: 8}, {src: rand, amount: 0.3}]}, env: {p: {a: 0.3ms, d: 60ms, s: 0}, att: {a: 0.1ms, d: 8ms, s: 0}}, filters: ["hp cutoff=60"], amp: {a: 0.3ms, d: 450ms, s: 0, r: 40ms, curve: 4}, drive: 0.15}}}
  t2: {pitch: A2, patch: *tom}
  ft: {pitch: E2, patch: *tom}
