about: "S&M's audience (chirper-zero): a wide band of crowd noise, pink 250 Hz-6 kHz, for a live record's crowd bed under the whole song. Use two tracks (crowd-l pan -1, crowd-r pan 1, the second's notes 11 ms later) so the channels are independent; head and tail notes at vel 0.8 and the body at 1.0; calibrate the pair's gain with tools/gainsweep.py --tracks 'crowd:crowd-l+crowd-r'. Add it BEFORE masterstack: on a fresh v1 it sits loud (Devil's Dance -9.3 dB, For Whom the Bell Tolls -2.8 dB: +5..+6; Ktulu v1 -6 dB: +4.1); on an already-mastered song the master's eq/ride/level lanes have compensated, so sweep from ~-30 dB up (chirper-one: Human v2 -6 dB -2.3, -22 dB +1.3; Sad but True -6 dB -1.8; Outlaw Torn -6 dB -3.0). Then REFIT the master (masterstack ride + width): a bed added after the master leaves its lanes stale (chirper-zero: Human v3's refit alone +1.97 over 4 seeds)."
synth:
  layers:
    - {type: noise, color: pink}
  amp: {a: 400ms, d: 0s, s: 1, r: 800ms}
  filters: ["hp cutoff=250 q=0.7", "lp cutoff=6000 q=0.7"]
play: {gate: 1}
gain: 0dB
