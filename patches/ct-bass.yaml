{
 "about": "Common Time bass (chirper-zero, 12 Nov): bass-fat re-voiced against two records' bass stems. Their bass lives at 80-1300 Hz (the 2nd to 10th harmonics: body and growl) with little above 2.5 kHz; bass-fat was sub and hiss beside them. Here: the sine sub 6 dB lower, more of the string through a hotter amp (gain 0.7, mix 0.6), +6 / +8 dB at 110 / 220 Hz, +5 dB at 900 Hz, -10 dB above 1.5 kHz and a 4 kHz low-pass. 1/3-octave envelope against the stem, mean error (bbench.py in ~/.local/state/chirper-zero/c10; bass-fat first): Bleed 0-40 s 9.4 -> 4.7 dB, The Faultless 30-70 s 8.4 -> 3.8 dB. The white-box amp parts (triode, feedback power amp, 5150 voicing) all measured worse on a bass and are not used. The two records disagree about the lowest octave (this has 10 dB more than Bleed's and 7 dB less than The Faultless's).",
