about: "Samba percussion: sd surdo (deep, open), sm surdo muted, tm tamborim (high, tight crack), pd pandeiro jingles, pt pandeiro thumb, gz ganzá (metal shaker)."
play: {len: /16, vel_sens: 0.6, humanize: {time: 5ms, vel: 0.08}}
gain: 0dB
fx: ["reverb kind=room decay=0.7s mix=0.12"]
kit:
  sd:
    pitch: G1
    patch:
      synth:
        layers: [sine, {type: noise, color: brown, level: {value: -60dB, mod: [{src: env.s, amount: 40}]}}]
        env:
          p: {a: 0.5ms, d: 50ms, s: 0}
          s: {a: 0.5ms, d: 25ms, s: 0}
        pitch: {value: 0, mod: [{src: env.p, amount: 3}]}
        filters: ["lp cutoff=1.2k"]
        amp: {a: 0.5ms, d: 500ms, s: 0, r: 60ms, curve: 4}
  sm:
    pitch: G1
    gain: -4dB
    patch:
      synth:
        layers: [sine]
        amp: {a: 0.5ms, d: 90ms, s: 0, r: 20ms, curve: 4}
  tm:
    pitch: A5
    gain: -3dB
    patch:
      synth:
        layers: [{wave: sine, level: -8dB}, {type: noise, level: {value: -40dB, mod: [{src: env.s, amount: 32}]}}]
        env:
          s: {a: 0.2ms, d: 18ms, s: 0}
        filters: ["hp cutoff=1.2k", "peak cutoff=3.5k q=1.4 gain=5dB"]
        amp: {a: 0.2ms, d: 60ms, s: 0, r: 10ms, curve: 4}
  pd:
    gain: -8dB
    patch: {synth: {layers: [{type: noise}], filters: ["hp cutoff=5k", "peak cutoff=8k q=2 gain=6dB"], amp: {a: 1ms, d: 70ms, s: 0, r: 20ms}}}
  pt:
    pitch: C3
    gain: -4dB
    patch:
      synth:
        layers: [sine]
        amp: {a: 0.3ms, d: 80ms, s: 0, r: 15ms, curve: 4}
  gz:
    gain: -12dB
    patch: {synth: {layers: [{type: noise}], filters: ["hp cutoff=4k"], amp: {a: 3ms, d: 40ms, s: 0, r: 10ms}}}
