{
 "about": "Odd Sympathy's guitar (chirper-zero, 14 Nov): ONE patch for both sides, because the piece is one riff on two clocks and the two guitars are twins (give each side its own cone: `ct-twin fx.2.cone=4` left, `ct-twin fx.2.cone=5` right). ct-chug's string and pick (the string pick: `soft` follows the palm mute) into the engine's `modern` amp, tight at 220 Hz, a screamer in front, triode stages and an 18 dB feedback loop as on ct-chug; then the engine's own cabinet `4x12-modern` and a gate. NOTHING after the gate: no plate, no sympathetic strings, no eq. It is dry on purpose: a rest is silence (the quietest twentieth of a riff with rests reads below -90 dB where ct-chug reads -22), so two of them a canon apart take turns instead of smearing (one side alone 44% of the time half a bar apart, 18% on ct-chug). Give it a room on a bus if it wants one. The first library patch on the engine cabinet. The amp's mids are raised (0.74) and the microphone sits off the cap (0.4): in Odd Sympathy's mix the first voicing read 2 to 3 dB over the records at 2-4 kHz. Against a record's guitar heard alone (cabspec): 1.95 dB mean (ct-chug on the same cabinet 2.45).",
