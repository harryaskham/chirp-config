about: "Lead into a dark tape echo: the sustaining 8-string, 5150, cab, quarter-note delay with a rolled-off tone and tape warmth, wide hall — big, evil melodic leads."
extends: "m8 layers.0.decay.value=9s layers.0.bright.value=0.8 layers.0.click=0.12 layers.0.scrape=0.08"
synth:
  lfo:
    vib: {wave: sine, rate: 5.4hz, delay: 300ms, fade: 400ms, retrig: true}
fx:
  - {type: amp, model: "5150", gain: 0.9, ts: 0.7, tight: 140, boost: 6dB, bass: 0.5, mid: 0.68, treble: 0.58, presence: 0.6, resonance: 0.55, sag: 0.3, bloom: 0.3}
  - {type: ir, file: jester/cookie-monster, blend_file: jester/darth-genocider, blend: 0.4, length: 120ms, breakup: 0.3, room: 0.12}
  - {type: eq, bands: ["peak cutoff=800 q=0.9 gain=2dB", "peak cutoff=250 q=1.2 gain=-2dB"]}
  - {type: delay, time: 1/4, mix: 0.2, feedback: 0.38, tone: 2400}
  - "tape drive=0.3 warmth=0.6"
  - "reverb kind=hall decay=2.8s mix=0.22 predelay=30ms width=1.3"
gain: -20dB
