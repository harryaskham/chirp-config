about: "lofi-kit made dusty (wM, bd-15ff20, engine 9024eb36): the kick and toms buzz the snare wires (a wires-only piece `sb`, linked with `also` at -32/-36 dB, 2-7 kHz, ~18 dB under the snare's own wires), and the open hat rings and closes with a pedal chick (a kit-piece release trigger). Boom-bap realism for Tape Weather; lofi-kit itself is unchanged."
extends: "lofi-kit"
kit: {"k": {"also": {"sb": "-32dB"}}, "t": {"also": {"sb": "-36dB"}}, "sb": {"patch": {"synth": {"layers": [{"type": "noise"}, {"type": "noise", "color": "pink", "level": "-6dB"}], "filters": ["hp cutoff=1800", "peak cutoff=4k q=1.2 gain=4dB", {"kind": "lp", "cutoff": "7k"}], "amp": {"a": "3ms", "d": "110ms", "s": 0, "r": "20ms", "curve": 3}, "pitch": {"value": 0, "mod": [{"src": "rand", "amount": 0.3}]}}, "play": {"vel_sens": 0.4}}, "pan": -0.05}, "oh": {"patch": {"synth": {"layers": ["white", "square fixed=566 level=-18dB", "square fixed=829 level=-18dB"], "pitch": {"value": 0, "mod": [{"src": "rand", "amount": 0.4}]}, "filters": [{"kind": "hp", "cutoff": "6k", "q": 0.7}, {"kind": "lp", "cutoff": {"value": "6.5k", "mod": [{"src": "vel", "amount": 0.9}]}}], "amp": {"a": "1ms", "d": "260ms", "s": 0.3, "r": "35ms", "curve": 4}}, "play": {"vel_sens": 0.6, "gate": 1.0, "release": {"patch": {"synth": {"layers": [{"type": "noise"}, "square fixed=566 level=-20dB", "square fixed=829 level=-20dB"], "filters": ["hp cutoff=4k", {"kind": "lp", "cutoff": "7k"}], "amp": {"a": "0.5ms", "d": "22ms", "s": 0, "r": "8ms", "curve": 4}}, "play": {"vel_sens": 0.5}}, "gain": "-4dB", "len": "40ms"}}}}}
