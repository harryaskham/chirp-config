about: "obZen-era Meshuggah rhythm rig (left of a quad-trackable pair; pair with m8-obzen-r): the m8-chug-l player and chain, re-voiced against Bleed's palm-muted Eb2 sixteenths (guitar stem, separation-corrected with tools/tonecmp.py). Keeps the palm-mute thump (amp tight 80 Hz, +7 dB below 120 Hz), a brighter palm mute, a hard-pick pitch glide (the slack low string settles from 0.4 semitones sharp over 80 ms — it broadens the upper harmonics that made the chug read as a clean saw), +4 dB bite at 3.3 kHz and a −12 dB fizz shelf above 5 kHz. Picked at 1/7 of the string (0.143): the 7th/14th harmonics (C# over Eb2) cancel and the octaves come through, as on the record — likeness chroma +5..+10 in every heavy section, +1.6 on Bleed. Quad-track: two tracks per side, ±1 and ±0.85."
extends: "m8 layers.0.pick=0.143 layers.0.pickup=0.085 layers.0.click=0.2 layers.0.scrape=0.12 layers.0.thump=expr.pm*0.7 layers.0.squeak=expr.move*0.6 synth.layers.0.bright.mod.0.amount=-0.2 synth.pitch.mod.0.amount=0.4 synth.env.bite.d=80ms"
fx:
  - {type: sympathetic, decay: 1.2s, mix: 0.06}
  - {type: compressor, threshold: -20dB, ratio: 4, attack: 2ms, release: 60ms, makeup: 3dB}
  - {type: amp, model: mark, gain: 0.86, ts: 0.75, tight: 80, boost: 6dB, bass: 0.5, mid: 0.66, treble: 0.5, presence: 0.5, resonance: 0.72, sag: 0.15, bloom: 0.35}
  - {type: ir, file: jester/cookie-monster, blend_file: jester/kitten-slayer, blend: 0.3, length: 120ms, breakup: 0.3, room: 0.12}
  - {type: eq, bands: ["peak cutoff=110 q=1.1 gain=2dB", "peak cutoff=250 q=1.2 gain=-2.5dB", "peak cutoff=3300 q=1.2 gain=-2.5dB", "highshelf cutoff=7500 gain=-3dB", "lowshelf cutoff=120 gain=7dB", "peak cutoff=3300 q=1 gain=4dB", "highshelf cutoff=5000 gain=-12dB"]}
  - {type: gate, threshold: -48dB, attack: 0.3ms, hold: 8ms, release: 25ms}
  - "reverb kind=plate decay=0.9s mix=0.1 predelay=10ms"   # a touch more plate than the chug rigs: dry −0.3, 0.1 +0.2 on Bleed
gain: -23dB
