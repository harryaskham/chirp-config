about: "Right rhythm rig for double-tracked heavy riffs: a different player and rig from m8-rhythm-l — pick nearer the neck, other pickup/coil and string stiffness, Gojira-voiced amp, darth-genocider/cookie-monster cab blend, its own fizz dip, short plate. Give the right track its own seed and ~9 ms humanize."
extends: "m8 layers.0.pick=0.095 layers.0.pickup=0.1 layers.0.coil=0.36 layers.0.stiff=0.29 layers.0.click=0.2 layers.0.scrape=0.12 layers.0.thump=expr.pm*0.7"
fx:
  - {type: amp, model: gojira, gain: 0.78, ts: 0.5, tight: 105, boost: 4dB, bass: 0.58, mid: 0.58, treble: 0.5, presence: 0.48, resonance: 0.68, sag: 0.28, bloom: 0.35}
  - {type: ir, file: jester/darth-genocider, blend_file: jester/cookie-monster, blend: 0.3, length: 120ms, breakup: 0.3, room: 0.12}
  - {type: eq, bands: ["peak cutoff=230 q=1.2 gain=-2dB", "peak cutoff=2900 q=1.2 gain=-2.5dB", "highshelf cutoff=7000 gain=-3dB"]}
  - {type: gate, threshold: -52dB, attack: 0.5ms, hold: 20ms, release: 45ms}
  - "reverb kind=plate decay=1.1s mix=0.08 predelay=18ms"
gain: -22dB
play: {humanize: {time: 9ms, vel: 0.09}}
