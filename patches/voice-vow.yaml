about: "The built-in solo `voice` with its vowel on the absolute expr.vow axis (u 0 - o 0.25 - a 0.5 - e 0.75 - i 1) that tools/stemvowels.py writes per note from the reference vocal (`C4/1b^vow=0.32`); consonants ^on/^off as in `voice` (stemconsonants.py). The built-in `voice` takes one-hot ^u/^o/^e/^i marks instead, so stemvowels' ^vow had no effect on it. Unmarked notes sing u. Micro: life-in-a-glasshouse-vocals-252 (stem notes split at syllable onsets, stemvowels) 42.88 -> 45.74 4-seed, every seed up (chirper-three, 25 Oct 2026)."
extends: 'voice synth.layers.0.vowel={"value":0,"mod":[{"src":"expr.vow","amount":1}]}'
