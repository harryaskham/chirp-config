about: >-
  obZen-era Meshuggah kit (extends metal-kit): the same tight, bright, triggered-sounding pieces, imaged like a
  recorded kit — hats, crashes, china, ride and toms panned from the drummer's perspective (as room-kit), with
  metal-kit's own tone chain kept. Bleed's reference has wide cymbals: side/mid 0.6 in the presence and air bands,
  where a centred kit measures 0.04-0.2. Pair with a width stage on the track for overhead spread.
extends: metal-kit
