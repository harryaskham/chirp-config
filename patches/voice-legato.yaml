about: "A legato singing voice (wM, Accretion voice climb): `voice` with `join` (touching notes are one breath: the glottis and tract carry on, the formants glide from syllable to syllable, the vibrato runs on unbroken), a soft `inhale` before each phrase, a wandering vibrato (`wander: 0.7`) and S-shaped 110 ms slides (`glide_smooth`). Sing phonemes per note (`^ph=`) with the notes touching inside a phrase, and leave a rest before each phrase for its breath. Needs the voice engine with join/inhale/wander."
extends: "voice synth.layers.0.join=true synth.layers.0.inhale=0.4 synth.lfo.vib.wander=0.7 play.glide=110ms play.glide_smooth=true"
