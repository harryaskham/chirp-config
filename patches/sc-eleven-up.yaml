 "about": "Tabla: the tuned dayan treble drum and the wrist-bent bayan bass, with the classic bols as pieces. The dayan is tuned to D4 and its black syahi patch makes the overtones ring in tune; retune with `kit.na.pitch=C#4` etc. Pieces: na (rim, bright ring), tin (ringing open), tun (open centre, deep), te / re (closed slaps), ge (open bass), gem (ge with a wrist slide up), ke (flat bass slap), dha (na+ge), dhin (tin+ge). Teental: `len=/8 dha dhin dhin dha dha dhin dhin dha dha tin tin na na dhin dhin dha`; tirakita: `te/16 re ke te`. BANKED by tools/patchbank.py (22 Nov 2026) from Slow Enough to Count v29 (track eleven): every extends and override resolved, so it stands by itself.",
