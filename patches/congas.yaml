about: "Congas and bongos: o open conga, lo low tumba, sl slap, mu muted tone, bh / bl high / low bongo. Latin, Balearic, house percussion."
play: {len: /16, vel_sens: 0.6, humanize: {time: 5ms, vel: 0.08}}
gain: 0dB
fx: ["reverb kind=room decay=0.7s mix=0.12"]
kit:
  o:
    pitch: A3
    patch:
      synth:
        layers: [sine, {wave: sine, ratio: 1.5, level: -12dB}, {type: noise, color: pink, level: {value: -60dB, mod: [{src: env.h, amount: 40}]}}]
        env:
          p: {a: 0.3ms, d: 30ms, s: 0}
          h: {a: 0.3ms, d: 12ms, s: 0}
        pitch: {value: 0, mod: [{src: env.p, amount: 1.5}, {src: rand, amount: 0.15}]}
        filters: ["lp cutoff=3k"]
        amp: {a: 0.3ms, d: 280ms, s: 0, r: 30ms, curve: 4}
  lo:
    pitch: D3
    patch:
      synth:
        layers: [sine, {type: noise, color: pink, level: {value: -60dB, mod: [{src: env.h, amount: 38}]}}]
        env:
          p: {a: 0.3ms, d: 35ms, s: 0}
          h: {a: 0.3ms, d: 12ms, s: 0}
        pitch: {value: 0, mod: [{src: env.p, amount: 1.5}]}
        filters: ["lp cutoff=2.5k"]
        amp: {a: 0.3ms, d: 340ms, s: 0, r: 30ms, curve: 4}
  sl:
    pitch: C4
    gain: -2dB
    patch:
      synth:
        layers: [{wave: sine, level: -10dB}, {type: noise, level: {value: -36dB, mod: [{src: env.s, amount: 32}]}}]
        env:
          s: {a: 0.2ms, d: 25ms, s: 0}
        filters: ["hp cutoff=600", "peak cutoff=2.8k q=1.4 gain=5dB"]
        amp: {a: 0.2ms, d: 80ms, s: 0, r: 15ms, curve: 4}
  mu:
    pitch: G3
    gain: -4dB
    patch:
      synth:
        layers: [sine, {type: noise, level: {value: -60dB, mod: [{src: env.h, amount: 36}]}}]
        env:
          h: {a: 0.3ms, d: 8ms, s: 0}
        filters: ["lp cutoff=2k"]
        amp: {a: 0.3ms, d: 60ms, s: 0, r: 15ms, curve: 4}
  bh:
    pitch: F4
    gain: -3dB
    patch:
      synth:
        layers: [sine, {type: noise, level: {value: -60dB, mod: [{src: env.h, amount: 38}]}}]
        env:
          p: {a: 0.3ms, d: 15ms, s: 0}
          h: {a: 0.3ms, d: 8ms, s: 0}
        pitch: {value: 0, mod: [{src: env.p, amount: 1.2}]}
        amp: {a: 0.3ms, d: 140ms, s: 0, r: 20ms, curve: 4}
  bl:
    pitch: C4
    gain: -3dB
    patch:
      synth:
        layers: [sine, {type: noise, level: {value: -60dB, mod: [{src: env.h, amount: 38}]}}]
        env:
          p: {a: 0.3ms, d: 18ms, s: 0}
          h: {a: 0.3ms, d: 8ms, s: 0}
        pitch: {value: 0, mod: [{src: env.p, amount: 1.2}]}
        amp: {a: 0.3ms, d: 170ms, s: 0, r: 20ms, curve: 4}
