about: "Dry, dark, close-miked clean electric for riffs and rhythm parts recorded in a dead room: the baritone string model through a light compressor, a Twin barely breaking up, a 4x12 miked off-axis, the top shelved 18 dB down above 1.5 kHz, and a small, narrow room. No chorus or delay: pan it. Fitted jointly on i-might-be-wrong-guitar-233 (33.8 -> ~42.5) and thin-thing-guitar-2 (24.6 -> ~31.3), 2-seed search (chirper-three, 25 Oct 2026)."
extends: baritone
fx:
  - {type: compressor, attack: 4ms, release: 120ms, ratio: 2.5, threshold: -24dB, makeup: 4dB}
  - {type: amp, model: twin, gain: 0.3, bass: 0.6, mid: 0.55, treble: 0.15, presence: 0.35, sag: 0.15, resonance: 0.5, tight: 70}
  - {type: cab, model: 4x12, mic: 0.55, distance: 0.15}
  - {type: eq, bands: [{kind: highshelf, cutoff: 1500, gain: -18dB, q: 0.7}]}
  - {type: reverb, kind: room, decay: 0.6s, mix: 0.1, width: 0.3}
