{
 "about": "Common Time wall rig, left of a pair (chirper-zero, 12 Nov; pair with ct-wall-r): for open chords and slow riffs that are left to ring, where ct-chug is for tight palm-muted riffs. The same 8-string with a stiffer, more beating string (stiff 0.45, planes 0.4), a slower pitch settle, more sympathetic ring; a Rectifier-style amp on the white-box parts (modern voicing, the recto tone stack, triode stages, a push-pull power amp in only 8 dB of feedback, so it follows the speaker: looser and bigger at the bottom), more sag and bloom, the input high-pass down at 65 Hz; a thicker cab pair with more room and speaker breakup; a slow gate; a longer plate. A tone choice, not a fitted one: there is no bench for ringing chords. Measured only against ct-chug on the same chords (level matched; where its energy sits).",
