about: 'Risset''s bell (wM, chirpers8): the additive bell of Jean-Claude Risset''s 1969 catalogue of computer-synthesised sounds. Eleven inharmonic partials, two beating pairs a hertz or so apart, and every partial dying at its own rate, the high ones first, so the strike''s brightness melts into a long low hum.'
