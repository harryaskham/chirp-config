about: "Modern metal bass, DI + amp sim: the picked bass string model blended with a gently driven amp (amp mix 0.4 → mostly clean DI) into a 4x10 cab; low shelf for weight, 3–6 kHz fizz tamed, compressed. Sits under rhythm guitars without fizz. Same expr.pm / ^dead articulations as m8-bass."
