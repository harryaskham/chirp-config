  - {type: cab, model: 4x10, mic: 0.35, distance: 0.1}
  - {type: eq, bands: ["lowshelf cutoff=100 gain=2dB", "peak cutoff=700 q=1 gain=1.5dB", "peak cutoff=3200 q=1 gain=-4dB", "highshelf cutoff=5000 gain=-6dB"]}
  - {type: compressor, threshold: -22dB, ratio: 4, attack: 8ms, release: 120ms, makeup: 2dB}
