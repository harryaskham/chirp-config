about: 'FOF bass chant (wM, chirpers8): the CHANT bass voice moving slowly between "o" and "u" on an LFO, with rounder grains (6 ms attack). Low drones and plainsong.'
synth:
  layers:
    - type: fof
      fof:
        voice: bass
        vowel: o>u
        attack: 6
        morph:
          value: 0.5
          mod:
            - src: lfo.mouth
              amount: 0.5
  lfo:
    mouth:
      wave: sine
      rate: 0.12hz
    vib:
      wave: sine
      rate: 4.8hz
  pitch:
    value: 0
    mod:
      - src: lfo.vib
        amount: 0.12
  amp:
    a: 250ms
    d: 0
    s: 1
    r: 600ms
gain: 10.2dB
