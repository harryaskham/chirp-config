about: 'Risset''s harmonic arpeggio (wM, chirpers8): five copies of a ten-harmonic tone, each a hair apart (about 0.1 Hz at A2). The copies beat, harmonic k k times as fast as the first, so a held note plays a slow arpeggio across its own overtones, as in Risset''s Mutations (1969). Hold notes for many seconds.'
