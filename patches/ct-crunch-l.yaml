{
 "about": "Common Time crunch rig, left of a pair (chirper-zero, 12 Nov; pair with ct-crunch-r): A DIFFERENT GUITAR INTO A DIFFERENT KIND OF AMP, the low-gain one that answers the pick (Harry: \"lots of different guitars ... amps and string variants for DI\"; chirp-eco's `showcase.py --diff` showed ct-bite was ct-chug's guitar through another amp). THE STRING: a single coil at the bridge (pickup 0.06, no second coil, its resonance at 5.2 kHz where the humbucker's is 3.2), a thin pick near the bridge (pick 0.09, pick_hard 0.25). THE AMP: the `crunch` voicing through the JCM800 tone stack (`stack: marshall`, mid full up) on triode stages with 8 dB of feedback, at gain 0.13, no screamer, no compressor in front; the engine's 4x12; a mid lift after it (700 Hz +7 dB). WHY 0.13: measured on open Ab1, a soft stroke (vel 0.35) against a hard one (1.0) differs by 5.8 dB at gain 0.05, 4.0 at 0.12, 1.9 at 0.2, 0.5 at 0.3 and 0.0 at 0.5; ct-chug gives 0.1. So at 0.13 the playing's dynamics come through the amp (about 4 dB), and from 0.3 up this amp is as saturated as the high-gain rigs. Write the part with dynamics. THE VOICING was set at gain 0.5 against Tool's Pneuma (the record's guitar stem, tools/riffpunch.py's measures, two 30 s windows): 400 Hz-1 kHz against 1-4 kHz went from -13 (the first try; the record -3.6 and -5.1) to -5.1 and -4.6. At 0.13 it is not Pneuma's saturated tone and is not meant to be. Alone on a muted low riff, level-matched, against ct-chug: 5-8 dB less under 160 Hz, 6 dB less at 800 Hz, 4 dB more at 1.6 kHz. Still off, as on every rig here and on Pneuma as on Bleed: the low end of a note (100-250 Hz) falls 2-7 dB in its first 80 ms where the records' holds.",
