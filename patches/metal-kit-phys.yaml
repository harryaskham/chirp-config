  s: {"patch": {"synth": {"layers": [{"type": "drum", "beater": "stick", "contact": 0.6, "decay": "0.4s", "sharp": 30, "reso": 1.5, "cavity": 0.3, "reso_level": 0.5, "shell": 0.3, "shell_hz": 500, "wires": 0.85, "gap": 0.1, "wire_tone": "7k", "strike": 0.3, "damp": 0.3, "slap": 1.2}], "filters": ["hp cutoff=150"], "amp": {"a": "0.1ms", "d": "500ms", "s": 0, "r": "30ms"}, "drive": 0.2}, "play": {"vel_sens": 0.65}}}
