about: >
  metal-kit-dry with chirper-two's physical kick and snare (chirp `type: drum`, bd-7d117e; opt-in, not a default).
  Realism round 28 Oct: against the record drum stems (tools/drumpunch.py, 30-90 s of bleed, combustion, electric-red,
  obzen, dancers, the-abysmal-eye) mean 58.3 -> 61.2 (snare 50.6 -> 59.6: longer ring, body and wires; kick 66.1 -> 62.8);
  in context on broken-cog-drums-0/328 55.2 -> 60.1 and 51.9 -> 53.2. Holdouts NOT held: phantoms-253 -1.7 (seeds 0/11),
  pineal-281 -0.4, rasputin-0 +2.4 (applied to its kit). Kick: plastic beater, coupled heads, short body; snare: stick,
  resonant head 1.5x, shell, wires through a 0.1 gap. Cymbals, hats and toms are metal-kit-dry's.
extends: metal-kit-dry
