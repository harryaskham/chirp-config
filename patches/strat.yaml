about: "Strat-style single-coil clean (middle pickup): glassy pickup resonance, compressor pedal, Twin-style amp into a 2×12, a touch of chorus and spring reverb. Positions: strat-neck, strat-quack (middle+neck), strat-bridge, strat-crunch. Techniques: `^h` hammer-on, `^nh=N` harmonics, `^dead` scratches, `expr.pm` mutes, chord symbols strum."
synth:
  layers:
    - name: string
      type: pluck
      pick: 0.12
      pickup: 0.19
      pickup_hz: 5800
      pickup_q: 2.6
      stiff: 0.08
      choke: 80ms
      fret: 0.18
      pinch: {value: 0, mod: [{src: expr.nh, amount: 1}, {src: expr.ph, amount: 1}]}
      node: {value: 0, mod: [{src: expr.nh, amount: 1}]}
      polarity: {value: 1, mod: [{src: expr.up, amount: -2}]}
      decay: {value: 3.8s, mod: [{src: expr.pm, amount: -3.4}, {src: expr.dead, amount: -3.75}, {src: vel, amount: 0.4}]}
      bright: {value: 0.78, mod: [{src: vel, amount: 0.18}, {src: expr.pm, amount: -0.35}, {src: expr.h, amount: -0.12}, {src: rand, amount: 0.04}]}
      level: {value: 0dB, mod: [{src: expr.dead, amount: -8}, {src: expr.h, amount: -2}]}
    - name: pick
      type: noise
      level: {value: -60dB, mod: [{src: env.pick, amount: 40}, {src: vel, amount: 8}, {src: expr.h, amount: -20}, {src: expr.dead, amount: 6}]}
  env:
    pick: {a: 0.1ms, d: 5ms, s: 0}
  filters: ["hp cutoff=80"]
  amp: {a: 1ms, s: 1, r: 120ms}
play:
  voicing: guitar
  tuning: E2 A2 D3 G3 B3 E4
  frets: 22
  strum: 10ms
  gate: 0.95
  humanize: {time: 4ms, vel: 0.07}
  vel_sens: 0.5
fx:
  - {type: compressor, threshold: -24dB, ratio: 4, attack: 4ms, release: 120ms, makeup: 4dB}
  - {type: amp, model: twin, gain: 0.4, tight: 70, bass: 0.45, mid: 0.45, treble: 0.62, presence: 0.6, resonance: 0.5, sag: 0.12}
  - {type: cab, model: 2x12, mic: 0.3, distance: 0.15}
  - chorus mix=0.12
  - "reverb kind=spring decay=2.2s mix=0.22"
gain: -4dB
