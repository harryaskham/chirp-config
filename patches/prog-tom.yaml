about: "Tuned rack/floor tom — two-mode membrane (1 : 1.59 : 2.14 with faster upper decay), pitch drop on the attack, stick click; harder hits are brighter and bend further."
synth:
  layers:
    - {name: head, wave: sine}
    - {name: modes, type: additive, partials: [[1.59, 0.5], [2.14, 0.3], [2.65, 0.15]], damp: 6, level: {value: -10dB, mod: [{src: vel, amount: 6}]}}
    - {name: stick, type: noise, level: {value: -66dB, mod: [{src: env.att, amount: 56}, {src: vel, amount: 8}]}}
  pitch: {value: 0, mod: [{src: env.p, amount: 2.5}, {src: vel, amount: 1}, {src: rand, amount: 0.2}]}
  env:
    p: {a: 0.3ms, d: 140ms, s: 0, curve: 3}
    att: {a: 0.1ms, d: 6ms, s: 0}
  filters: ["hp cutoff=50", "peak cutoff=3k q=1 gain=2dB"]
  amp: {a: 0.3ms, d: 700ms, s: 0, r: 60ms, curve: 4}
  drive: 0.1
play: {vel_sens: 0.55}
