about: Fluid, saturated legato lead (Thordendal-ish) with delayed vibrato, ping-pong delay and a big room.
synth:
  layers: [saw, "square cents=-6 level=-6dB", "sine ratio=0.5 level=-10dB"]
  pitch: {value: 0, mod: [{src: lfo.vib, amount: 0.3}]}
  lfo:
    vib: {wave: sine, rate: 6hz, delay: 200ms, fade: 300ms, retrig: true}
  filters:
    - {kind: lp, cutoff: {value: 2.8k, mod: [{src: env.f, amount: 1}]}, q: 1.4}
  env:
    f: {a: 5ms, d: 400ms, s: 0.4}
  amp: {a: 8ms, s: 1, r: 150ms}
play: {legato: true, glide: 45ms}
fx:
  - {type: drive, drive: 0.5, bias: 0.1}
  - "delay time=3/16 mix=0.25 feedback=0.4 ping_pong=true tone=3k"
  - "reverb mix=0.3 size=0.85"
gain: -16dB
