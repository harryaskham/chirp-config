about: "The concert grand as it sounds on records: the built-in piano with its top rolled off (-12 dB shelf above 2.5 kHz), a medium plate (2.4 s, mix 0.35) and a wide spaced-pair image (width 2 above 150 Hz). Fitted jointly on two training clips (pyramid-song-piano-0, clair-de-lune-piano-101: mean 46.9 -> 52.9, both up) and validated untouched on the piano holdouts (clair-de-lune-piano-164 36.9 -> 46.2 on every seed; daydreaming-piano-11 31.3 -> 32.1). Candidate for the `piano` default (needs a crossclimb). chirper-three, 25 Oct 2026."
extends: piano
fx:
  - {type: eq, bands: [{kind: highshelf, cutoff: 2500, gain: -12dB, q: 0.7}]}
  - {type: reverb, kind: plate, decay: 2.4s, mix: 0.35, predelay: 18ms}
  - {type: width, width: 2.0, mono_below: 150}
