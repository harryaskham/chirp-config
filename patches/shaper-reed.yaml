about: 'Waveshaping reed (wM, chirpers8): odd Chebyshev harmonics only, the hollow clarinet spectrum of the 1979 papers. The drive rises slowly and a light vibrato moves it, so the tone opens as it is held.'
synth:
  layers:
    - type: shaper
      shaper:
        harmonics: [1, 0, 0.55, 0, 0.3, 0, 0.16, 0, 0.08]
        index:
          value: 0.3
          mod:
            - src: env.breath
              amount: 0.5
            - src: lfo.vib
              amount: 0.05
  env:
    breath:
      a: 400ms
      d: 0
      s: 1
      r: 100ms
  lfo:
    vib:
      wave: sine
      rate: 5hz
  pitch:
    value: 0
    mod:
      - src: lfo.vib
        amount: 0.08
  amp:
    a: 50ms
    d: 0
    s: 1
    r: 120ms
gain: -5.1dB
