about: "kidman with its words made readable (chirper-zero, Common Time v18, 13 Nov; promoted by chirp-eco): the same barked voice with sung diction 2 and speech 1 on its layer. A recogniser (small.en, the voice alone, loudness-normalised) read 26-28 of a 35-word lyric from it against 16 from kidman as it stands, and tools/voxprofile.py says the scream is the same scream (hnr -0.9 against -1.6, subharmonics -5.4 against -3.7, tilt -5.6 against -5.9). Words as phonemes on the notes (ph). Level and tone against records' voices: tools/voxref.py (kidman sat 2.4 dB too loud and 4.7 dB heavy at 250-500 Hz behind a 300 Hz high-pass in Common Time; set them in the song)."
extends: "kidman synth.layers.0.diction=2 synth.layers.0.speech=1"
