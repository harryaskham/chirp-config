about: "Tenor saxophone: a reedy, breathy formant-shaped tone with a breath-noise onset, delayed vibrato and legato glides; harder notes add grit and growl. Jazz ballads, doom jazz, UK jazz leads."
synth:
  layers:
    - {wave: saw, level: -3dB}
    - {wave: pulse, width: 0.25, level: -10dB}
    - {type: noise, color: pink, level: {value: -40dB, mod: [{src: env.breath, amount: 18}]}}
  env:
    breath: {a: 8ms, d: 140ms, s: 0.22, r: 120ms}
    bright: {a: 40ms, d: 400ms, s: 0.7, r: 150ms}
  lfo:
    vib: {wave: sine, rate: 5hz, delay: 450ms, fade: 500ms, retrig: true}
  pitch: {value: 0, mod: [{src: lfo.vib, amount: 0.14}, {src: rand, amount: 0.04}]}
  filters:
    - "hp cutoff=110"
    - {kind: lp, cutoff: {value: 1800, mod: [{src: env.bright, amount: 1.0}, {src: vel, amount: 1.2}]}, q: 0.9}
    - "peak cutoff=550 q=1.4 gain=5dB"
    - "peak cutoff=1500 q=1.8 gain=4dB"
    - "peak cutoff=2600 q=2 gain=2dB"
  amp: {a: 35ms, d: 250ms, s: 0.85, r: 160ms}
  drive: {value: 0.1, mod: [{src: vel, amount: 0.4}]}
play: {mono: true, legato: true, glide: 40ms, gate: 0.97, vel_sens: 0.6, humanize: {time: 10ms, vel: 0.06}}
fx: ["reverb kind=room decay=1.4s mix=0.16 predelay=12ms"]
gain: -9dB
