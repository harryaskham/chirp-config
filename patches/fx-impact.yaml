about: "Impact for downbeats: sub boom with a pitch drop, a noise burst and a long hall tail. Play a low note (F1)."
synth:
  layers:
    - sine
    - {type: noise, level: {value: -60dB, mod: [{src: env.b, amount: 56}]}}
    - {type: noise, color: brown, level: {value: -40dB, mod: [{src: env.b, amount: 34}]}}
  env:
    p: {a: 0.5ms, d: 400ms, s: 0}
    b: {a: 0.5ms, d: 120ms, s: 0}
  pitch: {value: 0, mod: [{src: env.p, amount: 14}]}
  filters: ["lp cutoff=6k"]
  amp: {a: 0.5ms, d: 2.2s, s: 0, r: 300ms, curve: 4}
  drive: 0.3
fx: ["reverb kind=hall decay=4.5s mix=0.38 predelay=20ms"]
gain: -10dB
