about: "Nylon-string guitar (Polyphia / Tim Henson style): warm fingerpicked string with body resonance and a piezo quack, compression, light chorus and room. Standard tuning; `^nh=2` natural harmonic (12th fret; 3 = 7th, 4 = 5th), `^dead` ghost tap, `expr.pm` thumb-muted, `^h` hammer-on/legato."
synth:
  layers:
    - name: string
      type: pluck
      pick: 0.18
      stiff: 0.06
      body: 0.35
      choke: 90ms
      fret: 0.15
      pinch: {value: 0, mod: [{src: expr.nh, amount: 1}, {src: expr.ph, amount: 1}]}
      node: {value: 0, mod: [{src: expr.nh, amount: 1}]}
      polarity: {value: 1, mod: [{src: expr.up, amount: -2}]}
      decay: {value: 3.2s, mod: [{src: expr.pm, amount: -2.9}, {src: expr.dead, amount: -3.15}, {src: vel, amount: 0.4}]}
      bright: {value: 0.55, mod: [{src: vel, amount: 0.25}, {src: expr.pm, amount: -0.3}, {src: expr.h, amount: -0.15}, {src: rand, amount: 0.04}]}
      level: {value: 0dB, mod: [{src: expr.dead, amount: -6}, {src: expr.h, amount: -2}, {src: expr.nh, amount: 2}]}
    - name: finger
      type: noise
      level: {value: -60dB, mod: [{src: env.f, amount: 38}, {src: vel, amount: 8}, {src: expr.h, amount: -20}]}
  env:
    f: {a: 0.3ms, d: 9ms, s: 0}
  filters:
    - "hp cutoff=80"
    - "peak cutoff=210 q=1.3 gain=3dB"
    - "peak cutoff=1.6k q=1.1 gain=4dB"
    - "lp cutoff=9k q=0.6"
  amp: {a: 1ms, s: 1, r: 120ms}
play:
  voicing: guitar
  tuning: E2 A2 D3 G3 B3 E4
  frets: 19
  strum: 12ms
  gate: 0.95
  humanize: {time: 5ms, vel: 0.08}
  vel_sens: 0.5
fx:
  - {type: compressor, threshold: -20dB, ratio: 3.5, attack: 4ms, release: 120ms, makeup: 3dB}
  - chorus mix=0.18
  - "reverb kind=room decay=1s mix=0.12"
gain: 1dB
