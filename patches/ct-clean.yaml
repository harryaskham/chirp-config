{
 "about": "Common Time clean guitar (chirper-zero, 12 Nov): m8-clean's ringing string given a guitar's direct signal. The string moves in two planes a cent and a half apart (it drops fast, rings on and beats slowly); a neck-position single coil with its resonance at 6 kHz (so, like a real pickup, little above it), an aperture and a little magnetic nonlinearity; a soft compressor; a Twin-style clean amp blended half and half with the direct signal, no cabinet (a studio clean); then m8-clean's chorus. No delay or hall of its own (the song sends it). Not fitted to a record. Measured only against m8-clean on the same notes (level matched; where its energy sits): less at 180-700 Hz, more at 0.7-2.8 kHz, about 8 dB less above 5.6 kHz.",
