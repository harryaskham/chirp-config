 "about": "Common Time rhythm rig, left of a pair (chirper-zero, 12 Nov; pair with ct-chug-r). Built on m8-obzen-l with the engine's newer parts: the Mark-voiced preamp on 12AX7 triode stages (triode) into a push-pull power amp inside an 18 dB feedback loop driving a speaker's impedance (nfb: presence and resonance act in the loop), power-tube bloom 0.5; the slack low string settling from 0.8 semitones sharp over 110 ms on a hard pick; more pick scrape, twice the sympathetic ring, less palm knock and a palm mute that lasts twice as long. Measured against two records' guitar stems with the old rig beside it (tools/riffpunch.py; the old m8-obzen pair first): Bleed 0-30 s 41.4 -> 67.0, The Faultless 30-60 s 37.8 -> 69.1 (the separators' own floor is 67-86). The mid scoop and the fizz land on the records' (scoop -11.0 against -11.9 and -6.7 against -6.4; fizz -37 against -37 on Bleed), and the noise between the harmonics, the old rigs' synth-guitar tell, goes from 0.17 to 0.27 / 0.30 against the records' 0.41 / 0.32. Still off: the palm mute's low end dies faster than Bleed's (3.2 dB against 1.2), and tools/guitarbench.py's Bleed target wants 11 dB more at 230-1150 Hz and 9 dB less at 4.2-8.5 kHz than this has (it disagrees with riffpunch about the low mids; not settled).",
