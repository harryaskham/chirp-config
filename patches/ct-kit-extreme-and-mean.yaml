{
 "about": "Common Time kit, dry (chirper-zero, 12 Nov): metal-kit-dry with a physical snare, modal toms and modal cymbals, and no bus effects (route its tracks to a drums bus). SNARE: the engine's `drum` layer (a stick on a batter head coupled to a resonant head 1.5x higher, a shell, wires through a 0.1 gap), tightened to a 0.18 s head and a 140 ms envelope, with +5 dB of body at 200 Hz. Against two records' drum stems (tools/drumpunch.py, 30-90 s of Bleed and The Faultless; the old obzen-kit first, then this snare with the old cymbals): 44.1 -> 58.7 and 47.1 -> 56.8; the snare alone 26 -> 67 and 23 -> 40. It speaks in 4 ms where the old one took 10-12 and is over in 51-58 ms where the old one rang 140-230 (the records': 22 and 12 ms, gated). The Faultless's snare is far fatter than this (its body 14 dB over its crack; this is 1). TOMS: modal-tom (struck membranes) on F3 C3 Ab2 F2 C2. CRASH, CHINA, RIDE: the modal plates (modal-crash on F4, modal-china on C4, modal-ride on Eb4), high-passed at 1.5 / 1.2 / 1.5 kHz and set to the old cymbals' level (-12.5 / -6.5 / -21.5 dB). NOT SETTLED: the same bench reads the kit a little worse with the modal cymbals than with the old additive ones: as set here 56.4 and 55.5 against 58.7 and 56.8, the difference being in how the kick reads under them, not the snare (at carey-kit's levels and without the high-pass their wash filled the snare's band: 42.5 and 54.4). Kept on the physical argument, for an ear to judge. KICK, hats, bell, splash, stack and the rest are metal-kit-dry's (a physical kick and an EQ'd kick both measured no better: 57/59 and 58/68 against 51/73). BANKED by tools/patchbank.py (22 Nov 2026) from Extreme and Mean v36 (tracks kick, snare, toms, cym, hat): every extends and override resolved, so it stands by itself.",
