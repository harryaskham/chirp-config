about: >
  (v2, EQ+drive chain; kept for A/B.)
  Meshuggah-style 8-string (F standard: F1 Bb1 Eb2 Ab2 Db3 Gb3 Bb3 Eb4) into a tight high-gain amp and
  4×12 cab. Dynamic: velocity drives pick attack, brightness and sustain; every note varies slightly.
  Articulations: `expr.pm=1` palm mute (latching; `^pm` for one note) damps and darkens the string;
  `^ph` pinch harmonic squeal; held notes grow vibrato; `^gate=1.2` lets a note ring.
synth:
  layers:
    - name: string
      type: pluck
      pick: 0.11
      decay: {value: 4.5s, mod: [{src: expr.pm, amount: -4.15}, {src: vel, amount: 0.3}]}
      bright: {value: 0.76, mod: [{src: expr.pm, amount: -0.42}, {src: vel, amount: 0.2}, {src: rand, amount: 0.04}]}
      level: {value: 0dB, mod: [{src: expr.ph, amount: -8}]}
    - name: pick
      type: noise
      level: {value: -60dB, mod: [{src: env.pick, amount: 44}, {src: vel, amount: 10}]}
    - name: squeal
      wave: sine
      ratio: 4
      level: {value: -80dB, mod: [{src: expr.ph, amount: 70}]}
  pitch: {value: 0, mod: [{src: env.bite, amount: 0.15}, {src: rand, amount: 0.05}, {src: lfo.vib, amount: 0.2}]}
  env:
    pick: {a: 0.1ms, d: 6ms, s: 0}
    bite: {a: 0.2ms, d: 45ms, s: 0}
  lfo:
    vib: {wave: sine, rate: 5.3hz, delay: 380ms, fade: 450ms, retrig: true}
  filters:
    - {kind: lp, cutoff: {value: 11k, mod: [{src: expr.pm, amount: -3.4}, {src: vel, amount: 0.6}]}, q: 0.6}
  amp: {a: 1ms, s: 1, r: 35ms}
play:
  voicing: guitar
  tuning: F1 Bb1 Eb2 Ab2 Db3 Gb3 Bb3 Eb4
  frets: 24
  strum: 7ms
  gate: 0.88
  humanize: {time: 4ms, vel: 0.07}
  vel_sens: 0.35
fx:
  - type: eq
    bands: ["hp cutoff=110 q=0.7", "peak cutoff=850 q=0.7 gain=8dB", "lp cutoff=7k"]
  - {type: drive, shape: tanh, drive: 0.72, bias: 0.12}
  - type: eq
    bands:
      - "hp cutoff=75 q=0.8"
      - "peak cutoff=110 q=1.2 gain=4dB"
      - "peak cutoff=420 q=1 gain=-5dB"
      - "peak cutoff=1.8k q=1 gain=2dB"
      - "peak cutoff=3.2k q=1.4 gain=3dB"
      - {kind: lp, cutoff: 5.6k, slope: 24, q: 0.7}
  - {type: gate, threshold: -50dB, attack: 0.5ms, hold: 20ms, release: 45ms}
gain: -17dB
