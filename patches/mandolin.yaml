about: "Mandolin: paired steel strings — bright, quick-decaying and a little chorused from the doubled courses. Play tremolo as fast repeated 32nds; Italian/folk melodies, waltzes."
synth:
  layers:
    - {type: pluck, pick: 0.12, body: 0.3, decay: 0.9s, bright: 0.7}
    - {type: pluck, pick: 0.14, body: 0.3, decay: 0.9s, bright: 0.65, cents: 6, level: -3dB}
  filters: ["hp cutoff=200", "peak cutoff=2.5k q=1 gain=3dB", "lp cutoff=9k"]
play: {gate: 1, vel_sens: 0.6, humanize: {time: 4ms, vel: 0.08}}
fx: ["reverb kind=room decay=1s mix=0.16"]
gain: 0dB
