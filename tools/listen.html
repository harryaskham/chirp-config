<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>chirpers - studio</title><link rel=icon href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%23e8c27a'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d12;--panel:#12151d;--panel2:#171b26;--line:#262b38;--amber:#e8c27a;--hi:#ffd58a;--dim:#8f98aa;--text:#d6dbe6;
--note:#7fd1c3;--good:#9fe3a0;--bad:#e79a8f;--eng:#b9a3f0;--snap:#8fc3f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--amber);font:14px/1.45 system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:16px;margin:0 6px 0 0;color:var(--hi);white-space:nowrap}h2{font-size:16px;margin:0 0 6px;color:var(--hi)}h3{font-size:13px;margin:16px 0 6px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
select,button,textarea,input{background:var(--panel);color:var(--amber);border:1px solid var(--line);border-radius:5px;font:inherit}
select,button,input{padding:4px 8px}button{cursor:pointer}button:hover{border-color:var(--amber)}textarea{padding:6px;width:100%}
.tabs{display:flex;gap:2px}.tabs button{border-radius:5px 5px 0 0;border-bottom:none;color:var(--dim)}.tabs button.on{color:var(--hi);background:var(--panel2);border-color:var(--amber)}
.views button.on{color:var(--bg);background:var(--amber)}.sp{flex:1}.m{color:var(--dim);font-size:12px}a{color:var(--hi)}
kbd{border:1px solid var(--line);border-radius:3px;padding:0 4px;font-size:11px;color:var(--dim)}
main{display:grid;grid-template-columns:minmax(220px,300px) 1fr;min-height:calc(100vh - 50px)}
main.wide{grid-template-columns:1fr}@media(max-width:760px){main{grid-template-columns:1fr}}
#side{border-right:1px solid var(--line);overflow:auto;max-height:calc(100vh - 50px);position:sticky;top:50px}#pane{padding:12px 18px;min-width:0;max-width:1100px}
.tr{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer}.tr:hover{background:#151a25}.tr.on{background:#1b2130;border-left:3px solid var(--hi)}
.badge{background:#203a36;color:var(--note);border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}.new{color:var(--good);font-size:11px;margin-left:4px}
audio,video{width:100%;max-width:960px;display:block;background:#000;border-radius:4px}
#bar{position:relative;height:18px;max-width:960px;margin:4px 0 10px;background:var(--panel);border-radius:3px;cursor:pointer}
#bar .pos{position:absolute;top:0;bottom:0;width:2px;background:var(--hi)}#bar .mk{position:absolute;top:2px;width:8px;height:14px;margin-left:-4px;background:var(--note);border-radius:2px}
#bar .mk.old{opacity:.35}#bar .seg{position:absolute;top:0;bottom:0;background:rgba(255,213,138,.18);border-left:1px solid var(--hi);border-right:1px solid var(--hi)}
.row{display:flex;gap:8px;max-width:960px;align-items:flex-start}.row textarea{flex:1;min-height:38px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 12px;margin:8px 0;max-width:960px;color:var(--text)}
.card.done{opacity:.6}.card .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;color:var(--amber)}.card .hd b{color:var(--hi)}
.who{font-weight:600;color:var(--note)}.who.h{color:var(--hi)}.t{color:var(--note);cursor:pointer;font-weight:600}
.reply{margin:6px 0 0 14px;padding-left:8px;border-left:2px solid var(--line)}.reply .who{font-size:12px}
.pill{border-radius:9px;padding:0 7px;font-size:11px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.pill.kept{color:var(--good);border-color:#355c3a}.pill.refused{color:var(--bad);border-color:#5c3a35}.pill.type{color:var(--amber)}
.delta.up{color:var(--good)}.delta.down{color:var(--bad)}.headline{font-weight:700;color:var(--hi);letter-spacing:.01em}
.body{white-space:pre-wrap;color:var(--text);font-size:13px;margin-top:4px}.more{color:var(--hi);cursor:pointer;font-size:12px}
.day{position:sticky;top:50px;background:var(--bg);padding:8px 0 4px;color:var(--dim);font-weight:600;border-bottom:1px solid var(--line);margin-top:14px;z-index:2}
.ev{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid #191d28}.ev .tm{color:var(--dim);font-size:12px;padding-top:2px}
.ev.eng .what{color:var(--eng)}.ev.snap .what{color:var(--snap)}.ev.sec .what{color:#cdd3df;font-size:13px}.ev.fb .what{color:var(--note)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.chip{border:1px solid var(--line);border-radius:12px;padding:1px 9px;cursor:pointer;font-size:12px;color:var(--dim);background:var(--panel)}
.chip.on{color:var(--bg);background:var(--amber);border-color:var(--amber)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.ver{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:7px;margin:6px 0;background:var(--panel);max-width:960px}
.ver.on{border-color:var(--hi);background:#1b2130}.between{margin:0 0 0 22px;padding:2px 0 2px 12px;border-left:2px dashed var(--line);max-width:940px;font-size:12px;color:var(--dim)}
.between div{margin:2px 0}.between .eng{color:var(--eng)}.compnote{white-space:pre-wrap;color:var(--text);max-width:960px;font-size:13px}
.secw{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid #191d28;max-width:960px}.secw b{color:var(--hi)}
#gate{position:fixed;inset:0;background:rgba(5,6,10,.92);display:flex;align-items:center;justify-content:center;z-index:50}
#gate form{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px;width:min(360px,92vw)}
#gate input{width:100%;margin:6px 0 12px}#gate .err{color:var(--bad);font-size:12px;min-height:16px}
.q{max-width:1040px;scroll-margin-top:96px}.q.ans{border-color:#355c3a}.q.cur{box-shadow:0 0 0 1px var(--hi)}.q .headline{font-size:16px;margin:6px 0 2px}
.cmp{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px;align-items:stretch}
.pl{flex:1 1 280px;min-width:230px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.pl.on{border-color:var(--hi)}.pl .lbl{display:flex;gap:8px;align-items:center;color:var(--text);margin-bottom:5px;cursor:pointer}
.pl .k{display:inline-block;min-width:30px;text-align:center;border-radius:5px;background:var(--amber);color:var(--bg);font-weight:700;padding:3px 0}.pl .lbl:hover .k{background:var(--hi)}
.pl.on .k{background:var(--hi)}.pl audio{width:100%;height:36px;background:transparent;color-scheme:dark}.sync{color:var(--dim);font-size:12px;flex-basis:100%;margin:-2px 0 0}
.qa{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}.qa .chip{font-size:13.5px;padding:5px 13px;color:var(--amber);border-color:#4a4636}
.qa .chip:hover{border-color:var(--amber)}.qa .chip.on{color:var(--bg);background:var(--good);border-color:var(--good);font-weight:600}
.qa .chip .kn{color:var(--dim);font-size:11px;margin-right:5px}.qa .chip.on .kn{color:#24402a}
.qst{font-size:12px;color:var(--dim);margin-top:5px}.qst b{color:var(--good)}.qst .oth{color:var(--note)}
#qbar{position:sticky;top:50px;background:var(--bg);padding:6px 0;z-index:3;border-bottom:1px solid var(--line);margin-bottom:6px}
#qbar .chips{margin:4px 0}.prog{height:4px;background:var(--panel);border-radius:2px;max-width:1040px}.prog i{display:block;height:4px;background:var(--good);border-radius:2px}
.intro{color:var(--text);max-width:960px;font-size:13px}.toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--amber);padding:6px 12px;border-radius:6px;display:none}
</style>
<div id=gate style="display:none"><form id=gateForm><h2>chirpers studio</h2>
<p class=m>Work in progress and past albums by the chirpers. Tell us who you are once; this browser remembers it.</p>
<label class=m>Your name<input id=gName autocomplete=name required maxlength=40></label>
<label class=m>Access code<input id=gCode type=password required></label>
<div class=err id=gErr></div><button type=submit>Enter</button></form></div>
<header><h1>chirpers</h1><div class=tabs id=albums></div>
<div class="tabs views" id=views></div><span class=sp></span>
<span id=hint class=m></span><span class=m id=me></span></header>
<main id=main><div id=side></div><div id=pane></div></main>
<div class=toast id=toast></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=t=>{t=Math.max(0,+t||0);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60);return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");};
const secs=v=>{const p=String(v).trim().split(":").map(Number);return p.some(isNaN)?NaN:p.reduce((a,b)=>a*60+b,0);};
const HUES=["#e8c27a","#7fd1c3","#e79a8f","#9fb7f0","#b9a3f0","#9fe3a0","#f0a3d0","#f0d38f","#8fe0f0","#c9b08f","#a3f0c4","#f0b38f"];
const col=n=>HUES[((n||1)-1)%HUES.length];
const dayOf=s=>new Date(s).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const hhmm=s=>{const d=new Date(s);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600);};
const U=()=>localStorage.getItem("listen_user")||"",CODE=()=>localStorage.getItem("listen_code")||"";
const HUMANS=new Set(["harry"]);
let ALB=[],A,AI,D,W,view="listen",S,N,media,noteT=null,segA=null,segB=null,hist={n:null,i:null,seq:false};
let qf={state:"open",n:0},qcur=null,qlast=null;
const q=()=>Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
function setHash(o){history.replaceState(null,"","#"+new URLSearchParams(Object.entries({a:A,v:view,...o}).filter(([k,v])=>v!==undefined&&v!==null&&v!=="")).toString());}

// ── access ──
function gate(msg){$("#gate").style.display="flex";$("#gName").value=U();$("#gErr").textContent=msg||"";($("#gName").value?$("#gCode"):$("#gName")).focus();}
$("#gateForm").onsubmit=async e=>{e.preventDefault();const name=$("#gName").value.trim(),code=$("#gCode").value.trim();if(!name||!code)return;
 localStorage.setItem("listen_user",name);localStorage.setItem("listen_code",code);
 document.cookie="listen_code="+encodeURIComponent(code)+"; path=/; max-age=31536000; SameSite=Lax";
 const r=await fetch("api/albums",{headers:{"X-Listen-Code":code}});if(r.status===401)return gate("That access code didn't work.");
 $("#gate").style.display="none";boot();};
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),"X-Listen-Code":CODE()}});
 if(r.status===401){gate("Please enter the access code.");throw new Error("401");}return r.json();}
async function post(path,body){return api(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,by:U()})});}

// ── boot, albums, views ──
async function boot(){if(!U()||!CODE())return gate();
 document.cookie="listen_code="+encodeURIComponent(CODE())+"; path=/; max-age=31536000; SameSite=Lax";
 HUMANS.add(U().toLowerCase());$("#me").innerHTML=`as <b>${esc(U())}</b> <a href="#" id=swap>change</a>`;
 $("#swap").onclick=e=>{e.preventDefault();localStorage.removeItem("listen_code");gate();};
 ALB=await api("api/albums");const h=q();
 $("#albums").innerHTML=ALB.map(a=>`<button data-a="${a.id}">${esc(a.title)} <span class=m>${a.status==="released"?"released":"in progress"}</span></button>`).join("");
 $$("#albums button").forEach(b=>b.onclick=()=>openAlbum(b.dataset.a,view));
 await openAlbum(ALB.find(a=>a.id===h.a)?h.a:ALB[0].id,h.v||"listen",h);}
async function openAlbum(id,v,h={}){A=id;AI=ALB.find(a=>a.id===id);W=null;S=null;N=null;
 $$("#albums button").forEach(b=>b.classList.toggle("on",b.dataset.a===id));
 D=await api("api/"+A);D.notes.forEach(n=>HUMANS.add(String(n.by||"harry").toLowerCase()));
 const vs=[["listen","Listen"],["questions","Questions"],["feedback","Feedback"],["worklog","Worklog"],["history","History"]];
 $("#views").innerHTML=vs.map(([k,l])=>`<button data-v="${k}">${l}${k==="questions"?"<span id=qbadge></span>":""}</button>`).join("");qBadge();
 $$("#views button").forEach(b=>b.onclick=()=>show(b.dataset.v));show(v,h);}
async function needW(){if(!W)W=await api(`api/${A}/log`);return W;}
function show(v,h={}){view=v;$$("#views button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));if(media){media.pause();media=null;}$("#hmed")?.pause();
 $("#hint").innerHTML=v==="listen"?"<kbd>space</kbd> play <kbd>N</kbd> note <kbd>&larr;</kbd><kbd>&rarr;</kbd> 5 s <kbd>J</kbd><kbd>K</kbd> track":
  v==="questions"?"<kbd>J</kbd><kbd>K</kbd> question <kbd>A</kbd><kbd>B</kbd> play that side <kbd>space</kbd> pause <kbd>1</kbd>-<kbd>9</kbd> answer":"";
 $("#main").classList.toggle("wide",v==="feedback"||v==="worklog"||v==="questions");$("#side").innerHTML="";$("#pane").innerHTML="<p class=m>Loading&hellip;</p>";
 ({listen:listenView,questions:questionsView,feedback:feedbackView,worklog:worklogView,history:historyView})[v](h);}
const trackOf=n=>(AI.tracks||[]).find(t=>t.n===n)||{};
const fbAuthor=n=>`<span class="who${HUMANS.has(String(n.by||"harry").toLowerCase())?" h":""}">${esc(n.by||"harry")}</span>`;

// ── listen ──
function listenView(h){if(AI.release&&!D.snapshots.length)return releaseView(h);
 if(!D.snapshots.length){$("#pane").innerHTML="<p class=m>No snapshots yet.</p>";return;}
 S=D.snapshots.find(s=>s.id===h.s)||D.snapshots[D.snapshots.length-1];
 $("#side").innerHTML=`<div style="padding:8px 12px;border-bottom:1px solid var(--line)"><select id=snap style="width:100%">${D.snapshots.slice().reverse().map((s,i)=>`<option value="${s.id}">${i?"":"latest: "}${s.id}${s.label?" - "+esc(s.label.slice(0,60)):""}</option>`).join("")}</select>
 <label class=m><input type=checkbox id=cont checked> play on</label></div><div id=tracks></div>`;
 $("#snap").value=S.id;$("#snap").onchange=e=>{S=D.snapshots.find(s=>s.id===e.target.value);pick(N,0,false);};
 pick(+h.n||S.tracks[0].n,+h.t||0,false);}
const notesFor=n=>D.notes.filter(x=>x.n===n&&x.snap!=="release");
function tracksList(){$("#tracks").innerHTML=S.tracks.map(t=>{const c=notesFor(t.n).filter(x=>!x.done).length;
 return `<div class="tr${t.n===N?" on":""}" data-n=${t.n}><b><span class=dot style="background:${col(t.n)}"></span>${t.n}. ${esc(t.title)}</b>${c?`<span class=badge>${c}</span>`:""}${t.changed&&S.prev?"<span class=new>new</span>":""}
 <div class=m>${esc(t.version)} &middot; ${t.score??""} &middot; ${mmss(t.dur||0)} &middot; ${esc(t.owner||"")}</div></div>`}).join("");
 $$(".tr").forEach(e=>e.onclick=()=>pick(+e.dataset.n,0,true));}
function pick(n,t,play){const tr=S.tracks.find(x=>x.n===n)||S.tracks[0];N=tr.n;tracksList();
 const src=`media/${A}/${S.id}/t${String(N).padStart(2,"0")}.${tr.video?"mp4":"mp3"}`;
 $("#pane").innerHTML=`<h2>${N}. ${esc(tr.title)} <span class=m>${esc(tr.version)} &middot; ${tr.score??""} &middot; ${esc(tr.owner||"")} &middot; rendered ${esc((tr.rendered||"").slice(0,16).replace("T"," "))}</span></h2>
 ${tr.video?`<video id=med controls preload=metadata src="${src}"></video>`:`<audio id=med controls preload=metadata src="${src}"></audio>`}
 <div id=bar></div><div class=row><textarea id=noteText placeholder="Note at the playhead (N). Enter saves, Shift+Enter for a new line. It goes to ${esc(tr.owner||"the composer")}."></textarea><button id=save>Note at 0:00</button></div>
 <p class=m><a href="web/${A}/${S.id}/${N}" target=_blank>open live in chirp web &#8599;</a> &middot; <a href="${src}" download>download</a> &middot; <a href="#" id=toHist>how this track developed &rarr;</a></p>
 <div id=nl></div><h3>the composer's note on this version</h3><div class=compnote>${esc(tr.note)}</div>`;
 $("#toHist").onclick=e=>{e.preventDefault();hist.n=N;show("history",{n:N});};
 bindMedia(t,play,()=>(S.tracks.find(x=>x.n===N)||{}).dur);
 media.addEventListener("ended",()=>{if($("#cont")?.checked){const i=S.tracks.findIndex(x=>x.n===N);if(S.tracks[i+1])pick(S.tracks[i+1].n,0,true);}});
 $("#save").onclick=()=>saveNote({snap:S.id,n:N});notesList();setHash({s:S.id,n:N});}
function bindMedia(t,play,durFn){media=$("#med");
 media.addEventListener("loadedmetadata",()=>{if(t)media.currentTime=t;if(play)media.play();bar();},{once:true});
 media.addEventListener("timeupdate",()=>{bar(true);if(noteT===null&&$("#save"))$("#save").textContent="Note at "+mmss(media.currentTime);if(view==="listen"&&AI.release&&!D.snapshots.length)relTick();});
 $("#bar").onclick=e=>{const r=e.currentTarget.getBoundingClientRect();media.currentTime=(e.clientX-r.left)/r.width*(media.duration||durFn()||1);};
 $("#noteText").onfocus=()=>{if(noteT===null){noteT=media.currentTime;$("#save").textContent="Note at "+mmss(noteT);}};
 $("#noteText").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#save").click();}if(e.key==="Escape"){noteT=null;e.target.blur();}};}
function bar(posOnly){const b=$("#bar");if(!b||!media)return;const dur=media.duration||1;
 if(!posOnly){const ns=AI.release&&!D.snapshots.length?D.notes.filter(x=>x.snap==="release"):notesFor(N);const tr=S&&S.tracks.find(x=>x.n===N);
  b.innerHTML=ns.map(x=>`<div class="mk${!tr||x.version===tr.version?"":" old"}" title="${esc(mmss(x.t)+" "+(x.by||"")+": "+x.text)}" style="left:${x.t/dur*100}%"></div>`).join("")+"<div class=pos></div>";}
 const p=b.querySelector(".pos");if(p)p.style.left=(media.currentTime/dur*100)+"%";}
function noteCard(x,{jump=true,cur=null}={}){const tr=trackOf(x.n);
 const where=x.n?`<span class=dot style="background:${col(x.n)}"></span>${x.n}. ${esc(tr.title||x.track||"")}`:"<i>general</i>";
 return `<div class="card${x.done?" done":""}" data-id="${x.id}"><div class=hd>${fbAuthor(x)} <span class=m>on</span> ${where}
 ${x.n||x.snap==="release"?`<span class=t data-s="${esc(x.snap)}" data-n=${x.n} data-t=${x.t}>${mmss(x.t)}</span>`:""}
 <span class=m>${esc(x.version||"")}${cur&&x.version&&x.version!==cur?" (earlier version)":""} &middot; ${esc(dayOf(x.at))} ${hhmm(x.at)}${x.done?" &middot; done":""}</span>
 <span class=sp></span><span class="m x" data-id=${x.id} title="delete" style="cursor:pointer">&times;</span></div>
 <div class=body>${esc(x.text)}</div>${x.replies.map(r=>`<div class=reply>${fbAuthor(r)} <span class=m>${esc(dayOf(r.at||""))} ${r.at?hhmm(r.at):""}</span><div class=body>${esc(r.text)}</div></div>`).join("")}
 <div class=row style="margin-top:6px"><textarea class=rtext rows=1 placeholder="Reply as ${esc(U())}&hellip;"></textarea><button class=rbtn>Reply</button></div></div>`;}
function bindCards(root){root.querySelectorAll(".t").forEach(e=>e.onclick=()=>{const s=e.dataset.s,n=+e.dataset.n,t=+e.dataset.t;
  if(view==="listen"&&media&&((s==="release")||(S&&s===S.id&&n===N))){media.currentTime=t;media.play();return;}
  show("listen",{s,n,t});});
 root.querySelectorAll(".x").forEach(e=>e.onclick=async()=>{if(!confirm("Delete this note?"))return;await post(`api/${A}/notes/${e.dataset.id}/delete`,{});await refresh();});
 root.querySelectorAll(".card").forEach(c=>{const b=c.querySelector(".rbtn"),ta=c.querySelector(".rtext");if(!b)return;
  b.onclick=async()=>{const text=ta.value.trim();if(!text)return;await post(`api/${A}/notes/${c.dataset.id}/reply`,{text});toast("reply saved");await refresh();};
  ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();b.click();}};});}
function notesList(){const el=$("#nl");if(!el)return;const tr=S&&S.tracks.find(x=>x.n===N);
 const ns=(AI.release&&!D.snapshots.length?D.notes.filter(x=>x.snap==="release"&&x.n===N):notesFor(N)).slice().reverse();
 el.innerHTML=ns.length?ns.map(x=>noteCard(x,{cur:tr&&tr.version})).join(""):"<p class=m>No notes on this track yet.</p>";bindCards(el);bar();}

  if(c.length>=6&&/[A-Z]{3}/.test(c)&&!LABELS.test(c)&&!(c.includes(",")&&c.split(/[ ,]+/).every(w=>w.length<=4)))return c;}

async function historyView(h){const w=await needW();const ts=(AI.tracks||[]);hist.n=+h.n||hist.n||(ts[0]||{}).n;
 $("#side").innerHTML=`<div id=tracks></div>`;
 $("#tracks").innerHTML=ts.map(t=>`<div class="tr${t.n===hist.n?" on":""}" data-n=${t.n}><b><span class=dot style="background:${col(t.n)}"></span>${t.n}. ${esc(t.title)}</b><div class=m>${esc(t.owner||"")} &middot; ${t.rounds??""} rounds &middot; now ${esc(t.version||"")}</div></div>`).join("");
 $$("#tracks .tr").forEach(e=>e.onclick=()=>{hist.n=+e.dataset.n;historyView({n:hist.n});});
 const t=w.tracks.find(x=>x.n===hist.n);setHash({n:hist.n});
 if(!D.snapshots.length){const rs=t?t.log:[];
  $("#pane").innerHTML=`<h2>${esc(t?.title||"")} <span class=m>how it developed</span></h2><p class=intro>Only the released render of ${esc(AI.title)} exists, so there is nothing to A/B here; this is the track's whole climb, round by round (the full notes are in Worklog).</p>
  ${rs.map(r=>`<div class=between style="border-left-color:${r.kept?"#355c3a":"#5c3a35"}"><b style="color:var(--hi)">${esc(r.version||"")}</b> <span class=m>${esc(dayOf(r.at))} ${hhmm(r.at)} &middot; ${r.score??""} &middot; ${r.kept?"kept":"refused"}</span> ${esc(headline(r.note))}</div>`).join("")}`;return;}
 const vs=[];D.snapshots.forEach(s=>{const x=s.tracks.find(y=>y.n===hist.n);if(!x)return;const last=vs[vs.length-1];
  if(last&&last.x.sha===x.sha){last.also.push(s.id);return;}vs.push({s,x,also:[]});});
 const rounds=t?t.log:[];const between=(a,b)=>{const lo=a?a.x.rendered||a.s.at:"",hi=b.x.rendered||b.s.at;
  const rr=rounds.filter(r=>r.kept&&r.at>lo&&r.at<=hi),ff=w.features.filter(f=>f.at&&f.at>lo&&f.at<=hi);
  return rr.length||ff.length?`<div class=between>${rr.map(r=>`<div><b style="color:var(--amber)">${esc(r.version)}</b> ${esc(headline(r.note))}</div>`).join("")}${ff.map(f=>`<div class=eng>&#9881; engine: ${esc(f.name)} (${esc(f.who)})</div>`).join("")}</div>`:"";};
 $("#pane").innerHTML=`<h2>${esc(t?.title||"")} <span class=m>${vs.length} rendered versions across ${D.snapshots.length} snapshots</span></h2>
 <p class=intro>Pick a segment, then play it version by version to hear how it developed. Between versions: the kept rounds and the engine features that landed. Times are seconds into each version, so a section can drift as a song grows.</p>
 <audio id=hmed controls preload=none></audio>
 <div class=row style="align-items:center;flex-wrap:wrap;margin:8px 0">segment <input id=sa size=6 value="${segA!=null?mmss(segA):"0:00"}"> to <input id=sb size=6 value="${segB!=null?mmss(segB):"0:30"}">
 <button id=seta>A = playhead</button><button id=setb>B = playhead</button><button id=seq>&#9654; play the segment through every version</button><button id=stop>stop</button></div>
 <div id=vl>${vs.map((v,i)=>between(vs[i-1],v)+`<div class=ver data-i=${i}><b style="color:var(--hi)">${esc(v.x.version)}</b>
  <div><span class=m>${esc(v.s.id)}${v.also.length?` (+${v.also.length} unchanged)`:""} &middot; ${v.x.score??""} &middot; ${mmss(v.x.dur||0)} &middot; ${esc(v.s.label||"").slice(0,80)}</span></div>
  <div style="display:flex;gap:4px"><button data-p=seg>&#9654; segment</button><button data-p=all>&#9654; from start</button></div></div>`).join("")}</div>`;
 const au=$("#hmed");let stopAt=null,seqI=null;
 const play=(i,from,to)=>{const v=vs[i];$$(".ver").forEach(e=>e.classList.toggle("on",+e.dataset.i===i));hist.i=i;
  au.src=`media/${A}/${v.s.id}/t${String(hist.n).padStart(2,"0")}.mp3`;stopAt=to;au.addEventListener("loadedmetadata",()=>{au.currentTime=Math.min(from,(au.duration||from)-0.5);au.play();},{once:true});au.load();};
 au.ontimeupdate=()=>{if(stopAt!=null&&au.currentTime>=stopAt){au.pause();if(seqI!=null&&seqI+1<vs.length){seqI++;play(seqI,secs($("#sa").value),secs($("#sb").value));}else seqI=null;}};
 const ab=()=>{const a=secs($("#sa").value),b=secs($("#sb").value);if(isNaN(a)||isNaN(b)||b<=a){toast("set a segment: A before B");return null;}segA=a;segB=b;return [a,b];};
 $("#seta").onclick=()=>{$("#sa").value=mmss(au.currentTime);};$("#setb").onclick=()=>{$("#sb").value=mmss(au.currentTime);};
 $$(".ver button").forEach(b=>b.onclick=()=>{const i=+b.closest(".ver").dataset.i;seqI=null;if(b.dataset.p==="all"){play(i,0,null);return;}const s=ab();if(s)play(i,s[0],s[1]);});
 $("#seq").onclick=()=>{const s=ab();if(!s)return;seqI=0;play(0,s[0],s[1]);};$("#stop").onclick=()=>{seqI=null;au.pause();};}

// ── keys (Listen) ──
document.addEventListener("keydown",e=>{if(["TEXTAREA","INPUT","SELECT"].includes(e.target.tagName)||view!=="listen"||!media)return;
 if(e.key===" "){e.preventDefault();media.paused?media.play():media.pause();}
 else if(e.key==="n"||e.key==="N"){e.preventDefault();noteT=media.currentTime;$("#save").textContent="Note at "+mmss(noteT);$("#noteText").focus();}
 else if(e.key==="ArrowLeft")media.currentTime=Math.max(0,media.currentTime-5);else if(e.key==="ArrowRight")media.currentTime+=5;
 else if((e.key==="j"||e.key==="k")&&S){const i=S.tracks.findIndex(x=>x.n===N)+(e.key==="j"?1:-1);if(S.tracks[i])pick(S.tracks[i].n,0,true);}});
// ── keys (Questions) ──
document.addEventListener("keydown",e=>{if(["TEXTAREA","INPUT","SELECT"].includes(e.target.tagName)||view!=="questions"||e.ctrlKey||e.metaKey||e.altKey)return;
 const cards=$$("#ql .q");if(!cards.length)return;const i=Math.max(0,cards.findIndex(c=>c.dataset.q===qcur)),card=cards[i],k=e.key.toLowerCase();
 if(k==="j"||k==="k"){e.preventDefault();const c=cards[i+(k==="j"?1:-1)];if(c)qSetCur(c.dataset.q,true);}
 else if(k===" "){e.preventDefault();if(qlast&&qlast.closest(".q")===card){qlast.paused?qlast.play():qlast.pause();}else{const pl=card.querySelector(".pl");if(pl)qPlay(pl);}}
 else if(k.length===1&&k>="a"&&k<="h"){const pl=card.querySelectorAll(".pl")[k.charCodeAt(0)-97];if(pl){e.preventDefault();qPlay(pl);}}
 else if(k>="1"&&k<="9"){const c=card.querySelectorAll(".qa .chip")[+k-1];if(c){e.preventDefault();qSave(card.dataset.q,c.dataset.c);}}});
boot();
</script>
