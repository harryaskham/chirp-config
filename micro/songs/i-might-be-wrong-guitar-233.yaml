about: "Micro harness (chirper-three): I Might Be Wrong 233.5-241.5 s, the unaccompanied blues riff. Notes from the guitar stem (tools/monotrans.py --range 38-76 --hop 0.02 --min-len 0.06): a monophonic reading, so the open D2 drone sounds only where no melody note is on top. The record has ONE dry mono take panned hard right (ICC 1.0, ILD -19 dB in every band), so one track at pan +0.9 (pan +1 silences the left channel entirely: ILD -230 dB breaks the stereo measure). The album song's riff notes do not match this window (silent first 1.5 s, a 1.5 s gap). Library patch clean-dry (new; best existing was jazz-box 33.79 4-seed, m8-twang 23.72)."
